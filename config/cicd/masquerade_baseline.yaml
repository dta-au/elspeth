  classification: approved-introspection
  justification: 'The dynamic hook IS the subject under test, not a convenience. The
    production helper `_guided_source_commit_failure_detail` (src/elspeth/web/sessions/routes/_helpers.py)
    opens with `if type(tool_result) is not ToolResult: raise TypeError`, and this
    test''s whole claim is that it reaches that raise WITHOUT touching a single attribute
    of the forged object; the `__getattr__` that raises AssertionError is the tripwire
    that makes a regression observable. It is not a forwarding delegate — it delegates
    to nothing and resolves no name. Every explicit-contract alternative is strictly
    weaker: per-field tripwire properties, `__slots__ = ()`, or a spec-bound mock
    all let `getattr(obj, "<unenumerated name>", None)` return a default silently,
    which is precisely the probe shape the test exists to forbid.'
