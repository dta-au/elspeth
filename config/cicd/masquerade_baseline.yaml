- path: tests/unit/telemetry/test_delivery_metrics_contract.py
  qualname: _DynamicDeliveryMetricsExporter.__getattr__
  kind: dunder_getattr
  occurrences: 1
  probe_shapes:
  - 7c69056f4c212a909c9c8b24c81bbe8577de69e0579a9791f931faad93982b7d
  classification: approved-introspection
  justification: 'The dynamic hook IS the subject under test, not a convenience. Third-party
    exporters reach `_exporter_delivery_metrics` through the `elspeth_get_exporters`
    pluggy hook with no type gate, and a wrapper exporter that resolves `delivery_metrics`
    dynamically is the exact shape that used to make delivery accounting vanish silently
    — since Python 3.12 a `runtime_checkable` Protocol `isinstance()` resolves members
    via `inspect.getattr_static`, which bypasses `__getattr__` (ADR-032 rule 3, fixed
    in aa04a5e69). It is not a forwarding delegate: it resolves exactly one name,
    `delivery_metrics`, from its own `__dict__` and re-raises `AttributeError` for
    every other name, so it delegates to nothing. Every explicit-contract rewrite
    destroys the test: turning `delivery_metrics` into a real property makes this
    class byte-equivalent to the sibling `_DeliveryMetricsExporter` two definitions
    above (the static case is already covered there), and it also collapses `test_delivery_metrics_protocol_is_not_an_isinstance_gate`,
    which requires an object whose attribute is invisible to `getattr_static` in order
    to prove the capability Protocol cannot be used as a guard.'
