- path: src/elspeth/core/security/__init__.py
  qualname: __getattr__
  kind: dunder_getattr
  occurrences: 1
  classification: module-getattr
  justification: Module-level PEP 562 lazy-import facade over the closed _LAZY_EXPORTS
    dict. The gate is a try/except KeyError rather than an if/raise chain, so it falls
    outside this rule's flat sequential-if structural recognizer, but is the same
    closed-table idiom as the amnestied facades (PLAN.md Finding 4).
- path: src/elspeth/core/security/__init__.py
  qualname: __getattr__
  kind: getattr
  occurrences: 1
  classification: module-getattr
  justification: 'ADJUDICATED (lead, 2026-08-08): the getattr(import_module(...), attr_name)
    inside the PEP 562 lazy-export facade. Reached only after (module_name, attr_name)
    is unpacked from the closed _LAZY_EXPORTS dict; a KeyError becomes AttributeError.
    Both the receiver (a module from import_module) and the name (a dict value the
    module owns) are module-controlled, so nothing caller-supplied reaches it.'
- path: src/elspeth/engine/__init__.py
  qualname: __getattr__
  kind: getattr
  occurrences: 1
  classification: module-getattr
  justification: 'ADJUDICATED (lead, 2026-08-08): the getattr(import_module("elspeth.engine.orchestrator"),
    name) inside the PEP 562 facade, guarded by `if name in _ORCHESTRATOR_EXPORTS`
    (a closed tuple) with a terminal raise AttributeError. Same idiom and same
    reasoning as core/security and engine/orchestrator: module-owned name, module
    receiver, no masquerade surface.'
