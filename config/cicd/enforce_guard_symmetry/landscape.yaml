# Guard symmetry allowlist for Landscape loaders.
#
# One exact entry per loader whose dataclass __post_init__ validation fires
# during load(), providing read-side coverage without an explicit
# AuditIntegrityError. The GS1 fingerprint is
# sha256("GS1|<loader file>|<loader name>|<dataclass name>"), so an entry stays
# valid across line shifts and a new unguarded loader is always a new finding.
#
# Loaders with complex state validation (NodeStateLoader,
# TokenOutcomeLoader, NodeLoader, CallLoader,
# OperationLoader) correctly use explicit AuditIntegrityError
# and are NOT listed here.

allow_hits:
  # ── Lifecycle ──
  - key: "core/landscape/model_loaders.py:GS1:_module_:fp=fdb4c5c0225222b4"
    owner: "@elspeth-maintainers"
    reason: "RunLoader delegates the explicit AuditIntegrityError guard to validate_run_lifecycle_row(); Run.__post_init__ validation fires during load()."
    safety: "Read-side lifecycle invariants are enforced by validate_run_lifecycle_row, which raises AuditIntegrityError."
    expires: null

  # ── Int-only ──
  - key: "core/landscape/model_loaders.py:GS1:_module_:fp=9739141c55c892c9"
    owner: "@elspeth-maintainers"
    reason: "RowLoader (int-only): Row.__post_init__ validation fires during load(), giving read-side coverage."
    safety: "Dataclass construction in load() raises on any persisted value that violates the write-side invariant."
    expires: null
