  judge_policy_hash: 'sha256:f1b6f8bf56c4aca42b0a591ca75762788c727d9c7d023b4c036a774f86691ccb'
  judge_confidence: 0.97
  judge_rationale: |-
    RULE MISFIRES — this `isinstance` is nominal variant discrimination for an egress projection, not a defensive re-check that hides a Tier-1 contract violation. The visible code rebuilds every `TransformCompleted`, including subclasses, from explicitly selected owned fields while setting `input_hash` and `output_hash` to `None`, consistent with the stated fail-closed redaction purpose. The subject is Tier-1 engine-authored data rather than an external function parameter, so the `@trust_boundary` alternative does not apply.
