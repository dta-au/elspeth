- key: telemetry/manager.py:R6:TelemetryManager:_dispatch_to_exporters:fp=b93fc920bc7ea281
  owner: john
  reason: |-
    At telemetry/manager.py:245 in `_dispatch_to_exporters`, `except TELEMETRY_TRANSPORT_ERRORS as e:` implements per-exporter failure isolation via circuit breakers. TELEMETRY_TRANSPORT_ERRORS is the narrow tuple `(ConnectionError, TimeoutError, OSError)` (telemetry/errors.py:17-21); the in-source comment at lines 246-247 states the contract: "Transport/IO failure — isolate this exporter, don't crash. Any other exception is a programming error and propagates." The handler is explicitly NOT silent — it records the failure in three places: `breaker.record_failure()` (line 248, which drives the open-breaker skip at line 220 on subsequent events), the `self._exporter_failures[exporter.name]` operational counter (line 250), and `logger.warning` with the exporter name and circuit state (lines 251-257). The surrounding loop (line 216) then continues to the remaining exporters, so one exporter's transport failure never blocks dispatch to the others — the failure-isolation design the method docstring (lines 199-204) describes. A programming error (anything outside the narrow tuple) is deliberately left to propagate, consistent with the audit>telemetry>logger primacy order and the rule that telemetry must never crash the pipeline over a transport fault. R6 fires on "swallow without re-raise or explicit error result," but the explicit recorded outcome here — tripped breaker state plus the per-exporter failure counter that downstream health metrics consume — is exactly the explicit result R6 requires.
  safety: |-
    Suppression gated by cicd-judge; see judge_rationale below.
  expires: '2026-11-28'
  judge_verdict: ACCEPTED
