- key: telemetry/manager.py:R2:_exporter_delivery_metrics:fp=00a2962503b45844
  owner: john
  reason: |-
    `getattr(exporter, "delivery_metrics", _DELIVERY_METRICS_ABSENT)` is an ADR-032 Tier-3 parse of an OPTIONAL capability on a third-party object: exporters arrive from external pluggy plugins via `elspeth_get_exporters` with no type gate in front of them, so the presence of `delivery_metrics` is genuinely unknown and absence is a legitimate answer that every caller already handles by treating `None` as 'this exporter does not report delivery metrics'. The banned alternative is the reason this shape exists: a `runtime_checkable` Protocol `isinstance()` resolves members through `inspect.getattr_static` since Python 3.12, which bypasses `__getattr__`, so a valid third-party exporter forwarding `delivery_metrics` from a wrapped implementation failed the check and its delivery accounting vanished with no error and no log (same defect class as elspeth-9ea866438b). The `getattr` hides nothing beyond genuine absence: it absorbs only `AttributeError`, so an exporter whose `delivery_metrics` property raises anything else propagates rather than being downgraded to 'capability absent', and metrics that ARE present are then fully parsed — `type(metrics) is not dict` raises, every counter is membership-read (`metrics["attempted"]`, not `.get`), type-asserted with `type(value) is not int` and range-asserted non-negative, and the function returns a freshly constructed owned `ExporterDeliveryMetrics`. A malformed exporter is therefore loud, not ignored: raised from the export thread, `_export_loop` stores the exception and `flush()` re-raises it. The sentinel is a module-level `object()`, so no legitimate attribute value can collide with 'absent'.
  safety: |-
    Suppression gated by cicd-judge; see judge_rationale below.
  expires: '2026-11-28'
  judge_verdict: ACCEPTED
  judge_recorded_at: '2026-08-30T14:21:06.113082+00:00'
  judge_model: gpt-5.6-sol
  judge_policy_hash: 'sha256:f1b6f8bf56c4aca42b0a591ca75762788c727d9c7d023b4c036a774f86691ccb'
  judge_confidence: 0.99
  judge_rationale: |-
    PRESCRIBED FORM — this is ADR-032’s sentinel-defaulted extraction of an optional capability from a shape-unguaranteed third-party pluggy object, not defensive access under a fixed ELSPETH contract. The external provenance is verified by telemetry/factory.py:87-110 and 125-177, while telemetry/manager.py:828-871 distinguishes genuine absence as None, validates every present field, and constructs the owned snapshot without fabricated defaults. The claimed loud failure path is also verified: telemetry/manager.py:215-245 stores non-transport programming errors from the export thread, and flush() re-raises the stored exception at lines 653-675. The decorator alternative does not apply because the finding is R2, outside the decorator’s R1/R5 suppression contract.
  judge_signature_version: 2
  scope_fingerprint: 71e7a71eb4cdd374cddc2bbd9a5b05d386deb6bd9c7da9cbb658811257c7cc23
