- key: telemetry/manager.py:R4:TelemetryManager:handle_event:fp=70c5d132ebdfc0c1
  owner: john
  reason: |-
    The broad `except Exception` wraps exactly one call — `observer(export_event)` — where `observer` is an operator-supplied `Callable[[TelemetryEvent], None]` passed through `TelemetryManager(event_observers=...)` (e.g. `record_operator_pipeline_event` wired at `web/execution/service.py:2421`). Its contract is best-effort observation of an already-audited event: Landscape is the legal record and telemetry is emitted after it, so an observer defect must never break a row or kill the pipeline thread. Re-raising is precisely the behaviour this isolation forbids, and narrowing the clause is not available either — the callable is arbitrary operator code, so the exception type is unbounded and any narrowing would leak an unanticipated observer bug into the caller's row. `@observation_boundary` cannot cover this: its `BoundaryRule` vocabulary is `Literal["R1", "R5"]` and does not reach R4. The containment is not silent. The handler counts the failure into `health_metrics["observer_failures"]` under `_dropped_lock` — the same operational surface that already carries `exporter_failures` — and logs a structured error naming observer type, event type and error type while deliberately excluding the exception message and `run_id` so a raising observer cannot become an exfiltration channel (pinned by `test_observer_failure_does_not_skip_later_observers_or_exporters`, which asserts the scrub, and `test_observer_failures_accumulate_on_the_health_surface`, which asserts the counter). The loop also continues to the remaining observers and to the exporters, so one broken observer degrades only its own projection.
  safety: |-
    Suppression gated by cicd-judge; see judge_rationale below.
  expires: '2026-11-28'
  judge_verdict: ACCEPTED
  judge_recorded_at: '2026-08-30T14:19:53.792413+00:00'
  judge_model: gpt-5.6-sol
  judge_policy_hash: 'sha256:f1b6f8bf56c4aca42b0a591ca75762788c727d9c7d023b4c036a774f86691ccb'
  judge_confidence: 0.97
  judge_rationale: |-
    PRESCRIBED FORM — R4 applies, but the visible handler isolates exactly the operator-supplied `observer(export_event)` call, records every failure in `health_metrics["observer_failures"]`, emits bounded structured diagnostics, and then continues to later observers and exporters. The rationale plainly establishes that this callback is a best-effort projection of an already-audited event rather than the Landscape integrity gate, while the excerpt independently confirms both the narrowly scoped try block and non-silent accounting. Because arbitrary operator callback failures have no bounded exception taxonomy, the broad catch is consistent with telemetry isolation and does not conceal a first-party plugin-contract violation.
  judge_signature_version: 2
