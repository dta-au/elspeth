- key: telemetry/manager.py:R5:_project_event_for_egress:fp=de3cf703a92c4563
  owner: john
  reason: |-
    `isinstance(event, RowCreated)` is a nominal check against a concrete class ELSPETH defines (`elspeth.contracts.events.RowCreated`, `@dataclass(frozen=True, slots=True)`), on a Tier-1 value the engine constructed itself — the ADR-032 sanctioned form, not a Tier-3 shape guard. It is load-bearing as `isinstance` specifically, and `type(event) is RowCreated` would be a security regression: this projection exists to strip row-derived fingerprints (`content_hash`) before any event reaches a telemetry observer or exporter, and it fails closed by collapsing the event to the exact owned base contract. A future `RowCreated` subclass carrying extra hash-bearing metadata is caught by `isinstance` and rebuilt from the five explicitly copied base fields with `content_hash=None`; under an identity check it would miss both arms and fall through to `return event`, egressing row content hashes verbatim. The else-branch is therefore not a don't-care: it is the path every non-row event legitimately takes, and the subclass-catching semantics are what keep it safe.
  safety: |-
    Suppression gated by cicd-judge; see judge_rationale below.
