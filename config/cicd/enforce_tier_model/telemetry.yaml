- key: telemetry/manager.py:R4:TelemetryManager:_export_loop:fp=e310f91cc86c05b2
  owner: john
  reason: |-
    At telemetry/manager.py:188 in `_export_loop`, `except Exception as e:` is the deliberate catch-all for an unanticipated programming error inside the background `telemetry-export` thread (a non-daemon thread, constructed at lines 153-158). It is NOT a swallow and the breadth is required, for three reasons. (1) Thread boundary: an uncaught exception in a worker thread dies silently — Python does not propagate a thread's exception to the main thread — so a broad catch is the only way to avoid LOSING a programming error that occurs off the main thread. (2) It stores rather than discards: `self._stored_exception = e` (line 191), which `flush()` re-raises at lines 520-526 via try/finally (clearing the marker only after the raise). The crash is RELOCATED to the main thread at the next synchronization point, not suppressed — the same park-and-re-raise pattern already accepted for the sibling `TelemetryExporterError` handler at line 181 (entry fp=05590f539280dce7), here broadened to the catch-all because an unexpected error class cannot be enumerated in advance. (3) It `break`s the loop (line 192) to halt processing, because once an unexpected error has occurred the export thread's integrity is compromised and continuing could corrupt further events. R4's prescribed fix ("narrow the except") would DEFEAT the handler's purpose: narrowing to known exception types would let an unanticipated programming error vanish silently in the background thread with no surfaced fact. This is the inverse of the line-185 transport handler — that one continues on EXPECTED transport blips; this one catches the UNexpected and escalates it across the thread boundary to a thread that can raise. Broad catch is intentional, the exception is preserved and re-raised, and processing stops on integrity compromise; R4's silent-broad-catch concern is not met.
  safety: |-
    Suppression gated by cicd-judge; see judge_rationale below.
  expires: '2026-11-29'
  judge_verdict: ACCEPTED
  judge_recorded_at: '2026-08-31T00:55:06.151674+00:00'
  judge_model: gpt-5.6-sol
  judge_policy_hash: 'sha256:f1b6f8bf56c4aca42b0a591ca75762788c727d9c7d023b4c036a774f86691ccb'
  judge_confidence: 0.98
  judge_rationale: |-
    PRESCRIBED FORM — the broad catch at telemetry/manager.py:250-254 preserves the original exception, stops the compromised worker loop, and does not fabricate, coerce, or silently recover. The named control is verified: `TelemetryManager.flush` re-raises the stored exception at telemetry/manager.py:662-684, while `RunCeremony.safe_flush_telemetry` and the run lifecycle finally path invoke that synchronization at engine/orchestrator/ceremony.py:168-210 and engine/orchestrator/run_lifecycle.py:642-650. R4 therefore fires by surface shape, but this thread-boundary park-and-re-raise behavior is the legitimate escalation form rather than bug suppression.
  judge_signature_version: 2
