- key: composer_mcp/server.py:R6:create_server:call_tool:fp=bdaca096cb9550b6
  owner: john
  reason: |-
    The caught ValueError/TypeError is not swallowed: every completed handler path assigns `canonicalization_failed`; the first branch in `create_server.call_tool` then returns `_argument_error_result(...)`, an explicit `CallToolResult(isError=True)`, before validation or dispatch. If sentinel construction itself fails, that exception escapes. `tests/unit/composer_mcp/test_call_tool_audit.py::test_argument_canonicalization_failure_records_arg_error` pins the ARG_ERROR response and audit record.
  safety: |-
    Suppression gated by cicd-judge; see judge_rationale below.
  expires: '2026-12-06'
  judge_verdict: ACCEPTED
  judge_recorded_at: '2026-09-07T23:27:46.301973+00:00'
  judge_model: gpt-5.6-sol
  judge_policy_hash: 'sha256:f1b6f8bf56c4aca42b0a591ca75762788c727d9c7d023b4c036a774f86691ccb'
  judge_confidence: 0.99
  judge_rationale: |-
    PRESCRIBED FORM — the R6 handler does not silently swallow canonicalization failures: `create_server.call_tool` checks `canonicalization_failed` and returns the explicit error result from `_argument_error_result` before validation or dispatch (src/elspeth/composer_mcp/server.py:788). That helper produces `CallToolResult(isError=True)`, and the named pinning test `tests/unit/composer_mcp/test_call_tool_audit.py::test_argument_canonicalization_failure_records_arg_error` verifies both the ARG_ERROR response and audit record (tests/unit/composer_mcp/test_call_tool_audit.py:313). Because the finding is R6 rather than R1 or R5, the trust-boundary decorator contract does not apply.
