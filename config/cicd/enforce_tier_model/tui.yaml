  judge_policy_hash: 'sha256:f1b6f8bf56c4aca42b0a591ca75762788c727d9c7d023b4c036a774f86691ccb'
  judge_confidence: 0.98
  judge_rationale: |-
    RULE MISFIRES — these mappings are explicitly partial display caches, so an absent key represents unavailable optional enrichment rather than a malformed required record. The cache construction at tui/screens/explain_screen.py:229-230 deliberately leaves `latest_state_by_node_id` empty when focused states exist, while `_load_node_state` at tui/screens/explain_screen.py:506-515 adds execution details only when cached state exists and otherwise returns the required structural detail. The lookup neither fabricates audit data nor conceals a fixed-contract failure. The decorator does not apply because the lookup is rooted in internal screen state, not an external function parameter.
