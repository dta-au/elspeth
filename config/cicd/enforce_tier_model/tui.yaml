  judge_confidence: 0.98
  judge_rationale: |-
    RULE MISFIRES — the check discriminates among valid arms of the closed `NodeState` union; it does not revalidate the union contract or conceal a malformed value. The visible code uses `completed_at` only for the three variants that define it and uses `started_at` for `NodeStateOpen`, producing a total ordering key without fabrication or silent recovery. This is an explicit, exhaustive variant distinction under a fixed sum-type contract, and the rationale precisely identifies when that distinction would become stale. The method has no external-data parameter rooted at the finding, so the trust-boundary decorator does not apply.
