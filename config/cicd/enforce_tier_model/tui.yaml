  owner: john
  reason: |-
    R5 `isinstance(self._state, LoadedState)` in ExplainScreen.on_tree_select. ScreenState (explain_screen.py:97) is a closed discriminated union of three frozen dataclasses — UninitializedState | LoadingFailedState | LoadedState — and this narrowing is what makes the arm's body type-safe: LoadedState is the only arm carrying focused_state_by_node_id and latest_state_by_node_id, the caches the very next line reads, as well as the db/run_id the load call needs. These are ELSPETH's own concrete classes, so ADR-032 nominal discrimination applies and no structural impostor can pass. The arm is also the fast path: it deliberately calls _load_node_state with scan_for_state=False, because the cache already holds the state and a per-selection scan of every node state in the run is what this branch exists to avoid. Invalidated if: ScreenState gains a fourth arm that also carries the per-node caches, or the caches move onto a shared base class — either would make this test too narrow rather than merely unnecessary.
  safety: |-
    Suppression gated by cicd-judge; see judge_rationale below.
