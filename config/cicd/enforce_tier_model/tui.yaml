    RULE MISFIRES — the `isinstance(state, NodeStatePending)` check discriminates a concrete variant of the declared `NodeState` sum type so the renderer includes only fields that exist for that lifecycle state; it does not hide or recover from a contract violation. The surrounding exhaustive branches for `NodeStateOpen`, `NodeStateCompleted`, and `NodeStateFailed`, followed by an informative `TypeError` for unsupported variants, independently support the rationale’s site-specific account. This is internal variant dispatch rather than a Tier-3 boundary, so the decorator contract does not apply.
