  owner: john
  reason: |-
    R5 `isinstance(state, NodeStateOpen)` in _add_execution_state — the first of four ordered arms projecting the NodeState union into a NodeStateInfo display dict. It runs AFTER the fields common to every arm (state_id, token_id, status, input_hash, started_at) are written and returns immediately, because an open state has no completion timestamp, no duration and no output: this early return is what lets the following block read state.completed_at and state.duration_ms unguarded. Order matters — the union is projected widest-first, each arm returning once its arm-specific fields are added. Invalidated if: NodeStateOpen gains completion fields, which would make this early return drop data rather than protect the block below it.
