    RULE MISFIRES — the visible signature explicitly accepts two representations, `dict[str, Any] | PipelineRow`, and the concrete `PipelineRow` check discriminates those declared union arms rather than defensively revalidating a fixed contract. The branches preserve the corresponding row/contract pairing before constructing `GateResult`, so the check does not suppress, coerce, or fabricate a contract violation. This is not a Tier-3 parameter boundary suitable for `@trust_boundary`; it is first-party representation dispatch in a testing factory.
