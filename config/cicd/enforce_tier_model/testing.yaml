- key: testing/__init__.py:R5:make_success_multi:fp=c2ee51a3cd994d74
  owner: john
  reason: |-
    R5 `isinstance(r, dict)` in the row-lift comprehension of make_success_multi — the same element union as the contract loop above, but deciding something different: which rows must be CONVERTED. A dict is passed through make_row(r, contract=contract) so it adopts the single shared contract; a pre-built PipelineRow is passed through untouched, because re-wrapping it would mint a second SchemaContract instance and break the identity — not equality — that success_multi requires across rows. tests/unit/testing/test_factories.py asserts exactly that identity ('result.rows[1].contract is contract'), so a change that collapsed this branch into an unconditional make_row would be caught, while one that collapsed it the other way would silently produce rows with mismatched contracts. Justified rather than fixed for the same reason as the sibling site: the bare `list[dict[str, Any]]` narrowing that would remove both arms is rejected by the check-contracts gate, and trading a tier-model finding for a contracts violation is not an honest fix. Invalidated if: the element type becomes a single typed row form, or success_multi stops requiring shared contract identity.
  safety: |-
    Suppression gated by cicd-judge; see judge_rationale below.
