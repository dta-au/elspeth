  judge_confidence: 0.98
  judge_rationale: |-
    RULE MISFIRES — the visible signature declares a first-party union of `dict[str, Any] | PipelineRow`, and the `isinstance(r, dict)` branch discriminates those two legitimate variants to implement their explicitly different contract-building semantics; it does not hide a malformed fixed-contract value. The docstring and loop show that dict rows contribute keys to the shared synthesized contract while pre-built `PipelineRow` values already carry a contract, so the rationale is site-specific and consistent with the code. This is not a Tier-3 parameter boundary eligible for the decorator, and acceptance does not depend on the separately asserted check-contracts or test-location claims.
