- key: testing/__init__.py:R5:make_gate_continue:fp=613ec4ec970a5195
  owner: john
  reason: |-
    R5 `isinstance(data, PipelineRow)` in make_gate_continue, the first of three sibling gate factories (continue/route/fork) that share this discriminator. What it decides here: a PipelineRow argument yields row=data.to_dict() with the row's OWN contract preserved (`contract or data.contract`), while a dict is lifted through make_row and the freshly built contract wins. GateResult stores row and contract separately, so choosing the wrong contract identity produces a GateResult whose declared schema does not describe its row — the failure this branch exists to prevent. This factory's action is RoutingAction.continue_(), the no-routing case, so the contract it carries is the one the pipeline keeps using downstream, which makes contract identity matter most in this of the three siblings. config/cicd/contracts-whitelist.yaml:610 records the parameter. No in-repo caller exists, so the union is justified rather than narrowed on a guess. Invalidated if: a caller fixes the arm, or GateResult starts taking a PipelineRow directly so no dict/row lift is needed.
