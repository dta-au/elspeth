  judge_confidence: 0.97
  judge_rationale: |-
    RULE MISFIRES — the declared contract is explicitly a union of `dict[str, Any]` and `PipelineRow`, so this `isinstance(r, dict)` discriminates between two valid contract arms rather than defensively rechecking one guaranteed shape or masking a violation. The visible code establishes distinct, contract-preserving behavior: dictionaries are converted using the shared `SchemaContract`, while already-built `PipelineRow` instances remain untouched, consistent with the documented identity requirement. This is neither Tier-3 boundary handling nor a function parameter rooted in external data, so the `@trust_boundary` decorator does not apply; the rationale's test and check-gate claims are not needed to establish the exemption.
