- key: testing/__init__.py:R5:make_success_multi:fp=8a600176a0041b19
  owner: john
  reason: |-
    R5 `isinstance(r, dict)` in the shared-contract build loop of make_success_multi, over the declared element union `dict[str, Any] | PipelineRow`. TransformResult.success_multi requires every row to share one SchemaContract INSTANCE, and when no contract is supplied this loop synthesises it from the union of all dict rows' keys. The isinstance is what decides which rows CONTRIBUTE keys: a dict is raw row data whose keys must go into the union, while a PipelineRow already carries a built contract and contributes nothing to a contract that is only needed because no built one was given. Skipping the PipelineRow arm is therefore intentional, not an oversight. tests/unit/testing/test_factories.py pins the union behaviour (two dict rows with disjoint keys produce one contract carrying both). Narrowing was attempted and reverted, which is why this is J and not F: this factory's one live caller passes dicts, but rewriting the parameter as the bare `list[dict[str, Any]]` trips the check-contracts gate ('make_success_multi - rows (list)' under dict[str, Any] violations) — a form the union escapes. Clearing a tier-model finding by creating a violation on another gate is not a fix, and whitelisting it there would be sealing rather than removing. The gate asymmetry is reported to the hub separately. Invalidated if: rows gains a typed element (TypedDict or dataclass) that satisfies check-contracts, at which point the union collapses and both arms of this factory go with it.
  safety: |-
    Suppression gated by cicd-judge; see judge_rationale below.
  expires: '2026-11-28'
  judge_verdict: ACCEPTED
