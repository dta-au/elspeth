  judge_policy_hash: 'sha256:08052cb8f2c263c39dc61336444e6f2b2859292e283a902510827744f18d68da'
  judge_confidence: 0.82
  judge_rationale: |-
    PRESCRIBED FORM. The broad except wraps only `str(error)` on a plugin-supplied exception object whose `__str__` we do not control — a Tier-3 external boundary where a misbehaving `__str__` (raising arbitrary exceptions) must not crash the cleanup diagnostic path. The handler substitutes an honest `<unrepresentable {type_name}>` marker (recording absence rather than fabricating content), and the caller preserves Tier-1 integrity by re-raising `TIER_1_ERRORS` before this plugin-boundary catch. The suppressed scope is minimal (one line producing a diagnostic string) and the rationale ties directly to the R4 concern.
