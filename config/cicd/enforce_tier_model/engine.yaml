- key: engine/barrier_coordination.py:R5:BarrierIntakeCoordinator:_adopt_aggregation_row:fp=e05c90ed34ed6f71
  owner: john
  reason: |-
    Flagged pattern: `if isinstance(transform, GateSettings):` raising OrchestrationInvariantError. This is nominal NEGATIVE dispatch over a closed, ELSPETH-owned container, not a Tier-3 shape guard on external data. `transform` is the local return of `self._nav.resolve_plugin_for_node(node_id)`, whose signature is exactly `TransformProtocol | GateSettings | None` (engine/dag_navigator.py:157) and which raises OrchestrationInvariantError itself for any node that is neither plugin-bearing nor structural. The union therefore has three inhabitants and the method rejects the two known non-transform ones by name — `None` (structural coalesce/row-union node) on the preceding branch, `GateSettings` here — before asking the surviving value the only question that matters, `transform.is_batch_aware`. The isinstance is against a concrete class ELSPETH defines, which is precisely what ADR-032 prescribes for data ELSPETH owns. Critically, TransformProtocol conformance is deliberately NOT measured (ruling elspeth-8783933d99): a positive `isinstance(transform, TransformProtocol)` would be a runtime_checkable structural check, so a protocol-membership miss would masquerade as 'DAG/config inconsistency' and blame the graph for what is actually a plugin-contract defect. Naming GateSettings by its own defect keeps the three error messages attributable to three distinct causes. Not decorator-eligible: `transform` roots at a method call on `self._nav`, not at any parameter of `_adopt_aggregation_row`, so no `source_param` could ever cover it. WHAT WOULD INVALIDATE THIS: `resolve_plugin_for_node` gaining a fourth return shape (the two negative arms would no longer exhaust the non-transform inhabitants and an unhandled shape would reach `.is_batch_aware` and fail with a misattributed AttributeError); GateSettings ceasing to be a distinct owned class; or a decision to reverse elspeth-8783933d99 and dispatch positively on TransformProtocol, which would reintroduce the structural-typing masquerade this arm exists to avoid.
  safety: |-
    Suppression gated by cicd-judge; see judge_rationale below.
  expires: '2026-11-28'
