  judge_confidence: 0.98
  judge_rationale: |-
    RULE MISFIRES — the flagged `isinstance` is nominal negative dispatch against the concrete ELSPETH-owned `GateSettings` member of the stated closed return union, not defensive revalidation of a guaranteed transform shape. The visible code separately rejects `None` and `GateSettings` with specific `OrchestrationInvariantError` messages, then relies directly on the surviving transform contract without coercion, fallback, or structural `Protocol` probing. The finding is not decorator-eligible because the subject is the local result of `self._nav.resolve_plugin_for_node(node_id)`, not data rooted at an external function parameter.
