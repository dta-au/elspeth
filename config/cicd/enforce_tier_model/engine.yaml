- key: engine/error_boundary.py:R5:reraise_if_engine_crash_through:fp=ebeeba143fd8094a
  owner: john
  reason: |-
    ACCEPT as a prescribed engine exception-boundary pattern, not a Tier-1 audit-data defensive check. In `engine/error_boundary.py:19-22`, `reraise_if_engine_crash_through(exc: BaseException)` accepts `BaseException`, then uses `if not isinstance(exc, Exception): raise exc` specifically to crash-through non-operational `BaseException` subclasses instead of wrapping them as engine failures. This site is not probing audit data shape; it is the shared engine-owned boundary deciding which caught exceptions must be re-raised unchanged.
  safety: |-
    Suppression gated by cicd-judge; see judge_rationale below.
  expires: '2026-10-06'
  judge_verdict: ACCEPTED
  judge_recorded_at: '2026-07-08T12:18:43.970329+00:00'
  judge_model: anthropic/claude-4.7-opus-20260416
  judge_policy_hash: 'sha256:08052cb8f2c263c39dc61336444e6f2b2859292e283a902510827744f18d68da'
  judge_confidence: 0.9
  judge_rationale: |-
    PRESCRIBED FORM / RULE MISFIRES. The function accepts BaseException — a supertype that legitimately includes non-Exception subclasses (KeyboardInterrupt, SystemExit, GeneratorExit) which must never be wrapped as operational engine failures. The isinstance check here is the exception-taxonomy discriminator for crash-through routing, not a shape guard on audit or plugin data; it distinguishes exception categories to preserve correct raise semantics, which is exactly the offensive/structural use of isinstance. R5's concern (masking contract violations on data) does not apply to a caught-exception classifier.
