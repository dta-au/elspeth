- key: engine/orchestrator/cleanup.py:R4:_safe_cleanup_error_text:fp=f678cf61a66db302
  owner: john
  reason: |-
    `engine/orchestrator/cleanup.py:66-77` is a prescribed Tier-3/plugin-boundary diagnostic wrapper, not a Tier-1 audit-data suppression. The finding is the `except Exception:` around `raw_text = str(error)` in `_safe_cleanup_error_text`; that function is only formatting a plugin cleanup exception for scrubbed public reporting. The caller at `engine/orchestrator/cleanup.py:134-147` immediately logs and records the cleanup failure using the scrubbed text, digest, and raw length. Tier-1 corruption is not downgraded here: `run_hook` explicitly has `except contract_errors.TIER_1_ERRORS: raise` at `engine/orchestrator/cleanup.py:160-161` before the plugin-boundary `except Exception as exc:` at `engine/orchestrator/cleanup.py:162-163`. This suppression remains valid only while the broad catch is limited to unrepresentable exception text from plugin cleanup errors, i.e. `raw_text = str(error)` followed by `raw_text = f"<unrepresentable {type(error).__name__}>"`.
  safety: |-
    Suppression gated by cicd-judge; see judge_rationale below.
  expires: '2026-10-06'
  judge_verdict: ACCEPTED
  judge_recorded_at: '2026-07-08T13:14:02.851835+00:00'
