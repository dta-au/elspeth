  owner: john
  reason: |-
    This is a prescribed exception-type boundary, not a defensive shape check over Tier-1 audit data. In `CoalesceExecutor._execute_merge`, the local `metadata_for_audit` is initialized to `None` specifically for failures before merge metadata exists (`src/elspeth/engine/coalesce_executor.py:1123-1128`). The flagged `isinstance` at `src/elspeth/engine/coalesce_executor.py:1221` narrows a caught exception to the internal exception type that is documented to carry collision provenance: `if metadata_for_audit is None and isinstance(merge_exc, CoalesceCollisionError):`, then reads `merge_exc.metadata` at line 1222. Other exceptions do not get coerced or masked; cleanup records the original `type(merge_exc).__name__` and re-raises. This suppression should drift-invalidates if the site stops being exception-type discrimination for `CoalesceCollisionError.metadata` during coalesce failure cleanup.
  safety: |-
