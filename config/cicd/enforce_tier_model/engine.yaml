- key: engine/tokens.py:R5:TokenManager:create_quarantine_token:fp=cd2f5551268df70c
  owner: john
  reason: |-
    Flagged pattern: `if isinstance(source_row.row, dict):` selecting between `dict(source_row.row)` normalisation and `{"_raw": source_row.row}` envelope wrapping. This is a Tier-1 admission guard on ELSPETH's own audit-write path, not a Tier-3 parse. `SourceRow.row` is declared `Any` BY DESIGN (contracts/results.py, with the comment 'row is Any (not dict) because quarantined rows from external data may not be dicts (e.g., JSON arrays containing primitives like numbers)') — quarantine is exactly the arm that carries payloads which failed source validation, so a non-dict here is expected input, not an anomaly. The isinstance exists because the very next consumer is stricter than the field: `PipelineRow.__init__` (contracts/schema_contract.py:497) raises TypeError unless `type(data) is not dict` is false, i.e. it demands the exact builtin dict and refuses to coerce, precisely so a silently coerced list-of-tuples cannot mask corruption on a Tier-1 restore path. This branch is what makes both shapes representable in the audit trail without weakening that guard: a dict subclass (OrderedDict and friends) is flattened to a plain dict, a genuine non-mapping is preserved verbatim under `_raw` rather than being coerced or dropped. Nothing is silenced — the quarantined payload survives into `pipeline_row.to_dict()` and the epoch-fenced `create_quarantine_row_with_token` write (ADR-030 §C.4 row 9) either way. Deliberately NOT decorated: `@trust_boundary`/`@observation_boundary` is licensed only where the function 'actually parses external data', and `create_quarantine_token` parses nothing — it orchestrates a durable rows+token transaction, and this normalisation is one incidental step on the way there. Every live decorator in the tree sits on a genuine parse entry point (preflight.py, runtime_factory.py, llm/config_validation.py, llm/provider.py, aws_s3_sink.py, token_usage.from_dict); none is an engine method whose body is a DB write. A decorator would also suppress R1/R5 function-wide on every `source_row`-derived name, silently covering future `.get()` calls anywhere in this body, where the per-site entry covers exactly this one branch and falls due for judge renewal. WHAT WOULD INVALIDATE THIS: narrowing `SourceRow.row` to `dict[str, Any]` (the non-dict arm becomes dead and the guard should go); PipelineRow relaxing its exact-dict admission (the subclass-normalisation arm becomes unnecessary); or the `_raw` envelope acquiring semantics beyond opaque preservation — e.g. any consumer indexing into it — which would make this a real parse and demand a Tier-3 boundary with a malformed-input test rather than a justification.
