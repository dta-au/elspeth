- key: engine/orchestrator/heartbeat.py:R4:RunHeartbeatThread:_emit_degraded:fp=641a8d26ae2b549c
  owner: john
  reason: |-
    PRESCRIBED FORM: the residual arm of `_emit_degraded`, and it transports the failure rather than absorbing it. `contract_errors.TIER_1_ERRORS` is caught first and `SQLAlchemyError` second, so what reaches this arm is neither audit corruption nor DB availability - it is an unexpected failure of the diagnostic writer itself, or of the injected `now_fn` clock evaluated in the call arguments. Those are programming or owned-contract faults, and the handler makes them authoritative: `_capture_fatal(exc)` publishes the exception into `_fatal_exc` and sets `_fatal_event`, with `logger.error(..., exc_info=exc)` preserving the traceback. Re-raising would be strictly worse, not safer: this method is invoked from inside `_beat_once`'s `OperationalError` handler, so a raise would unwind past the beat loop and stop liveness updates entirely, while the owner learns the same fact either way through `raise_fatal_failure`. Containment here keeps the thread beating AND surfaces the failure. `FollowerProcessor._drain_loop` consumes the latch at every iteration; the fresh-run and resume finalizers consume it after joining the thread and before emitting a successful summary.
