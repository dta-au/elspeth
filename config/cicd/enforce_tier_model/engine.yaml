- key: engine/dependency_resolver.py:R6:resolve_dependencies:fp=9c825abdb31ba770
  owner: john
  reason: |-
    This is not a swallowed Tier-1/audit-data exception. In `src/elspeth/engine/dependency_resolver.py:173-182`, `resolve_dependencies` catches only the pre-run dependency settings hash failure, records the exception in `settings_hash_error`, and sets `settings_hash = None`: `except (OSError, ValueError, yaml.YAMLError) as exc:` followed by `settings_hash_error = exc`. The function then preserves the runner's pre-existing failure semantics at `src/elspeth/engine/dependency_resolver.py:185-193`; if the dependency runner itself fails, that failure is raised as `DependencyFailedError(... run_id="pre-run" ...) from exc`. If the dependency run succeeds but the auditable settings hash was unavailable, the deferred exception is reified at `src/elspeth/engine/dependency_resolver.py:203-209` with `raise DependencyFailedError(... reason=(f"Dependency settings hash failed before execution: {type(settings_hash_error).__name__}: {settings_hash_error}"), ) from settings_hash_error`. Future drift that removes the `settings_hash is None` branch or the `from settings_hash_error` chain would invalidate this suppression.
  safety: |-
    Suppression gated by cicd-judge; see judge_rationale below.
  expires: '2026-10-06'
  judge_verdict: ACCEPTED
  judge_recorded_at: '2026-07-08T12:19:37.654134+00:00'
  judge_model: anthropic/claude-4.7-opus-20260416
  judge_policy_hash: 'sha256:08052cb8f2c263c39dc61336444e6f2b2859292e283a902510827744f18d68da'
  judge_confidence: 0.85
  judge_rationale: |-
    PRESCRIBED FORM. The except block does not swallow the error — it defers it: the exception is captured in `settings_hash_error`, `settings_hash` is set to None as a sentinel, and the visible code at lines 203-209 reifies it via `raise DependencyFailedError(...) from settings_hash_error`. This is the correct deferral pattern because the runner's pre-existing failure path (lines 185-193) must take precedence when the dependency run itself fails; only a successful run needs the pre-run settings hash to be present. The exception is preserved with chain intact and surfaced as a typed DependencyFailedError, matching R6's requirement that the error be raised rather than dropped.
  judge_signature_version: 2
