- key: engine/orchestrator/preflight.py:R5:_capability_fingerprint:fp=514fb66978f585bc
  owner: john
  reason: |-
    R5 isinstance on `sink` — a third-party sink plugin instance, Tier-3 code whose shape ELSPETH does not own — against `MemberSinkEffectCapability`, a bare concrete marker class ELSPETH defines in `contracts/sink_effects.py` (not a Protocol, so ADR-032's ban on runtime_checkable structural typing does not apply; this is the nominal concrete-class credential ADR-032 Decision (1) prescribes). Subclassing the marker IS the plugin's opt-in mechanism for durable per-member effects, so `isinstance` is required and an exact `type(sink) is` test would match nothing and break the contract outright. The boolean and the bound methods it selects are folded into the capability fingerprint that `_lookup_sink_effect_admission` re-derives on every reuse of a `_SinkEffectCapabilityAdmission` receipt. Without this discrimination the fingerprint would not cover durable per-member effects at all, and a receipt issued for one sink surface would still validate after that surface changed — admitting a sink whose effect capabilities were never checked by `validate_sink_effect_capability`.
