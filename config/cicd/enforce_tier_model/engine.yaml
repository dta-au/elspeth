  judge_policy_hash: 'sha256:08052cb8f2c263c39dc61336444e6f2b2859292e283a902510827744f18d68da'
  judge_confidence: 0.85
  judge_rationale: |-
    PRESCRIBED FORM. The excerpt shows the broad-except is the tail of a two-stage handler: Tier-1 audit-integrity errors re-raise at lines 75-76 before the broad catch reaches line 77, so audit corruption still crashes. What the broad catch suppresses is strictly post-audit ceremony/telemetry failure — the original event is already recorded, and the failure is reduced to structured triage metadata (operation, error_type) and logged. This matches the policy's allowance for last-resort logging when the primary audit event has already fired, and the R4 concern (hiding bugs in the primary path) does not apply because Tier-1 escapes first. The docstring and surrounding invariants are visible in the excerpt and consistent with the rationale.
