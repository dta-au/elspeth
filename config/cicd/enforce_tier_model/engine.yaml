- key: engine/processor.py:R5:RowProcessor:_execute_transform_with_retry:is_retryable:fp=8e823b590bd4a7b6
  owner: john
  reason: |-
    RULE MISFIRES: exception classification is what this function IS, and `isinstance` is the only mechanism Python offers for it. `is_retryable` is handed to `RetryManager.execute_with_retry`, which declares it `Callable[[BaseException], bool]`; a predicate whose sole parameter is `BaseException` has no narrower static type to dispatch on, and `e` is whatever a transform raised, so nothing here guarantees a shape that this check could be redundantly re-verifying. The union is nominal against concrete classes - `ConnectionError` and `TimeoutError` are the runtime's canonical transient network failures beneath provider SDKs, and `CapacityError` is an ELSPETH-owned class that contract-declares itself retryable - never a structural `Protocol` an impostor could satisfy. The check is offensively NARROW, not defensively wide: the in-line comment records that bare `OSError` is deliberately excluded because it spans plugin bug classes such as `FileNotFoundError` and `PermissionError` that must crash rather than retry. The failure direction is safe - an unmatched exception is not retried and propagates to the row's error routing, so a false negative fails closed.
  safety: |-
    Suppression gated by cicd-judge; see judge_rationale below.
