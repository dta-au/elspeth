  judge_confidence: 0.98
  judge_rationale: |-
    RULE MISFIRES: `e` is declared only as `BaseException`, and the flagged `isinstance` performs nominal exception classification for retry policy rather than defensively rechecking a shape guaranteed by a narrower contract. The visible code checks concrete exception classes, deliberately excludes broad `OSError`, and returns false for unmatched exceptions so they propagate instead of being suppressed, coerced, or fabricated. This is not a Tier-3 parameter boundary suitable for `@trust_boundary`; the subject is an exception signal classified by the retry predicate.
