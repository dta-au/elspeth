- key: engine/executors/state_guard.py:R5:NodeStateGuard:__exit__:fp=1312f434e305d38e
  owner: john
  reason: |-
    The abandoned-attempt carve-out is the ONE path in this guard that deliberately leaves a node state OPEN as crash evidence, on the premise that a replacement generation now owns that token's terminal audit writes. It must therefore be gated on proof that scheduler ownership really was lost. SchedulerLeaseLostError and RunWorkerEvictedError are concrete ELSPETH-owned exception classes and this is ADR-032 case 1 over a genuinely unknown exc_val: BaseException | None. isinstance rather than an exact-type test because both are legitimately subclassed by more specific ownership-loss errors and an exception hierarchy is the credential. The negative branch is a loud OrchestrationInvariantError, not a fallback: abandoning a guard on any other exception is an engine bug and fails closed. Deleting the check would let any exception strand a node state permanently OPEN, which is the audit-integrity violation this whole class exists to make structurally impossible.
