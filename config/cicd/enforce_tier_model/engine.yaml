- key: engine/orchestrator/cleanup.py:R4:cleanup_plugins:run_hook:fp=f191e624a372b2ab
  owner: john
  reason: |-
    This is a prescribed Tier-3 plugin lifecycle boundary, not a Tier-1 audit-data read path. In `src/elspeth/engine/orchestrator/cleanup.py:99-104`, the enclosing `cleanup_plugins` contract says each plugin cleanup call is isolated so one plugin failure does not prevent other plugin cleanup, and collected cleanup failures are raised after teardown unless another exception is already propagating. The site-specific guard in `run_hook` preserves the Tier-1 crash rule first: `src/elspeth/engine/orchestrator/cleanup.py:160-161` says `except contract_errors.TIER_1_ERRORS:` then `raise`, so framework/audit corruption is not suppressed. Only after that does `src/elspeth/engine/orchestrator/cleanup.py:162-163` catch `except Exception as exc:` and call `record_cleanup_error(hook_label, plugin_name, exc)` for plugin hook failures. Drift that removes the `TIER_1_ERRORS` re-raise, stops aggregating failures into the later `RuntimeError`, or changes this from plugin `on_complete`/`close` teardown into an audit-data read path would invalidate this suppression.
  safety: |-
    Suppression gated by cicd-judge; see judge_rationale below.
  expires: '2026-11-29'
  judge_verdict: ACCEPTED
