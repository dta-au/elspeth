- key: engine/_best_effort.py:R4:best_effort:fp=e8640302db5e0d86
  owner: john
  reason: |-
    `src/elspeth/engine/_best_effort.py:33` defines a single context-manager boundary, `best_effort`, whose documented contract is limited to post-audit ceremony/telemetry: lines 36-42 say use it only where an audit-load-bearing event is already recorded or propagating and the wrapped work "must NEVER replace the in-flight event." The broad catch at line 77 is preceded by the Tier-1 escape hatch at lines 75-76, `except contract_errors.TIER_1_ERRORS:` / `raise`, so audit-integrity and framework-invariant failures still crash instead of being suppressed. The suppressed exception is reduced to operator-visible ceremony metadata at lines 83-84, `"operation": operation` and `"error_type": type(ceremony_failure).__name__`, then logged as `"best-effort ceremony failed during error propagation; original event preserved"` at lines 87-90. This is a prescribed last-resort post-audit ceremony/telemetry suppression, not a Tier-1 audit-data defensive-programming defect; drift that removes the Tier-1 re-raise or uses this helper outside post-audit ceremony would invalidate this suppression.
  safety: |-
    Suppression gated by cicd-judge; see judge_rationale below.
  expires: '2026-10-06'
  judge_verdict: ACCEPTED
  judge_recorded_at: '2026-07-08T12:19:24.297227+00:00'
