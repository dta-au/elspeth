    RULE MISFIRES — although the rationale incorrectly characterizes plugins as third-party Tier-3 code, the visible code establishes nominal capability discrimination rather than defensive revalidation of a guaranteed sink type. `MemberSinkEffectCapability` is stated to be an ELSPETH-defined concrete marker, and the branch visibly incorporates both the capability flag and its bound methods into `_capability_fingerprint`; the base sink contract therefore does not guarantee this optional subtype. This is consistent with the policy-prescribed use of `isinstance` to discriminate ELSPETH-owned concrete types, not structural Protocol checking or silent recovery. The decorator alternative does not apply because `_capability_fingerprint` receives an ELSPETH-owned plugin object rather than external-origin data.
