    R5 `isinstance(default, Enum)` in `_attach_default`. TIER OF THE VALUE: Tier 1. `default` is `info.default` off a pydantic `FieldInfo` belonging to a plugin config model ELSPETH itself authors — this module's docstring records that `KnobSchema` instances are Tier 1 precisely because 'we write them from plugin models we control', and names `SourceInspectionFacts` prefilled values as the separate Tier-3 input this function never sees. WHAT IT IS: not an admission or validation gate. Nothing is accepted or rejected on this line; every default reaches `field["default"]` either way. It is the projection discriminator that decides whether the value must first be lowered to `str(default.value)`. WHAT IT PROTECTS: `KnobSchema` is a wire and persisted projection that may carry only plain JSON scalars. A `StrEnum` member is a `str` SUBCLASS, and the guided turn validator `_public_json_error` (`web/composer/guided/protocol.py`) admits a string only on exact `type(value) is str`, so an unlowered member turns the server-built source form into an invariant violation at the far end of the composer flow, and anywhere it did persist it would put a live Python enum object into a durable authoring payload. Lowering here is also what keeps `default` inside the `enum` choice set published for the same field, which `_kind_for_scalar` builds as `[str(member.value) for member in inner]`; if the two disagree the form advertises a default that is not one of its own options. WHY isinstance AND NOT THE HOUSE `type(x) is C` IDIOM: `Enum` is never a member's concrete type. Every member's `type()` is the plugin-authored subclass (`ResponseFormat`, `OutputFieldType`, and any enum a future plugin declares) — an open set this module cannot enumerate — so `type(default) is Enum` is unconditionally False and the guard would silently stop lowering every enum default while still reading as a check. The exact-type idiom in this file is applied where it IS exact (`type(extra) is not dict`, `type(target) is not str`, and `type(predicate) is not dict` in `_attach_required_when` after this sweep); this site is the case that idiom does not cover. `issubclass(type(default), Enum)` is the identical test spelled to evade the R5 matcher and is deliberately not used. `_kind_for_scalar` asks the same question on the CLASS side of the same field with `isclass(inner) and issubclass(inner, Enum)`; this is its instance-side counterpart and the two must agree. PINNED BY: tests/unit/web/catalog/test_knob_schema_properties.py::test_enum_default_lowers_to_its_plain_json_value, which asserts `type(field["default"]) is str` for a `StrEnum`-defaulted field and fails outright under any exact-type rewrite of this line.
