- key: web/schema_probe.py:R4:_run_locked:fp=4bff0c0702fd1dd2
  owner: john
  reason: |-
    The broad `except BaseException as exc: cleanup_error = exc` guards the pre-unlock `if conn.in_transaction(): conn.rollback()` inside `_run_locked`'s `finally` block, which runs while a PostgreSQL advisory lock is still held. It does not swallow: the exception is CAPTURED into `cleanup_error`, and the control that decides its fate is `_finish_lock_cleanup`, called at the end of the same block - when no earlier exception exists it RAISES `SchemaLockCleanupError` from the captured error ('initialization may have completed but lock cleanup was not verified'), and when `earlier` is set it logs `schema_lock_cleanup_unverified` with both exception classes so the primary failure survives. Capturing rather than raising in place is what makes the remaining cleanup run at all: the advisory-unlock statement below this line is what releases `pg_advisory_lock`, and a rollback error escaping here would skip it and strand the lock until the connection dies, blocking every future schema initialization against that target. Broad because a rollback on a connection whose DDL just failed can raise anything from the driver, and `BaseException` so a cancellation cannot strand the lock either.
