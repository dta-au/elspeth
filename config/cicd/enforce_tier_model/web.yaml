- key: web/config.py:R5:_annotation_scalar_types:fp=0f51175124fd7fcd
  owner: john
  reason: |-
    `return {annotation} if isinstance(annotation, type) else set()` in `_annotation_scalar_types`, whose job is to flatten a Pydantic field annotation into the set of actual CLASSES it admits. The subject is a typing OBJECT, not data: `WebSettings.model_fields[...].annotation` is `Any` and may be a class (`int`), a parameterised generic (`tuple[str, ...]`), a `Literal[...]`, or a `types.UnionType` - and `isinstance(x, type)` is precisely the standard-library test for 'is this a class', which the recursive union arm above depends on to terminate. `type(annotation) is type` would be WRONG here rather than equivalent, and that is the reason this is not converted: any class with a metaclass fails an exact-type check, so a `StrEnum`-typed field (metaclass `EnumMeta`) or a nested Pydantic model (metaclass `ModelMetaclass`) would be dropped from the returned set. The consumer is `_coerce_env_scalar`, which uses the set only to decide whether to attempt `int()`/`float()` coercion of an environment string, and whose `else` path returns the value UNCHANGED for Pydantic to validate - so the empty-set arm defers to Pydantic rather than fabricating anything.
  safety: |-
    Suppression gated by cicd-judge; see judge_rationale below.
