  owner: john
  reason: |-
    This is an offensive assertion of an ELSPETH-OWNED invariant that RAISES, not a Tier-3 defensive shape probe, and it is the ADR-032 treatment of a broken owned invariant: crash, do not repair. `diagnostics` is the return value of `compute_proof_diagnostics` (web/composer/tools/generation.py), first-party code — but its declared type is `list[Mapping[str, Any]]`, so every value read out of one diagnostic is statically `Any`. `evidence = diagnostic["evidence_locator"]` followed by `if not isinstance(evidence, Mapping): raise RuntimeError("proof diagnostic evidence_locator must be a mapping")` therefore does two jobs at once. First, it fails the authoritative preflight loudly if the proof producer ever emits a non-mapping evidence_locator — the sole outcome of a failed check is the RuntimeError; nothing is defaulted, coerced, or skipped, and no `.get()` or `or {}` softens it. Second, it is the only narrowing that lets `_proof_component_type(code, evidence)` receive the value under its declared `Mapping[str, Any]` parameter, so deleting the guard would require a `cast`, converting a real crash into a silent mis-parse of the operator-facing blocking-diagnostic projection. `Mapping` (the ABC) rather than the house `type(x) is dict` idiom is required because the producer's own declared element type is `Mapping[str, Any]`: an exact-`dict` test would reject a `MappingProxyType` the producer is free to return and would turn a valid diagnostic into a spurious RuntimeError. Drift that gave `compute_proof_diagnostics` an owned typed return, or that replaced the raise with an abstain, would invalidate this justification.
