  owner: john
  reason: |-
    The flagged pattern is `except TypeError: return None` around `vars(value)`. The value is Tier-3 — an unpinned litellm/provider response object — and this handler is the boundary's declared sentinel path: `_provider_fields` carries an `@observation_boundary` whose recorded invariant is that it returns a field mapping "or None when the value is not a Mapping and has no accessible `__dict__`; never raises". `vars()` is the only way to ask that question, and it answers by raising `TypeError`; the alternatives are strictly worse under this same rule set (`hasattr` is R3, `getattr(value, "__dict__", None)` is R2). The control that makes the sentinel safe is named and one hop away: `_provider_field` is the sole reader and returns `None` for every field when `fields is None`, and each of its call sites in `_parse_response_tool_calls` converts a `None` field into an explicit terminal `raise PipelinePlannerError(..., code="MALFORMED_RESPONSE")` — "planner response must contain exactly one choice", "planner response choice is missing its message". Nothing downstream treats an unreadable provider object as a successful parse.
