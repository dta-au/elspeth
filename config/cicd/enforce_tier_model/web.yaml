- key: web/paths.py:R6:_is_uuid_path_segment:fp=5022bddee24b8a6b
  owner: john
  reason: |-
    `except ValueError: return False` is the NEGATIVE ANSWER of a predicate, not a swallowed error: `_is_uuid_path_segment` asks whether one path segment parses as a UUID, and `ValueError` is precisely how `uuid.UUID` reports 'this string is not a UUID'. `return False` is therefore the function's contracted result for that input, and there is no other outcome it could report - the signature is `-> bool`. The clause is deliberately narrow and was narrowed in this change: the previously-caught `AttributeError` was removed because the sole call site passes `raw.parts[1]`, and `Path.parts` is `tuple[str, ...]`, so a non-string cannot reach here and a wrong-typed caller must now crash rather than be silently reported as 'not a UUID'. The security direction is deliberate and is why `uuid.UUID` is kept in preference to a narrower regex: in `resolve_sink_data_path` a True result keeps an explicitly session-scoped FOREIGN path foreign so the caller's allowlist rejects it, while False adopts the path under the caller's own output directory - so accepting every spelling `UUID` accepts (braced, urn, dashless) is the conservative choice, and a narrower parser would silently adopt foreign-looking segments it failed to recognise.
