    The flagged pattern is `isinstance(exc, PipelinePlannerError)`, the third arm of `plan_pipeline`'s exception summary classifier. The value is an ELSPETH-owned exception instance (Tier-1), checked nominally per ADR-032, and the arm logs the closed `exc.code`. The final `else` logs only `type(exc).__name__` — deliberately a type name and never message content — so nothing untrusted reaches the log regardless of which arm matches. The handler re-raises unconditionally, so no classification outcome can hide a failure. `PlannerDeclined` is declared `class PlannerDeclined(PipelinePlannerError)` in this same module, so the planner error hierarchy is OPEN by design and the exact-type idiom `type(exc) is PipelinePlannerError` would MISROUTE every decline: at `plan_pipeline` the `PlannerDeclined` arm is deliberately ordered ahead of the `PipelinePlannerError` arm precisely because the subclass must be classified first, and at `_PlannerAttemptTrail.finalize_active_exception` a decline must still fall into the `PipelinePlannerError` arm to reach `exc.code`. Converting these sites to `type(...) is` is therefore a behaviour change, not a refactor.
