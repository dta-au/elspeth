- key: web/schema_probe.py:R4:_invalidate_uncertain:fp=937873903d28423c
  owner: john
  reason: |-
    The broad `except BaseException as invalidation_error` wraps exactly one call - `conn.invalidate()` - and the function's whole purpose, stated in its docstring, is that a secondary cleanup fault must never replace the original. `_invalidate_uncertain` is only ever called from an exception path (`_run_locked`'s `OperationalError` and `BaseException` lock-acquisition handlers, and `_finish_lock_cleanup`), each of which immediately re-raises the ORIGINAL exception or raises `SchemaInitBusyError` / `SchemaInitError` / `SchemaLockCleanupError` derived from it. Letting an invalidate() failure propagate would destroy that diagnosis and replace a precise 'another schema initialization is in progress' with a pooling internal error. It must be broad because `conn.invalidate()` reaches DBAPI driver teardown on a connection already known to be in an uncertain state - the failure surface is whatever psycopg/psycopg2/SQLAlchemy raises on a half-dead socket. The failure is recorded, not lost: `_slog.error('schema_connection_invalidation_failed', original_exc_class=..., invalidation_exc_class=...)` emits both exception class names, so an operator sees the cleanup fault alongside the cause; class names only, because this runs against a connection whose exception text carries DSN and host detail.
