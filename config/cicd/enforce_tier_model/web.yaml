- key: web/execution/accounting.py:R6:load_run_accounting_map_from_db:fp=56896f8577f7d6ba
  owner: john
  reason: |-
    R6 `except ValidationError as exc:` around the per-run `RunAccounting(...)` construction. The exception is pydantic's, raised when shape-valid counts still contradict the response model's cross-field invariants (token balance, routing subsets). The handler is an ACCUMULATOR, not a swallow — the documented healthiest validator shape in this tree (docs/agents/recent-code-hints.md, 2026-08-29 R6-on-accumulator entry): it names the failure by writing `corrupt[run_id] = RunAccountingCorruption(landscape_run_id=run_id, violations=_bounded_violations([...]))`, so the run ships an explicit corruption marker INSTEAD of accounting and no closure claim is possible for it. The controls, by symbol: (a) `RunAccountingCorruption` + `_bounded_violations` carry the per-run integrity fact into `RunAccountingBatch.corrupt`; (b) the single-run reader `load_run_accounting_from_db` re-reads that map and RAISES `ValueError` with the violations for its own caller, so the run's own completion path fails loudly rather than settling a status off missing accounting; (c) `RunAccountingBatch.accounting` never gains an entry for a corrupt run, so no consumer can read a defaulted or partial number. Per-run isolation is the point: this is a batch reader for the operator run list, and one run's contradiction must not 500 the whole batch or erase healthy runs' accounting. The pydantic messages appended are field names and counts only (`include_url=False, include_context=False, include_input=False`), so no payload text leaks into the violation strings. Invalidated if the handler ever stops writing a `corrupt` entry, if it starts constructing a partial/defaulted `RunAccounting`, or if `load_run_accounting_from_db` stops raising on a corrupt entry.
