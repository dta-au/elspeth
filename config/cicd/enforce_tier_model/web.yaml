- pattern: web/composer/guided/chat_solver.py
  rules:
  - R5
  reason: Tier 3 boundary — Step-1 source and Step-2 sink chat solvers parse LLM
    tool-call JSON. isinstance checks reject malformed fields (plugin, filename, mime_type,
    content, options, observed_columns, sample_rows, assistant_message, function.arguments
    for the source parser; outputs, plugin, options, required_fields, schema_mode,
