  owner: john
  reason: |-
    The flagged pattern is `except ValueError as exc:` whose body assigns rather than returns, so the rule's `_handler_is_silent` test (no `raise`, no non-default `return`) fires even though the handler has an explicit, audited outcome. The value is Tier-3: the exception comes from `_PlannerTerminalPayload.model_validate(deep_thaw(call.arguments))`, i.e. the model's terminal tool-call arguments failing our own canonical schema. The handler's outcome is `terminal_feedback`, and the controls that consume it are named and unavoidable: `_feedback_error_codes(terminal_feedback)` extracts the closed rejection codes, `trail.finish_attempt(..., "candidate_rejected", codes=...)` writes the rejection into the attempt trail, the feedback is appended to `messages` as the tool reply so the model sees exactly why its candidate was refused, and `repair_count`/`repair_budget` bound the loop — exhaustion raises `_rejection_exhausted()`. A malformed candidate therefore never reaches `finalized_pipeline`; the `if terminal_feedback is None:` gate stands between this handler and every acceptance path. Two restructurings were considered and rejected: returning from a helper (`_validated_terminal_payload`) would clear the finding only by moving it out of sight behind indirection, which this project forbids; splitting into `except PydanticValidationError` / `except ValueError` produces two silent handlers instead of one and leaves the count unchanged.
