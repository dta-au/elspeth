  reason: |-
    R6 `except OSError: continue` around `fs_path.resolve()` inside the `for fs_path in fs_paths` loop. The value is Tier 3 (an artifact's recorded filesystem path resolved against real on-disk state). `continue` does not end the classification: it abandons only THIS path and lets the loop test the remaining `fs_paths` against the blob / payload / outputs layouts, so a multi-path artifact is still classified from whichever of its paths resolves. When no path resolves into a known layout the loop terminates at the function's final `return "unknown"` — the explicit, documented outcome, and the conservative one: `unknown` asserts nothing about internal-storage status the function could not verify, which is exactly the direction that keeps a raw configured sink path from leaking back into the UI (elspeth-52af16f9ae, the frontend regex heuristic this discriminator replaced). Classification is deliberately independent of on-disk existence — `Path.resolve()` does not require the target to exist, so only a genuine FS error (ELOOP, permission, broken component) reaches this handler, and a merely purged blob still classifies as `blob`. Nothing is defaulted permissively and no audit record is altered. R6 misfires because `continue` is neither a raise nor a non-default return. Invalidated if the handler starts returning a concrete storage kind, or if `unknown` ever becomes a permissive/authorizing answer rather than the withholding one.
