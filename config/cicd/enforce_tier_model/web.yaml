  owner: john
  reason: |-
    The flagged pattern is `isinstance(exc, PipelinePlannerError)`. The value is an ELSPETH-owned exception instance (Tier-1: `PipelinePlannerError` is defined in this module), not Tier-3 payload, so this is the nominal check ADR-032 sanctions for what ELSPETH owns. It protects the attempt trail: the arm reads `exc.code` to record which closed `ComposerPlannerCode` ended the attempt (MALFORMED_RESPONSE, RESPONSE_TRUNCATED, the budget-exhaustion set, DECLINED) an unrecognized planner code maps to `ComposerPlannerAttemptOutcome.GUARD_FIRED`, and anything that is not a `PipelinePlannerError` (or a cancellation) maps to `ComposerPlannerAttemptOutcome.INTERNAL_ERROR` with `planner_code=None` - the attempt trail records only that CLOSED outcome vocabulary, never a free-form class name, so a planner failure is never recorded with a code it did not carry. (The bounded `type(exc).__name__` fallback lives elsewhere: in `plan_pipeline`'s exception classifier feeding `trail.log_summary`, which emits a log summary string, not the attempt-trail outcome.) `PlannerDeclined` is declared `class PlannerDeclined(PipelinePlannerError)` in this same module, so the planner error hierarchy is OPEN by design and the exact-type idiom `type(exc) is PipelinePlannerError` would MISROUTE every decline: at `plan_pipeline` the `PlannerDeclined` arm is deliberately ordered ahead of the `PipelinePlannerError` arm precisely because the subclass must be classified first, and at `_PlannerAttemptTrail.finalize_active_exception` a decline must still fall into the `PipelinePlannerError` arm to reach `exc.code`. Converting these sites to `type(...) is` is therefore a behaviour change, not a refactor.
