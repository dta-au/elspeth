- key: web/readiness.py:R7:_cancel_wrapped_on_loop:fp=52ca77e6d0dcf248
  owner: john
  reason: |-
    `contextlib.suppress(RuntimeError)` around `loop.call_soon_threadsafe(cancel_and_drain)` - already the NARROW form (not `BaseException`), catching the one documented failure of that API: scheduling onto a loop that closed after the check. `_cancel_wrapped_on_loop` is called from `ReadinessProbeRunner.close()`, which runs on an arbitrary thread while the probe's owning loop may be shutting down concurrently, so `loop.is_closed()` on the line above is a necessary but not sufficient test - the loop can close between that test and the scheduling call. The suppressed `RuntimeError` therefore reports a condition under which the work is already unnecessary rather than a fault: a closed loop has no pending callbacks to leak, the wrapper future is unreachable, and the source future is cancelled unconditionally by the `for future in futures: future.cancel()` loop in `close()` immediately afterwards - that loop, plus `self._executor.shutdown(wait=False, cancel_futures=True)`, is the control that guarantees teardown completes whether or not the loop-side cancel was ever scheduled. Raising here would make closing the runner fail on a benign shutdown ordering.
