  judge_confidence: 0.99
  judge_rationale: |-
    RULE MISFIRES — the `isinstance(annotation, type)` check discriminates runtime typing metadata to determine whether the annotation object is an actual class; it does not defensively revalidate Tier-1 or Tier-2 data or mask a contract violation. The visible recursive union handling and `_coerce_env_scalar` consumer support the site-specific rationale: unsupported annotation forms yield an empty set, after which the original environment string remains unchanged for Pydantic validation, so no value is fabricated or silently accepted. This is not a function-scoped Tier-3 data boundary rooted in an external parameter, so the decorator contract does not apply.
