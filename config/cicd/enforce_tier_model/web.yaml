- key: web/doctor.py:R4:_initialize_database:fp=5b4e209b6e2a8819
  owner: john
  reason: |-
    The broad `except Exception as exc` guards `engine.dispose()` in `_initialize_database`'s `finally` block. As in `_inspect_database`, it does not discard anything - it REBINDS `result` to `ContractCheck(label, False, sanitize_error(f'{...} engine disposal failed', exc))`, so a disposal fault downgrades an otherwise-successful initialization to a reported failure rather than being ignored. That downgrade is the honest verdict: after DDL against a live external database, a pool that will not dispose means connections may be leaked, and an operator must not read the run as cleanly complete. Broad because disposal reaches driver-level socket teardown. `Exception` rather than `BaseException` is precisely what makes the `assert result is not None` after the `finally` sound - its in-source comment records that a `BaseException` propagates out of the `finally` rather than leaving `result` unset, so the assertion documents an invariant instead of masking one. Re-raising is the behaviour this function exists to prevent: `elspeth-web doctor` must return a COMPLETE report, and `_collect_deployment_checks` runs this alongside roughly twenty other `ContractCheck`s, so one raising probe would abort every remaining check and leave an operator with less information than they started with. The failure is recorded, not lost - the handler returns an explicit `ContractCheck(name, False, ...)`, a first-class failed result that `doctor`'s report renders and exits non-zero on. `sanitize_error` is the named redaction control: it is defined in this module as `f'{context} ({type(exc).__name__})'`, so only a static context string and the exception CLASS reach the report - never the exception's message, which for these probes carries import paths, credentials-bearing URLs, and third-party detail.
  safety: |-
    Suppression gated by cicd-judge; see judge_rationale below.
