- key: web/readiness.py:R1:ReadinessProbeRunner:run:source_done:fp=57818e907372d4c5
  owner: john
  reason: |-
    `if self._futures.get(label) is completed:` in the `source_done` completion callback is an IDENTITY compare-and-delete under `self._lock`, and the `.get` is the load-bearing half of it. The callback fires when one specific worker future finishes, and it may only remove the registry entry if that entry is still THIS future - a later `run()` for the same label may already have replaced it, and deleting the successor's entry would let a third concurrent probe be admitted for a label that is still in flight, defeating the single-flight invariant. Both branches are handled: `is completed` deletes, anything else (a successor future, or `None` because the entry was already reaped) correctly leaves the registry alone. A membership read is not available - the docstring above `add_done_callback` records that a future which completed synchronously invokes this callback INLINE, so the entry may legitimately be absent, and `KeyError` here would escape into a `concurrent.futures` callback with no caller to receive it.
  safety: |-
    Suppression gated by cicd-judge; see judge_rationale below.
  expires: '2026-11-28'
  judge_verdict: ACCEPTED
