- key: web/composer/pipeline_planner.py:R7:_await_custody_settlement:fp=405c4457d11e63fb
  owner: john
  reason: |-
    The flagged pattern is `with suppress(BaseException): task.result()`. This call exists ONLY to observe the finished custody task's outcome so asyncio does not report an unretrieved task exception; its return value is discarded by construction. The suppression is what keeps that observation from replacing the cancellation the caller is entitled to see — the in-source comment states exactly this ("Observe a custody failure without replacing the active cancellation"). Both suppressions sit inside an `except asyncio.CancelledError:` arm that ends in a bare `raise`, so the original cancellation is preserved unconditionally — the control is that trailing `raise`, which no path through the handler can skip. On the NORMAL (uncancelled) path the awaited work is not wrapped in any suppression at all: `await asyncio.shield(task)` propagates a settlement/custody failure to the caller exactly as it would without this function. The suppressions therefore change behaviour only while the request task is already being torn down, where re-raising would replace the active `CancelledError` and break asyncio's cancellation contract. `BaseException` rather than `Exception` is required because the settled task may itself have been cancelled.
  safety: |-
    Suppression gated by cicd-judge; see judge_rationale below.
  expires: '2026-11-29'
  judge_verdict: ACCEPTED
  judge_recorded_at: '2026-08-31T01:14:34.725632+00:00'
  judge_model: gpt-5.6-sol
  judge_policy_hash: 'sha256:f1b6f8bf56c4aca42b0a591ca75762788c727d9c7d023b4c036a774f86691ccb'
  judge_confidence: 0.96
  judge_rationale: |-
    RULE MISFIRES — the suppressed exception from `await asyncio.shield(task)` is not silently lost: `_await_custody_settlement` drains the task, inspects its terminal state with `task.exception()`, chains any custody failure onto the active cancellation, and then unconditionally re-raises that cancellation. The uncancelled path awaits the task without suppression, while a cancelled child still reaches the trailing bare `raise`; thus every visible path preserves the caller's cancellation and the task outcome is either propagated normally, surfaced as the cancellation's cause, or represented by the task's cancelled state. Although the rationale initially misquotes the suppressed expression as `task.result()`, its site-specific explanation matches the visible control flow and establishes why R7's silent-ignore premise is false here.
