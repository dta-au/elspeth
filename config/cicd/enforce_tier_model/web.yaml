    The broad `except BaseException as exc: cleanup_error = exc` guards the advisory-unlock statement itself - `SELECT pg_catalog.pg_advisory_unlock(...)` and its `scalar_one()` - inside `_run_locked`'s `finally` block. This is the most safety-critical of the three cleanup handlers, because failing to unlock strands the schema-init lock for the target. Note that the same `cleanup_error` variable is also set on the NON-exception path immediately above, when the unlock query returns anything but `True` (`cleanup_error = RuntimeError('unlock was not confirmed')`): an unconfirmed unlock and a raised unlock are treated as the same reportable condition, which is what makes this handler an explicit error path rather than a swallow. `_finish_lock_cleanup` is the control - it invalidates the connection through `_invalidate_uncertain` so the pool cannot hand out a session still holding the lock, then either raises `SchemaLockCleanupError` from the captured error or, when an earlier exception is already in flight, logs `schema_lock_cleanup_unverified` naming both classes. Broad because the failure surface is a DBAPI round-trip on a connection in an unknown state.
