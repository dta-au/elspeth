  owner: john
  reason: |-
    `isinstance(exc, PydanticValidationError)` is subclass-inclusive ON PURPOSE and is the redaction control itself, not a probe of parsed data. `exc` is an arbitrary in-flight exception from the run's failure path (first-party control flow, not Tier-3 input); the branch selects the ONLY safe rendering for a pydantic `ValidationError`, whose `str()` interleaves a raw `input_value=...` fragment per error — the config/row payload the audit trail deliberately keeps out of `runs.error`. The function's own docstring records why: `scrub_text_for_audit` replaces candidate-secret PATTERNS only, so an arbitrary payload sails through the scrubber intact, and the safe rendering is instead built from `_schema_contract_violation_errors` (dotted `loc` plus the pydantic error `type`, never the input). Converting to the house exact-type idiom `type(exc) is PydanticValidationError` is a SECURITY REGRESSION rather than a style change: a `ValidationError` subclass — pydantic's own or a library's — would fall through to `_scrubbed_exception_message` and re-open exactly the leak this branch exists to close. The docstring already states this commitment ("`isinstance` — not the exact-type check the schema-contract slog uses for its closed taxonomy — so a ValidationError subclass cannot reintroduce the leak"). Pinned by tests/unit/web/execution/test_service.py::TestOperatorFailureDiagnostic::test_pydantic_input_values_never_reach_runs_error.
