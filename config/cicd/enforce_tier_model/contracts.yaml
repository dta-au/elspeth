- key: contracts/results.py:R5:TransformResult:__post_init__:fp=2ef8dd1c548b443e
  owner: john
  reason: |-
    R5 fires on `isinstance(action, str)` in `TransformResult.__post_init__`, where `action = success_reason.get("action")`.

    TIER-1 FROZEN-DATACLASS POST-INIT GUARD ON PLUGIN-BUG DATA. `success_reason` is a `TransformSuccessReason` TypedDict that ELSPETH's own transform contract requires plugins to supply via `TransformResult.success(row, success_reason={'action': ...})`. TypedDict is erased at runtime, so nothing enforces the `action: str` field except this check. The error message says exactly what class of fault this is: "Missing success_reason['action'] is a plugin bug." A plugin bug must crash (data manifesto), which is why this is a `raise ValueError` and why a tier-3 boundary decorator is structurally inapplicable -- `@trust_boundary` rejects tier=1/2 at import.

    WHY IT MATTERS THAT IT IS A `str`: `action` is written into the audit trail as the recorded reason a row succeeded. A non-str action would either serialise into a shape the audit schema does not expect or render as a Python repr in the operator-facing explanation.

    WHAT WOULD INVALIDATE THIS. If `TransformSuccessReason` became a validated runtime model (pydantic or an owned frozen dataclass) that guarantees `action: str` at construction, this guard would be genuinely redundant and should be deleted rather than re-signed.
