  owner: john
  reason: |-
    R5 fires on `isinstance(url, SanitizedWebhookUrl)` in `ArtifactDescriptor.for_webhook`.

    Same credential-egress control as `for_database`, over a DIFFERENT and narrower guarantee, which is why it is a separate owned type rather than a shared one. `SanitizedWebhookUrl.from_raw_url()` removes userinfo, sensitive query/fragment parameters, and KNOWN Slack incoming-webhook path tokens; the method's own docstring is explicit that "Other path-borne secrets are not generically redacted." So the type is a claim about a specific, enumerated set of token forms having been removed, and only `from_raw_url` can honestly make it. A duck-typed object exposing `.sanitized_url` would put an unredacted webhook token into `webhook://{url.sanitized_url}` in the audit trail.

