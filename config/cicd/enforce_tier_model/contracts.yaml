- key: contracts/results.py:R5:ArtifactDescriptor:for_database:fp=60faf94aa51ce7e3
  owner: john
  reason: |-
    R5 fires on `isinstance(url, SanitizedDatabaseUrl)` in `ArtifactDescriptor.for_database`.

    THIS IS A CREDENTIAL-EGRESS GUARD, AND NOMINAL TYPING IS THE CONTROL. `SanitizedDatabaseUrl` is an ELSPETH-owned class whose only honest constructor is `from_raw_url()`, which strips credentials. The descriptor built here writes `db://{table}@{url.sanitized_url}` straight into the audit trail. The inline comment states the requirement: "Type safety: enforce SanitizedDatabaseUrl, not duck-typed objects." A structural/duck-typed check would accept any object exposing `.sanitized_url` and `.fingerprint` -- including a raw-URL wrapper that never ran sanitisation -- and a database password would be persisted in the audit trail. This is precisely the case ADR-032 forbids solving with a `runtime_checkable` Protocol, because an impostor passes structural typing.

    It raises `TypeError` naming the remediation; it does not coerce. Tier-1 crash semantics, so not a @trust_boundary candidate.

    WHAT WOULD INVALIDATE THIS. If `SanitizedDatabaseUrl` gained a constructor that can produce an instance without sanitising, the type would stop being proof of sanitisation and this guard would become misleading rather than protective -- re-judge at that point, and move the check to the property that actually attests sanitisation.
