- key: contracts/plugin_context.py:R5:plugin_context_scope:fp=0bffe7619ba30846
  owner: john
  reason: |-
    THIS SITE (entry arm, `node_id`). `node_id` carries the id of the node the plugin call is attributed to. This is the ASSIGNING arm: it runs before `yield ctx`, and it decides whether the caller's `node_id` overwrites `ctx.node_id` for the duration of the scope. Skipping the guard here would write the `_CONTEXT_SCOPE_UNSET` object itself onto `ctx.node_id`; inverting it would leave the caller's value unapplied, so every audit row written during the scope would be attributed to the previous node, or to the sentinel object itself. The docstring names exactly this hazard: "state/token/contract attribution cannot leak into the next plugin call on the same context."

    R5 fires on `isinstance(<param>, _ContextScopeUnset)` in `plugin_context_scope`. `_ContextScopeUnset` is defined 4 lines above the function in this same module and has exactly one instance, `_CONTEXT_SCOPE_UNSET`, used as the parameter default -- an ELSPETH-owned concrete class, so ADR-032 puts this on the 'nominally type what we own' side, not the 'parse what we don't' side. No external data reaches this check: every argument is executor-supplied metadata. The sentinel exists because `None` is a MEANINGFUL value for each of these fields, so 'caller passed None' and 'caller passed nothing' cannot be distinguished by a `None` default.

    WHY isinstance AND NOT `is not _CONTEXT_SCOPE_UNSET`. The identity form does not narrow the union for mypy: probed under `mypy --strict` on this repo's config, `if node_id is not _UNSET: ctx.node_id = node_id` fails with "Incompatible types in assignment (expression has type 'str | _Unset | None', variable has type 'str | None')", while the `isinstance` form type-checks clean. Rewriting these 14 guards to identity comparisons would therefore require 14 casts or `type: ignore`s and would REMOVE the static proof that a sentinel can never be written onto the context. The `isinstance` is load-bearing for type safety, not a shape guard over untrusted input.

    WHAT WOULD INVALIDATE THIS. If `_ContextScopeUnset` ever gained a second instance, or if `node_id` stopped accepting `None` as a meaningful value (making a plain `None` default sufficient), or if the parameter's type annotation dropped the `_ContextScopeUnset` arm, this guard would no longer be the narrowing that keeps the sentinel off the context and should be re-judged.
  safety: |-
    Suppression gated by cicd-judge; see judge_rationale below.
