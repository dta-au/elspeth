- key: contracts/results.py:R5:_require_artifact_metadata:fp=4baf0185d7ea5e4a
  owner: john
  reason: |-
    R5 fires on `isinstance(value, MappingProxyType)` in `_require_artifact_metadata`.

    `MappingProxyType` is a stdlib type used here as ELSPETH's own frozen-mapping marker, and the check is deliberately narrower than `Mapping`: a plain `dict` MUST fail it. That is the whole point -- artifact metadata is stored in the audit trail, and a mutable mapping could be changed after the descriptor was constructed, so the recorded evidence would no longer match what was attested. Accepting `Mapping` here would accept `dict` and silently reopen that hole.

    TIER-1 INTEGRITY, CRASH ON ANOMALY. The guard raises `TypeError(f"{field_name} must be a frozen mapping, got ...")`. It is a construction-time invariant on ELSPETH-owned ArtifactDescriptor state, not a parse of external input, so a tier-3 boundary decorator would be a category error.

