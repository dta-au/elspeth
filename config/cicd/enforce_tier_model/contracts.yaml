  judge_confidence: 0.99
  judge_rationale: |-
    RULE MISFIRES — the check discriminates an explicitly annotated, ELSPETH-owned sentinel arm from the meaningful `str | None` value; it does not revalidate or conceal a contract violation. The visible default `_CONTEXT_SCOPE_UNSET`, union annotation, guarded assignment, and matching restoration establish that `isinstance` preserves the distinction between omission and an explicit `None` while preventing the sentinel from entering `ctx.node_id`. No external data is involved, so this is not a Tier-3 boundary and the decorator does not apply.
