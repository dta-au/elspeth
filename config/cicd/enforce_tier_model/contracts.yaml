  judge_confidence: 0.95
  judge_rationale: |-
    PRESCRIBED FORM — the visible code uses nominal `isinstance` discrimination to enforce that a credential-bearing URL has been promoted into the ELSPETH-owned `SanitizedDatabaseUrl` type before its `sanitized_url` is persisted in the Tier-1 audit trail. The guard neither coerces nor fabricates: it raises an informative `TypeError` directing callers to `SanitizedDatabaseUrl.from_raw_url()`, while the rationale plainly explains why structural admission would not attest sanitisation. This is an offensive runtime-enforcement point for an otherwise unenforced annotation, not silent recovery or a redundant attempt to tolerate malformed Tier-2 data. The decorator is inapplicable because `url` is required to arrive as an already-promoted owned value rather than being parsed here as Tier-3 input.
