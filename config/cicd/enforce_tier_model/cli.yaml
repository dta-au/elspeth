per_file_rules:
- pattern: cli.py
  rules:
  - R1
  - R4
  - R6
  reason: CLI handles user input, env vars, and external system checks (Tier 3)
  expires: '2026-10-06'
- pattern: cli.py
  rules:
  - R5
  reason: Type discrimination for plugin dispatch, SQLite URI parsing, and raw YAML
    secrets validation. Bumped 5 to 8 on 2026-09-09 because the live count is 8, all
    R5 of the classes already named above. Transitional debt scheduled for replacement
    by precise signed dispositions in 0.8.1.
  expires: null
  max_hits: 8
- pattern: cli_helpers.py
  rules:
  - R1
  reason: resolve_audit_passphrase reads env vars (Tier 3 boundary) - .get() returns None to signal absent passphrase
  expires: null
