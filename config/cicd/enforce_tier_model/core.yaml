  owner: john
  reason: |-
    database.py:793 `if isinstance(bind, Connection):`. FLAGGED PATTERN: isinstance narrowing a union this codebase declares itself. The parameter is annotated `bind: Engine | Connection` — an ELSPETH-owned signature over two SQLAlchemy classes — and the branch exists because the two arms carry different RESOURCE OWNERSHIP contracts, not merely different types. A `Connection` was opened by the caller and is very likely inside an open transaction, so this function must execute `PRAGMA user_version` on it directly and must NOT close it; an `Engine` owns no live connection, so this function opens its own with `with bind.connect()` and closes it on exit. Collapsing the branches either leaks a connection per call or closes a caller's transaction out from under it. This is exactly the ADR-032 'nominally type what ELSPETH owns' case: the union is ours, both arms are enumerated, and neither is a defensive guess about malformed data. What this specific site reads is the SQLite schema epoch, and the surrounding function is fail-closed by construction — `scalar_one()` raises if the PRAGMA returns no row rather than defaulting the epoch, so a corrupt target cannot be silently treated as compatible. INVALIDATED IF: the signature narrows to a single type (the branch is then dead code and should be deleted rather than re-justified), or the Engine arm stops using a context manager, since 'the Engine arm cleans up after itself' is half of why the split is justified.
