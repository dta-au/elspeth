    suppress(FileExistsError) around os.mkdir(part, mode=0o700, dir_fd=current) is not error swallowing: FileExistsError IS the success case of an idempotent, race-hardened directory walk — it means another process created this component first. The suppression is exactly one concrete exception type; PermissionError, NotADirectoryError and every other OSError still propagate. The postcondition is re-established and PROVEN by the very next statement, os.open(part, O_RDONLY|O_DIRECTORY|O_NOFOLLOW, dir_fd=current), which raises if the name is not a directory or is a symlink, and by the trailing stat check that rejects any root whose mode has group or other bits. Replacing it with a pre-existence check would open the TOCTOU window this content store is specifically hardened against (the O_NOFOLLOW/dir_fd walk exists for that reason); replacing it with try/except FileExistsError: pass would trade R7 for R6 with strictly less clarity. The value is Tier-2 operator-supplied export path, and what this protects is the audit-export content store's private-directory invariant.
