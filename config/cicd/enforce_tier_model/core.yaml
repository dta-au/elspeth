- key: core/template_materialization.py:R1:TemplateOptionMaterializer:materialize_config:fp=3520f3809c1fc492
  owner: john
  reason: |-
    This is a load-time config boundary, not Tier-1 audit data. In `src/elspeth/core/template_materialization.py:85-91`, `materialize_config()` copies caller-supplied `raw_config`, iterates only the optional plugin collections named by `PLUGIN_OPTION_COLLECTIONS`, and uses `collection = config.get(collection_name)` to distinguish an absent optional `"transforms"`/`"aggregations"` section from a present list that needs file-backed option expansion. The immediately following guard, `if not isinstance(collection, list): continue`, leaves missing or non-list config shape for the config validator rather than treating it as trusted internal state. This suppression is valid only while this site remains the pre-validation materialization pass over raw user config and only materializes optional plugin collection lists.
  safety: |-
    Suppression gated by cicd-judge; see judge_rationale below.
  expires: '2026-10-06'
  judge_verdict: ACCEPTED
  judge_recorded_at: '2026-07-08T12:22:46.022635+00:00'
