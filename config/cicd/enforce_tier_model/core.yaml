  judge_confidence: 0.96
  judge_rationale: |-
    RULE MISFIRES — the narrowly scoped AttributeError is used to classify a third-party SQLAlchemy statement that does not satisfy the structural `_TableBearingStatement` Protocol, rather than to suppress a failure in first-party guaranteed data. The visible code consistently treats non-table-bearing statements and statements for tables other than `calls` as the legitimate not-applicable result `None`, while a missing first-party `context.compiled` attribute raises `AuditIntegrityError`. This is site-specific, non-duplicated justification for an optional structural capability check, not silent recovery, coercion, or fabrication.
