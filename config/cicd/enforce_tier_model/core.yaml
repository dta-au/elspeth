    operations.py:209 `if isinstance(db_error, contract_errors.TIER_1_ERRORS):`. FLAGGED PATTERN: isinstance classifying a caught exception. This is the crash-versus-propagate decision for an audit-write failure, and the classification is the whole point rather than a guard bolted on: `track_operation`'s `finally` block calls `recorder.complete_operation(...)`, and if that raises, the run has a completed operation with no audit record — a Tier-1 integrity violation. The rule is that a Tier-1 error (corruption, framework bug, invariant violation) propagates UNCONDITIONALLY as `raise db_error from original_exception`, overriding any in-flight operation-level exception, because audit corruption is categorically worse than any failure the operation itself hit; anything else defers to `original_exception` and propagates only when the operation had actually succeeded. The isinstance is not a substitute for a narrower `except` clause and must not be rewritten into one: the `logger.critical` audit-trail-incomplete record above it has to be emitted identically for BOTH classes, so splitting into `except contract_errors.TIER_1_ERRORS` / `except Exception` would duplicate that logging block and create two places for it to drift — a worse structure adopted only to move a lint finding. `TIER_1_ERRORS` is a tuple of exception classes ELSPETH defines in its own contracts module, so this is nominal typing over an owned taxonomy, and no arm is silent: every path either re-raises `db_error`, re-raises the original, or lets the original propagate, and all of them have already logged. INVALIDATED IF: `TIER_1_ERRORS` starts including third-party exception classes ELSPETH does not define (the tuple would stop being an owned taxonomy); the `logger.critical` call moves out of the shared path, since 'both classes need the same log' is the reason this is a classification rather than two except clauses; or any arm stops re-raising and starts swallowing the audit failure.
  safety: |-
