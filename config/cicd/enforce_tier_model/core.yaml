  judge_policy_hash: 'sha256:08052cb8f2c263c39dc61336444e6f2b2859292e283a902510827744f18d68da'
  judge_confidence: 0.85
  judge_rationale: |-
    RULE MISFIRES. This is a pre-validation materialization pass over raw user-supplied config (Tier-3 external-origin data) — `raw_config` is a Mapping whose shape has not yet been validated. The optional plugin collection keys (`transforms`, `aggregations`, etc.) may legitimately be absent, and `.get()` here distinguishes absent from present-but-malformed, with the following `isinstance` check deferring shape validation downstream rather than fabricating a default. This is the honest Tier-3 boundary read pattern, not a defensive re-check of first-party contract data.
