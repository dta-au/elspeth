- key: core/landscape/journal.py:R6:LandscapeJournal:_payload_ref_columns_from_context:fp=56960750ec96887e
  owner: john
  reason: |-
    core/landscape/journal.py:404 `except AttributeError: return None` classifies the compiled SQLAlchemy statement flowing through the journal's execution-event hook. The journal observes EVERY statement on the landscape connection; only INSERTs into the payload-backed 'calls' table carry payload-ref columns, and statement objects are third-party SQLAlchemy Core constructs whose `.table` attribute exists only on table-bearing statement classes — the `_TableBearingStatement` Protocol (core/landscape/journal.py:64-66) records exactly this structural, not asserted, typing. An AttributeError from `cast('_TableBearingStatement', statement).table` (journal.py:402-405) therefore means 'not a table-bearing statement' — the same designed not-applicable outcome as the explicit `if table.name != 'calls': return None` on the following line (journal.py:406-407), recorded as None (no payload-ref columns), never a fabricated value. The tier split within this same function is deliberate and proves the contrast: the preceding probe of `context.compiled` — our own first-party execution-context contract — RAISES AuditIntegrityError on absence (journal.py:395-398) instead of degrading. The None consumer is the payload-capture branch at journal.py:189-191, which simply records no _payload_ref_columns for non-'calls' statements, the designed majority case. INVALIDATED IF: the except at journal.py:404 is widened beyond AttributeError, the `context.compiled` probe stops raising AuditIntegrityError, or payload-ref derivation stops being scoped to the 'calls' table.
  safety: |-
    Suppression gated by cicd-judge; see judge_rationale below.
  expires: '2026-10-24'
  judge_verdict: ACCEPTED
