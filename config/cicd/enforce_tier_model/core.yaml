  owner: john
  reason: |-
    The IntegrityError is not swallowed -- it is bound to conflict and carried structurally out of the handler, and every subsequent path consumes it. If the post-CAS find_winner returns None the exception is re-raised as the explicit __cause__ of AuditIntegrityError('audit-export registry CAS collided without an exact reusable winner'); if a winner is found, conflict decides inserted=conflict is None, which is the durable audit record of whether THIS caller performed the insert. No evidence is lost on any path. The handler is empty of raise and return only because the decision needs a database read that must happen outside the rolled-back begin_nested savepoint, which is why R6's structural test fires. Raising inside the handler is the wrong alternative: this is a compare-and-swap over an immutable audit-export registry where a concurrent identical registration is the expected benign race, and converting it into a hard export failure would discard the reusable winner the CAS exists to find and would make concurrent exporters of the same run fail nondeterministically. The candidate is still proved equal to that winner by _assert_candidate_equals_winner before anything is returned, so a genuine divergence still fails closed.
