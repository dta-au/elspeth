    StopIteration here is the generator return protocol, not an error, and the handler consumes it rather than discarding it: 'bundle = stop.value' binds the AuditExportSpooledBundle that stream_audit_export_bundle_to_spool declares as its return type (src/elspeth/contracts/audit_export.py:1342-1350, Generator[dict[str, ClosedAuditExportJSON], None, AuditExportSpooledBundle]), and the line after the loop yields deep_thaw(bundle.final_manifest) from it -- so the export's final manifest, the hash-chain terminus of the audit bundle, exists only because this handler ran. Catching it is required, not stylistic: export_run is itself a generator (exporter.py:432-436, returning Iterator[dict[str, Any]]), so under PEP 479 a StopIteration escaping this frame would be converted to RuntimeError and destroy the export mid-stream instead of terminating it cleanly. Reading stop.value is also the only way to recover a sub-generator's return value while transforming what it yields: 'for record in stream' and 'next(stream, sentinel)' both discard the return value, and 'yield from' would forward records un-thawed. R6 fires only because the handler's outcome is an assignment plus break rather than a raise or return, and a raise here would abort every successful export. Genuine failures are untouched: any exception from next(stream) other than StopIteration -- including the derivation's own record, byte, and chunk ceiling refusals -- is not caught by this clause and propagates to the caller.
