- key: core/landscape/database.py:R5:_shared_connection_lock:fp=4773aab7b3d07948
  owner: john
  reason: |-
    database.py:210 `if not isinstance(engine.pool, StaticPool):`. FLAGGED PATTERN: isinstance on a library class used as a dispatch control. `engine.pool` is a SQLAlchemy `Pool`, and `StaticPool` is the one concrete implementation that shares a SINGLE DBAPI connection across every thread; every other pool SQLAlchemy ships (the production `QueuePool`, `NullPool`, `SingletonThreadPool`) hands out a connection per thread. The isinstance is a capability test on a concurrency contract, and the class identity IS the contract — there is no attribute or public flag on `Pool` that reports 'shares one connection', so a structural probe would have nothing honest to read. Returning `None` here is not a swallowed failure, it is the documented lock-free fast path: the block comment above the function records that file-backed production engines already get safety from QueuePool plus WAL/BEGIN IMMEDIATE/busy_timeout, and that making them take an app-level lock would regress the epoch-21 multi-writer design. The narrow direction of the test is what keeps it honest — an unrecognised future pool falls into the `None`/no-lock arm, which is correct for every per-thread-connection pool and only unsafe for another connection-sharing pool. INVALIDATED IF: production moves off `QueuePool` onto a connection-sharing pool, or SQLAlchemy adds a second `StaticPool`-like class; either makes the unrecognised-pool arm wrong and the test must become an explicit allow-list of per-thread pools that raises on anything unknown. Also invalidated if `StaticPool` stops being test-only in this codebase, since the whole rationale for a lock this narrow is that only `LandscapeDB.in_memory()` reaches it.
