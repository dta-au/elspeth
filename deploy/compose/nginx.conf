# Include this file from nginx's http context (for example conf.d/elspeth.conf).
# Host nginx terminates TLS and proxies the Compose web port. Provision these
# certificate files before nginx -t; restrict direct access to backend port 8451.
map $http_upgrade $elspeth_connection_upgrade {
    default upgrade;
    '' close;
}

log_format elspeth_safe '$remote_addr $request_method $uri $status '
                        'request_time=$request_time upstream_time=$upstream_response_time';

server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/tls/elspeth/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/elspeth/privkey.pem;
    client_max_body_size 100m;

    # $uri excludes query credentials. Never add $request or $args here.
    access_log /var/log/nginx/elspeth-access.log elspeth_safe;
    # nginx error messages may include the entire credential-bearing request.
    # Stock nginx cannot redact them; safe access statuses/timings remain above.
    error_log /dev/null crit;

    location / {
        proxy_pass http://127.0.0.1:8451;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $elspeth_connection_upgrade;
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
        proxy_buffering off;
    }
}
