# Add this file together with docker-compose.yaml. It deliberately rewires the
# CLI service whenever PostgreSQL is provisioned; there is no independently
# enableable database profile that leaves ELSPETH pointing at SQLite.

services:
  elspeth:
    environment:
      DATABASE_URL: postgresql+psycopg://elspeth:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres:5432/elspeth_landscape
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: elspeth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/compose/postgres-init.sql:/docker-entrypoint-initdb.d/10-elspeth-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elspeth -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  postgres-bootstrap:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    command:
      - psql
      - --host
      - postgres
      - --username
      - elspeth
      - --dbname
      - postgres
      - --set
      - ON_ERROR_STOP=1
      - --file
      - /bootstrap/postgres-init.sql
    volumes:
      - ./deploy/compose/postgres-init.sql:/bootstrap/postgres-init.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
