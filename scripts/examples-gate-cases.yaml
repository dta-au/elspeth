# ---------------------------------------------------------------------------
# Cases. Statuses: exit 0 = completed, exit 1 = completed_with_failures
# (PARTIAL), exit 2 = failed.

cases:
  # ---- Standalone (AGENTS.md "Standalone", run pattern L58-L61) -------------
  - id: audit_export
    example: audit_export
    command: elspeth run --settings examples/audit_export/settings.yaml --execute
    expect_exit: [0]
    configs: [examples/audit_export/settings.yaml]
    expectation_source: "AGENTS.md L27: 8 rows"
    audit:
      - {db: examples/audit_export/runs/audit.db, runs: 1, status: [completed], source_rows: 8}

  - id: batch_aggregation
    example: batch_aggregation
    command: elspeth run --settings examples/batch_aggregation/settings.yaml --execute
    expect_exit: [0]
    configs: [examples/batch_aggregation/settings.yaml]
    expectation_source: "AGENTS.md L28: 15 rows"
    audit:
      - {db: examples/batch_aggregation/runs/audit.db, runs: 1, status: [completed], source_rows: 15}

  - id: batch_error_routing
    example: batch_error_routing
    command: elspeth run --settings examples/batch_error_routing/settings.yaml --execute
    expect_exit: [1]
    configs: [examples/batch_error_routing/settings.yaml]
    expectation_source: "AGENTS.md L29, L86: 12 rows, PARTIAL/exit 1, 3 rows to failed_batches, 3 totals"
    audit:
      - db: examples/batch_error_routing/runs/audit.db
        runs: 1
        status: [completed_with_failures]
        source_rows: 12
        sinks: {failed_batches: 3, totals: 3}

  - id: batch_error_routing.discard
    example: batch_error_routing
    command: elspeth run --settings examples/batch_error_routing/settings_discard.yaml --execute
    expect_exit: [1]
    configs: [examples/batch_error_routing/settings_discard.yaml]
    expectation_source: "AGENTS.md L29, L87: 12 rows, PARTIAL/exit 1, the 3 rows recorded as quarantined and written nowhere, 3 totals"
    audit:
      - db: examples/batch_error_routing/runs/audit_discard.db
        runs: 1
        status: [completed_with_failures]
        source_rows: 12
        sinks: {totals: 3}

  - id: batch_error_routing.declared
    example: batch_error_routing
    command: elspeth run --settings examples/batch_error_routing/settings_declared.yaml --execute
    expect_exit: [1]
    configs: [examples/batch_error_routing/settings_declared.yaml]
    expectation_source: "AGENTS.md L29, L88: 12 rows, PARTIAL/exit 1, the bad value routed on its own row before the batch, 4 totals"
    audit:
      - db: examples/batch_error_routing/runs/audit_declared.db
        runs: 1
        status: [completed_with_failures]
        source_rows: 12
        sinks: {totals: 4, failed_rows: 1, failed_batches: 0}

  - id: batch_rank_passthrough
    example: batch_rank_passthrough
    command: elspeth run --settings examples/batch_rank_passthrough/settings.yaml --execute
    expect_exit: [0]
    configs: [examples/batch_rank_passthrough/settings.yaml]
    expectation_source: "AGENTS.md L30: 12 rows, 7 shortlist + 5 remaining, 12 tokens, 0 parent links"
    audit:
      - db: examples/batch_rank_passthrough/runs/audit.db
        runs: 1
        status: [completed]
        source_rows: 12
        sinks: {shortlist: 7, remaining: 5}
        sql:
          - name: tokens_and_parent_links
            query: "SELECT (SELECT COUNT(*) FROM tokens WHERE run_id=:run_id), (SELECT COUNT(*) FROM token_parents WHERE run_id=:run_id)"
            expect: [[12, 0]]

  - id: batch_rank_passthrough.transform
    example: batch_rank_passthrough
    command: elspeth run --settings examples/batch_rank_passthrough/settings_transform.yaml --execute
    expect_exit: [0]
    configs: [examples/batch_rank_passthrough/settings_transform.yaml]
    expectation_source: "AGENTS.md L30: 12 rows, 7 shortlist + 5 remaining, 24 tokens, 12 parent links"
    audit:
      - db: examples/batch_rank_passthrough/runs/audit_transform.db
        runs: 1
        status: [completed]
        source_rows: 12
        sinks: {shortlist: 7, remaining: 5}
        sql:
          - name: tokens_and_parent_links
            query: "SELECT (SELECT COUNT(*) FROM tokens WHERE run_id=:run_id), (SELECT COUNT(*) FROM token_parents WHERE run_id=:run_id)"
            expect: [[24, 12]]

  - id: report_assemble
    example: report_assemble
