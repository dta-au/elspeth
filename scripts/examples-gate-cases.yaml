# Data file for scripts/examples-gate.sh — which shipped examples run offline,
# how each is run, and what each must produce.
#
# Source of truth for every expectation is examples/AGENTS.md (cited as
# "AGENTS.md L<n>", line numbers as of the tree this file was derived from) or,
# where that table is silent, the example's own README or self-verifying
# launcher (cited as such). Counts that are neither stated there nor asserted by
# a launcher are NOT encoded: those cases assert exit code, terminal status and
# a non-zero source row count only.
#
# `scripts/examples_gate.py validate` refuses this file if any example
# directory, top-level pipeline config or launcher in the tree is missing here,
# so a new example cannot be silently left out of the gate.
#
# Classes: NON-NETWORK (runs fully offline; loopback fixture servers count as
# offline), NETWORK (needs a real provider, cloud service or internet),
# CONTAINER (offline but only inside the Docker image), NOT-A-PIPELINE, UNSURE.
#
# Case fields:
#   command      run from the case's tree root with `bash -c`, exactly as documented
#   server       a fixture server the documentation tells the operator to start first
#   ports        loopback ports the case binds; shown in the plan
#   env          extra environment the documented command sets
#   fingerprint_key  the documentation tells the operator to export ELSPETH_FINGERPRINT_KEY
#   expect_exit  accepted exit codes of `command`
#   configs      every pipeline config the case executes (offline guard input)
#   requires     python_modules / files that must already exist (never downloaded)
#   log_markers  strings a self-verifying launcher prints only after its own assertions pass
#   audit        read-only checks against the case's audit DB(s) after the run:
#                db, mode (run_mode, default live), runs (expected count of such runs;
#                omitted = not asserted), run_index (which run to check, default -1),
#                status, source_rows, sinks {name: completed outcomes}, outcomes
#                {"outcome/path": n}, conservation (every row has exactly one terminal
#                outcome, and failures carry a transform_errors reason), sql
#   skip         reason string; the case is reported SKIP and never run

