# blob_csv_expand, INLINE arm (`source: field`).
#
# No payload store, no blob_ref, no staging script: the CSV text arrives as an
# ordinary column of the input file and is expanded in place. Compare with
# settings_expand_csv_blobs.yaml, which parses the identical CSV bytes out of
# the payload store — the parser, the options and the error taxonomy are shared;
# only where the bytes come from differs.
sources:
  primary:
    plugin: csv
    on_success: inline_payloads
    options:
      path: examples/blob_transforms/input/inline_csv_payloads.csv
      schema:
        mode: fixed
        fields:
        - 'record_id: str'
        - 'source_label: str'
        - 'csv_text: str'
      on_validation_failure: discard

transforms:
- name: expand_inline_csv
  plugin: blob_csv_expand
  input: inline_payloads
  on_success: output
  on_error: expansion_failures
  options:
    source: field
    text_field: csv_text
    # Identical to settings_expand_csv_blobs.yaml: the embedded document's
    # header line is skipped and the column names are declared, so DAG
    # validation knows the emitted fields at build time.
    skip_rows: 1
    columns:
    - id
    - text
    include_row_index: true
    row_index_field: csv_row_index
    schema:
      mode: fixed
      fields:
      - 'record_id: str'
      - 'source_label: str'
      - 'csv_text: str'

sinks:
  output:
    plugin: csv
    on_write_failure: discard
    options:
      path: examples/blob_transforms/output/expanded_inline_csv_rows.csv
      # csv_text is deliberately ABSENT, and this is the half of the inline arm
      # most worth understanding.
      #
      # The inline arm CONSUMES its text column: the whole CSV document lives in
      # that field, so copying it onto every emitted row would multiply the
      # source bytes by the expansion factor — into the audit payload store, not
      # just memory. The transform therefore declares
      # `removed_input_fields: {csv_text}` and drops it, exactly as line_explode
      # and json_explode drop the row field they consume.
      #
      # Every OTHER upstream column still survives (record_id, source_label),
      # which is what `forwards_input_fields` exists to promise — the transform
      # forwards the row minus one named column, and a locked downstream
      # consumer can still see the rest.
      #
      # LISTING csv_text here would now be the build-time error, since a fixed
      # sink schema demands every declared field be present. The blob arm is the
      # opposite: it reads a hash rather than the document, consumes nothing, and
      # keeps blob_ref on every row — compare settings_expand_csv_blobs.yaml.
      schema:
        mode: fixed
        fields:
        - 'record_id: str'
        - 'source_label: str'
        - 'id: str'
        - 'text: str'
        - 'csv_row_index: int'
  expansion_failures:
    plugin: json
    on_write_failure: discard
    options:
      path: examples/blob_transforms/output/inline_csv_failures.jsonl
      format: jsonl
      schema:
        mode: observed

landscape:
  url: sqlite:///examples/blob_transforms/runs/inline_csv_audit.db
