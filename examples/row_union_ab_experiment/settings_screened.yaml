# Row Union Variant — Screening Gate Before The Fork
#
# A production-shaped topology: tickets below a quality floor are screened
# out of the experiment before it ever forks, so the run exercises both the
# success path (screened rows to a sink) and the row_union's own release path
# with a clean, unconditional roster.
#
#   source ─(routed)─> [quality_screen] ─(pass)─> [variant_fork] ─┬─ control_branch ──> tag_control ───────┐
#                                        └─(fail)─> screened_out   └─ treatment_branch ─> tag_treatment ────┤
#                                                                                                ├─ [variant_union]
#                                                        ─(experiment_in)─> [prompt_experiment] ─> output
#
# WHAT THIS DEMONSTRATES: a screening gate ahead of a fork-based row_union
# group, so tickets that fail the screen never mint a fork branch and never
# create a partial-group obligation at the barrier at all.
#
# `quality_screen` routes tickets whose baseline_quality is below 60 straight
# to the `screened_out` sink — this now happens BEFORE `variant_fork`, so a
# screened ticket's row never enters the fork/row_union bound region (spec §7
# rule 4: no path may leave a bound region except through its closer, and a
# gate that could route straight to a sink from INSIDE the region is rejected
# flat at build time — screening ahead of the fork is the correct shape for
# this decision, and the settled-mid-branch variant that pairs with this one,
# `settings_screened_at_settlement.yaml`, demonstrates the alternative when
# the screening predicate is only knowable AFTER the fork).
#
# With this input, 3 of 8 tickets are screened out (quality 45, 53, 58), so:
#   - 5 tickets fork, complete both arms, and release as complete pairs
#     -> 10 rows into batch_experiment_compare
#   - 3 tickets never fork at all; their rows land in screened_out
#
# The comparison is therefore computed over the 5 surviving tickets only —
# which is the correct answer, not a silently biased one. Unlike the
# pre-ruling-23 in-branch screen, no group is ever partially formed and lost,
# so the run completes SUCCESS (exit 0) with no failure-adjudication records.

sources:
  primary:
    plugin: csv
    on_success: routed
    options:
      path: examples/row_union_ab_experiment/input.csv
      schema:
        mode: fixed
        fields:
        - 'id: int'
        - 'ticket: str'
        - 'baseline_quality: int'
      on_validation_failure: discard

gates:
- name: quality_screen
  input: routed
  condition: "row['baseline_quality'] >= 60"
  routes:
    'true': to_fork
    'false': screened_out

- name: variant_fork
  input: to_fork
  condition: "True"
  routes:
    'true': fork
    'false': output
  fork_to:
    - control_branch
    - treatment_branch

transforms:
- name: tag_control
  plugin: value_transform
  input: control_branch
  on_success: control_scored
  on_error: discard
  options:
    schema:
      mode: observed
    operations:
    - target: prompt_variant
      expression: "'control'"
    - target: score
      expression: "row['baseline_quality'] * 1.0"

- name: tag_treatment
  plugin: value_transform
  input: treatment_branch
  on_success: treatment_scored
  on_error: discard
  options:
    schema:
      mode: observed
    operations:
    - target: prompt_variant
      expression: "'treatment'"
    - target: score
      expression: "row['baseline_quality'] * 1.25"

row_unions:
- name: variant_union
  branches:
    control_branch: control_scored
    treatment_branch: treatment_scored
  on_success: experiment_in

aggregations:
- name: prompt_experiment
  plugin: batch_experiment_compare
  input: experiment_in
  on_success: output
  on_error: discard
  trigger: {}
  output_mode: transform
  options:
    schema:
      mode: observed
    variant_field: prompt_variant
    score_field: score
    baseline_variant: control

sinks:
  output:
    plugin: json
    on_write_failure: discard
    options:
      path: examples/row_union_ab_experiment/output/screened_comparison.json
      format: jsonl
      schema:
        mode: observed

  screened_out:
    plugin: json
    on_write_failure: discard
    options:
      path: examples/row_union_ab_experiment/output/screened_out.json
      format: jsonl
      schema:
        mode: observed

landscape:
  url: sqlite:///examples/row_union_ab_experiment/runs/screened.db
