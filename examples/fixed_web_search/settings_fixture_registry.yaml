sources:
  primary:
    plugin: csv
    on_success: searches
    options:
      path: examples/fixed_web_search/input.csv
      schema:
        mode: fixed
        fields:
          - 'id: int'
          - 'search_text: str'
      on_validation_failure: discard
transforms:
  - name: search_page
    plugin: web_scrape
    input: searches
    on_success: results
    on_error: search_failures
    options:
      url: http://127.0.0.1:8213/registry
      query_fields: {term: search_text}
      content_field: result_html
      fingerprint_field: result_fingerprint
      format: raw
      records:
        field: candidates
        selector: section.results article
        max_records: 10
        columns:
          - field: name
            selector: h2 a
            required: true
          - field: detail_path
            selector: h2 a
            attribute: href
            required: true
          - field: registration
            selector: .registration
            required: true
      http:
        abuse_contact: examples@example.com
        scraping_reason: Local public registry fixture
        timeout: 5
        allowed_hosts:
          - 127.0.0.0/8
      schema: {mode: observed}
sinks:
  results:
    plugin: json
    on_write_failure: discard
    options:
      path: examples/fixed_web_search/output_registry/results.jsonl
      schema: {mode: observed}
      format: jsonl
  search_failures:
    plugin: json
    on_write_failure: discard
    options:
      path: examples/fixed_web_search/output_registry/failures.jsonl
      schema: {mode: observed}
      format: jsonl
landscape:
  url: sqlite:///examples/fixed_web_search/runs_registry/audit.db
payload_store:
  base_path: examples/fixed_web_search/runs_registry/payloads
concurrency:
  max_workers: 1
