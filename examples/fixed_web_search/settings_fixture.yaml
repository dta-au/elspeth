sources:
  primary:
    plugin: csv
    on_success: searches
    options:
      path: examples/fixed_web_search/input.csv
      schema:
        mode: fixed
        fields:
          - 'id: int'
          - 'search_text: str'
      on_validation_failure: discard
transforms:
  - name: search_page
    plugin: web_scrape
    input: searches
    on_success: results
    on_error: search_failures
    options:
      url: http://127.0.0.1:8213/directory
      query_fields: {q: search_text}
      content_field: result_html
      fingerprint_field: result_fingerprint
      format: raw
      http:
        abuse_contact: examples@example.com
        scraping_reason: Local public search fixture
        timeout: 5
        allowed_hosts:
          - 127.0.0.0/8
      schema: {mode: observed}
sinks:
  results:
    plugin: json
    on_write_failure: discard
    options:
      path: examples/fixed_web_search/output/results.jsonl
      schema: {mode: observed}
      format: jsonl
  search_failures:
    plugin: json
    on_write_failure: discard
    options:
      path: examples/fixed_web_search/output/failures.jsonl
      schema: {mode: observed}
      format: jsonl
landscape:
  url: sqlite:///examples/fixed_web_search/runs/audit.db
payload_store:
  base_path: examples/fixed_web_search/runs/payloads
concurrency:
  max_workers: 1
