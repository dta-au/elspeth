sources:
  primary:
    plugin: json
    on_success: searches
    options:
      path: examples/fixed_web_search/input_form.jsonl
      format: jsonl
      schema:
        mode: fixed
        fields:
          - 'id: int'
          - 'search_text: str'
          - 'search_form: any'
      on_validation_failure: discard
transforms:
  - name: search_page
    plugin: web_scrape
    input: searches
    on_success: results
    on_error: search_failures
    options:
      url: http://127.0.0.1:8213/form-search
      method: POST
      request_form_field: search_form
      content_field: result_html
      fingerprint_field: result_fingerprint
      format: raw
      records:
        field: candidates
        selector: main li
        max_records: 10
        columns:
          - field: name
            required: true
      http:
        abuse_contact: examples@example.com
        scraping_reason: Local POST search fixture
        timeout: 5
        allowed_hosts:
          - 127.0.0.0/8
      schema: {mode: observed}
sinks:
  results:
    plugin: json
    on_write_failure: discard
    options:
      path: examples/fixed_web_search/output_form/results.jsonl
      schema: {mode: observed}
      format: jsonl
  search_failures:
    plugin: json
    on_write_failure: discard
    options:
      path: examples/fixed_web_search/output_form/failures.jsonl
      schema: {mode: observed}
      format: jsonl
landscape:
  url: sqlite:///examples/fixed_web_search/runs_form/audit.db
payload_store:
  base_path: examples/fixed_web_search/runs_form/payloads
concurrency:
  max_workers: 1
