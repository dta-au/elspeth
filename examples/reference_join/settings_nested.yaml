# reference_join — nested JSON reference table, with a sparse entry
#
# Same join, richer values. A CSV table is flat, so every value is one
# subscript deep; a JSON table can nest, and the output expressions address
# that nesting with the engine's ordinary subscript grammar.
#
# products.json is also deliberately SPARSE: "socks" carries no tax member
# while every other entry does. That is the case on_miss governs at field
# granularity — the socks row still gets its description and price, and takes
# the configured default for the one value the table could not supply.

sources:
  primary:
    plugin: csv
    on_success: enrich_products
    options:
      path: examples/reference_join/orders.csv
      on_validation_failure: quarantine
      schema:
        mode: observed

transforms:
  - name: enrich_products
    plugin: reference_join
    input: enrich_products
    on_success: output
    on_error: quarantine
    options:
      schema:
        mode: observed
      reference_file: products.json
      reference_format: json
      key_field: product
      reference_key_name: sku
      output:
        product_description: "ref['description']"
        unit_price: "ref['pricing']['unit_price']"
        currency: "ref['pricing']['currency']"
        tax_rate: "ref['tax']['rate']"
      # A path that does not resolve inside an entry that DID match is treated
      # exactly like an absent key, per output field. Under `default` the row
      # survives with a stated fallback rather than silently carrying nothing.
      on_miss: default
      default_values:
        product_description: "(unlisted)"
        unit_price: 0.0
        currency: "AUD"
        tax_rate: 0.0

sinks:
  output:
    plugin: csv
    on_write_failure: discard
    options:
      path: examples/reference_join/output/enriched_orders_nested.csv
      schema:
        mode: observed
  quarantine:
    plugin: csv
    on_write_failure: discard
    options:
      path: examples/reference_join/output/quarantine_nested.csv
      schema:
        mode: observed

landscape:
  url: sqlite:///examples/reference_join/runs/audit_nested.db
