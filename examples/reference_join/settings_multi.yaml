# Three independent lookups share one atomic reference_join transform.
# CSV references resolve beside this settings file; the source path resolves
# from the repository root. A later failing lookup quarantines the ORIGINAL
# row, including when earlier lookups matched or supplied defaults.
sources:
  primary:
    plugin: csv
    on_success: enrich_order
    options:
      path: examples/reference_join/orders_multi.csv
      on_validation_failure: quarantine
      schema:
        mode: observed

transforms:
  - name: enrich_order
    plugin: reference_join
    input: enrich_order
    on_success: output
    on_error: quarantine
    options:
      schema:
        mode: observed
      tables:
        products:
          reference_file: products.csv
          reference_format: csv
        regions:
          reference_file: regions.csv
          reference_format: csv
        taxes:
          reference_file: tax_rates.csv
          reference_format: csv
      lookups:
        - table: products
          key_field: product
          reference_key_name: sku
          output:
            product_description: "ref['description']"
            unit_price: "ref['unit_price']"
          on_miss: default
          default_values:
            product_description: Unlisted product
            unit_price: "0.00"
        - table: regions
          key_field: region_code
          reference_key_name: code
          output:
            region: "ref['region']"
          on_miss: default
          default_values:
            region: Unmapped region
        - table: taxes
          key_field: tax_code
          reference_key_name: code
          output:
            tax_rate: "ref['rate']"
          on_miss: fail

sinks:
  output:
    plugin: csv
    on_write_failure: discard
    options:
      path: examples/reference_join/output/multi_enriched.csv
      schema:
        mode: observed
  quarantine:
    plugin: csv
    on_write_failure: discard
    options:
      path: examples/reference_join/output/multi_quarantine.csv
      schema:
        mode: observed

landscape:
  url: sqlite:///examples/reference_join/runs/multi_audit.db
