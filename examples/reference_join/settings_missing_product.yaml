# reference_join — what the default miss policy costs, on purpose
#
# THIS CONFIG ENDS PARTIAL / EXIT 1 BY DESIGN. Order A-2002 asks for
# "scarves", which products.csv does not list.
#
# on_miss defaults to `fail`, so that row becomes a per-row error and is
# routed by on_error to the quarantine sink. The alternative — writing the
# order with empty enrichment fields — would put a row in the output that is
# indistinguishable from a correctly enriched one, which is the failure this
# default exists to prevent. Use on_miss: null or on_miss: default only when
# an unenriched row is a legitimate outcome you can tell apart downstream.

sources:
  primary:
    plugin: csv
    on_success: enrich_products
    options:
      path: examples/reference_join/orders_with_unknown.csv
      on_validation_failure: quarantine
      schema:
        mode: observed

transforms:
  - name: enrich_products
    plugin: reference_join
    input: enrich_products
    on_success: output
    on_error: quarantine
    options:
      schema:
        mode: observed
      reference_file: products.csv
      reference_format: csv
      key_field: product
      reference_key_name: sku
      output:
        product_description: "ref['description']"
        product_category: "ref['category']"
      on_miss: fail

sinks:
  output:
    plugin: csv
    on_write_failure: discard
    options:
      path: examples/reference_join/output/enriched_known_products.csv
      schema:
        mode: observed
  quarantine:
    plugin: csv
    on_write_failure: discard
    options:
      path: examples/reference_join/output/unknown_products.csv
      schema:
        mode: observed

landscape:
  url: sqlite:///examples/reference_join/runs/audit_missing.db
