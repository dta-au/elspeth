# ChaosLLM config for the document_review_panel example.
#
# Fault injection is ZEROED and the response is a deterministic function of the
# request. The whole point of this example is a CASCADE that unrolls from one
# lost token to a refused document verdict; a randomly injected fault would make
# which document fails a lottery, and the documented counts meaningless. The one
# loss in this example is authored into the data, not injected.
#
# `template` mode is handed `model` and `messages`, so the two reviewers score
# the same page differently — reviewer-strict marks a page down, reviewer-lenient
# marks it up. Their disagreement is what the document verdict is computed over,
# which is what makes BOTH arms load-bearing: lose either one and the page has no
# disagreement to report.

server:
  host: "127.0.0.1"
  port: 8199
  workers: 1

metrics:
  database: "file:chaosllm-metrics?mode=memory&cache=shared"

response:
  mode: template
  template:
    body: |
      {%- set text = messages[-1]['content'] | string -%}
      {%- set base = 40 + (text | length) % 31 -%}
      {%- set stance = -8 if 'reviewer-strict' in (model | string) else 11 -%}
      {"score": {{ base + stance }}, "finding": "Reviewed by {{ model }} over {{ text | length }} characters of page material."}

latency:
  base_ms: 10
  jitter_ms: 5

error_injection:
  rate_limit_pct: 0.0
  capacity_529_pct: 0.0
  service_unavailable_pct: 0.0
  internal_error_pct: 0.0
  bad_gateway_pct: 0.0
  gateway_timeout_pct: 0.0
  retry_after_sec: [1, 2]
  timeout_pct: 0.0
  timeout_sec: [2, 4]
  connection_reset_pct: 0.0
  slow_response_pct: 0.0
  slow_response_sec: [1, 3]
  invalid_json_pct: 0.0
  truncated_pct: 0.0
  empty_body_pct: 0.0
  missing_fields_pct: 0.0
  burst:
    enabled: false
