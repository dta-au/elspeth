# Fork/Coalesce Example — Union Merge with `fail` Collision Policy
#
# *** EVERY ROW IN THIS PIPELINE IS DESIGNED TO FAIL AT THE COALESCE. ***
#
# Demonstrates `union_collision_policy: fail` — a field name carried by
# more than one arriving branch fails that row's merge group. Each consumed
# branch row is recorded FAILED with the closed, value-free reason
# `union_field_collision`, and the full collision record
# (`union_field_origins`, `union_field_collisions`) is persisted to each
# FAILED hold's `node_states.context_after_json`, so auditors can see which
# fields collided and which branches contributed, without value-derived
# hashes or types. The run continues with the next row; it never aborts.
#
#   source ─(raw)─> [fork_gate] ─┬─ path_a ─> truncate(20) ─(trunc_a)─┐
#                                 └─ path_b ─> truncate(50) ─(trunc_b)─┤
#                                                                       X  <- collision, row FAILED
#
# The source is `observed`: the build cannot know which columns a row
# carries, so the collision is a per-row fault found when the branches
# merge. (With a `fixed` source, both branches would GUARANTEE the same
# columns and every merge would be certain to collide — `elspeth validate`
# refuses that pipeline before any row is read, naming the fields.) The
# `fail` policy treats ANY overlap as an error — it does not distinguish
# "same value" from "different value." If you want the runtime to reconcile
# overlaps, use `last_wins` or `first_wins` instead.
#
# Expected result: `elspeth run` ends FAILED (exit 2): every row's group
# fails, nothing reaches the sink. The audit database at
# runs/union_fail.db holds a FAILED coalesce node state per consumed branch
# row with the collision record preserved. Inspect via:
#
#   elspeth-mcp --database sqlite:///examples/fork_coalesce/runs/union_fail.db
#
# NOTE: `union_collision_policy` is orthogonal to the arrival `policy`
# (require_all / quorum / best_effort / first). They are separate axes:
# arrival policy decides WHEN to merge; collision policy decides HOW to
# reconcile overlapping field names once merging begins.

sources:
  primary:
    plugin: csv
    on_success: raw
    options:
      path: examples/fork_coalesce/input.csv
      schema:
        mode: observed
      on_validation_failure: discard

gates:
- name: fork_gate
  input: raw
  condition: "True"
  routes:
    'true': fork
    'false': output
  fork_to:
    - path_a
    - path_b

- name: route_output
  input: merge_results
  condition: "True"
  routes:
    'true': output
    'false': output

transforms:
- name: truncate_branch_a
  plugin: truncate
  input: path_a
  on_success: trunc_a
  on_error: discard
  options:
    fields:
      description: 20
    suffix: "..."
    schema:
      mode: observed

- name: truncate_branch_b
  plugin: truncate
  input: path_b
  on_success: trunc_b
  on_error: discard
  options:
    fields:
      description: 50
    suffix: "..."
    schema:
      mode: observed

coalesce:
- name: merge_results
  branches:
    path_a: trunc_a
    path_b: trunc_b
  policy: require_all
  merge: union
  union_collision_policy: fail   # DELIBERATE: any collision fails the row's group (union_field_collision)

sinks:
  output:
    plugin: json
    on_write_failure: discard
    options:
      path: examples/fork_coalesce/output/union_fail.json
      schema:
        mode: observed
      format: jsonl

landscape:
  url: sqlite:///examples/fork_coalesce/runs/union_fail.db
