# ONE reference_join node: customer_id -> service_region -> regional policy.
# service_region is absent from input.csv and comes only from lookup 0.
sources:
  tickets:
    plugin: csv
    on_success: ticket_in
    options:
      path: examples/reference_join_chain/input.csv
      on_validation_failure: quarantine
      schema:
        mode: fixed
        fields: ["ticket_id: str", "customer_id: str", "request: str"]

transforms:
  - name: resolve_support_policy
    plugin: reference_join
    input: ticket_in
    on_success: output
    on_error: quarantine
    options:
      schema:
        mode: observed
      tables:
        customers:
          reference_file: customers.csv
          reference_format: csv
        policies:
          reference_file: region_policies.csv
          reference_format: csv
      lookups:
        - table: customers
          key_field: customer_id
          reference_key_name: customer_id
          output:
            service_region: "ref['service_region']"
          on_miss: fail
        - table: policies
          key_field: service_region
          reference_key_name: service_region
          output:
            service_tier: "ref['service_tier']"
            support_queue: "ref['support_queue']"
            response_sla_hours: "ref['response_sla_hours']"
          on_miss: fail

sinks:
  output:
    plugin: csv
    on_write_failure: discard
    options:
      path: examples/reference_join_chain/output/support_policy.csv
      schema:
        mode: observed
  quarantine:
    plugin: csv
    on_write_failure: discard
    options:
      path: examples/reference_join_chain/output/quarantine.csv
      schema:
        mode: observed

landscape:
  url: sqlite:///examples/reference_join_chain/runs/audit.db
payload_store:
  base_path: examples/reference_join_chain/runs/payloads
