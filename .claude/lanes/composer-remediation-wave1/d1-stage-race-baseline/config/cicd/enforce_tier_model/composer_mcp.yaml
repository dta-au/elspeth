- key: composer_mcp/server.py:R6:create_server:call_tool:fp=bdaca096cb9550b6
  owner: john
  reason: |-
    The caught ValueError/TypeError is not swallowed: every completed handler path assigns `canonicalization_failed`; the first branch in `create_server.call_tool` then returns `_argument_error_result(...)`, an explicit `CallToolResult(isError=True)`, before validation or dispatch. If sentinel construction itself fails, that exception escapes. `tests/unit/composer_mcp/test_call_tool_audit.py::test_argument_canonicalization_failure_records_arg_error` pins the ARG_ERROR response and audit record.
