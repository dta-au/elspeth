- key: config_loading.py:R5:_plugin_bearing_sections:fp=5a85102586297c28
  owner: john
  reason: |-
    RULE MISFIRES: the flagged `isinstance(element, type)` is not a trust check on data, it is the operand-legality precondition for the `issubclass(element, BaseModel)` it is and-ed with. `element` comes from `get_args()` over `ElspethSettings.model_fields[...].annotation` — an arbitrary typing object, not an ELSPETH-owned value — and `issubclass` raises TypeError when its first argument is not a class. `_plugin_bearing_sections` DERIVES the plugin-bearing section set from `ElspethSettings` rather than listing it, because the previous hand-written tuple kept omitting whichever section was added last. Measured on the current tree, every dict/list-annotated settings field already carries a BaseModel element, so the guard is the precondition and not a live filter; without it one `dict[str, Any]`-shaped field would turn section discovery into a TypeError that aborts every config load. Nothing is coerced, defaulted or fabricated — the arm only `continue`s, and a surviving section must still declare both `plugin` and `options`. Pinned by tests/unit/core/test_config.py::TestEnvPlaceholderGuardIsDerived::test_guard_walks_every_plugin_bearing_section, which calls the function and asserts the derived set.
  safety: |-
    Suppression gated by cicd-judge; see judge_rationale below.
  expires: '2026-12-07'
  judge_verdict: ACCEPTED
  judge_recorded_at: '2026-09-08T12:40:44.597545+00:00'
