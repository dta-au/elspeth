<!-- @dsCard group="Type" viewport="700x320" name="Type scale" subtitle="A fine, dense scale tuned for an operator console — 10 → 32px" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 16px; background: var(--color-bg); font-family: var(--font-sans); }
  .line { display: flex; align-items: baseline; gap: 16px; padding: 5px 0; border-bottom: 1px solid var(--color-border); }
  .tok { font-family: var(--font-mono); font-size: 10px; color: var(--color-text-muted); width: 132px; flex-shrink: 0; }
  .spec { color: var(--color-text); }
</style>
</head>
<body>
  <div class="line"><span class="tok">2xl · 32px</span><span class="spec" style="font-size:32px;font-weight:600">Display heading</span></div>
  <div class="line"><span class="tok">xl · 22px</span><span class="spec" style="font-size:22px;font-weight:600">Empty-state hero</span></div>
  <div class="line"><span class="tok">lg · 18px</span><span class="spec" style="font-size:18px">Section heading</span></div>
  <div class="line"><span class="tok">base · 16px</span><span class="spec" style="font-size:16px">Body — message text</span></div>
  <div class="line"><span class="tok">md · 15px</span><span class="spec" style="font-size:15px">Body, h3 step</span></div>
  <div class="line"><span class="tok">sm · 13px</span><span class="spec" style="font-size:13px">Controls, labels</span></div>
  <div class="line"><span class="tok">xs · 12px</span><span class="spec" style="font-size:12px">Badges, meta</span></div>
  <div class="line"><span class="tok">2xs · 11px</span><span class="spec" style="font-size:11px">Chrome hints</span></div>
  <div class="line" style="border-bottom:none"><span class="tok">3xs · 10px</span><span class="spec" style="font-size:10px">Tab counts, micro-text</span></div>
</body>
</html>
