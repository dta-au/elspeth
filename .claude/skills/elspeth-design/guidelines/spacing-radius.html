<!-- @dsCard group="Spacing" viewport="700x150" name="Radius & controls" subtitle="Crisp institutional corners · 44px AAA and 36px AA targets" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 16px; background: var(--color-bg); font-family: var(--font-sans); display: flex; gap: 24px; align-items: center; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .box { width: 52px; height: 52px; background: var(--color-surface-elevated); border: 1px solid var(--color-border-strong); }
  .tok { font-family: var(--font-mono); font-size: 10px; color: var(--color-text-muted); }
  .nm { font-size: 11px; color: var(--color-text-secondary); }
  .sep { width: 1px; align-self: stretch; background: var(--color-border); }
</style>
</head>
<body>
  <div class="item"><div class="box" style="border-radius:4px"></div><div class="nm">sm</div><div class="tok">4px</div></div>
  <div class="item"><div class="box" style="border-radius:6px"></div><div class="nm">md</div><div class="tok">6px</div></div>
  <div class="item"><div class="box" style="border-radius:8px"></div><div class="nm">lg</div><div class="tok">8px</div></div>
  <div class="item"><div class="box" style="border-radius:12px"></div><div class="nm">xl</div><div class="tok">12px</div></div>
  <div class="item"><div class="box" style="border-radius:9999px"></div><div class="nm">pill</div><div class="tok">9999</div></div>
  <div class="sep"></div>
  <div class="item"><div style="display:flex;align-items:center"><button class="btn">44px AAA</button></div><div class="tok">--size-control</div></div>
  <div class="item"><div style="display:flex;align-items:center"><button class="btn-compact">36px AA</button></div><div class="tok">--size-control-compact</div></div>
</body>
</html>
