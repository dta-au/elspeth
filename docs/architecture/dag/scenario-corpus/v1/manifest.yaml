scenarios:
  - id: linear
    ordinal: 1
    title: Linear source → transform → sink
    cases:
      - id: happy-path
        workflow: run
        fixture: linear/happy-path.yaml
        input_fixtures:
          primary: linear/input.csv
        output_artifacts:
          output: output.jsonl
        expected:
          kind: exact
          status: completed
          sink_outputs:
            - sink_name: output
              rows:
                - '{"id":1,"value":10}'
                - '{"id":2,"value":20}'
                - '{"id":3,"value":30}'
          rows_processed: 3
          rows_succeeded: 3
          rows_failed: 0
          projection:
            rows:
              - {key: 'primary:0', source_name: primary, source_row_index: 0, ingest_sequence: 0, source_data_hash: 19b33c29a9a46e8935271aed5ccd77ab3b9d4be9ef78e2267548874cd61726b2}
              - {key: 'primary:1', source_name: primary, source_row_index: 1, ingest_sequence: 1, source_data_hash: ffeb1fb12db8f2d5c55f05b744bde7f0e0858990ceb9202d9ec418045aa0fd8d}
              - {key: 'primary:2', source_name: primary, source_row_index: 2, ingest_sequence: 2, source_data_hash: d7c1d668deaae7fb498b23776bd8b3a5f898bf11e8b73cd42bd1d415f0baf4c9}
            tokens:
              - {key: 'primary:0#0', row_key: 'primary:0', parents: []}
              - {key: 'primary:1#0', row_key: 'primary:1', parents: []}
