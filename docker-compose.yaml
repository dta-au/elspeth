# ELSPETH's base Compose file is CLI-first and uses local SQLite state.
#
# Run CLI commands with an immutable release image, for example:
#   IMAGE_TAG=v0.7.2 docker compose run --rm elspeth --version
#
# The supported PostgreSQL web deployment adds both shipped overlays:
#   docker compose -f docker-compose.yaml -f deploy/compose/postgres.yaml \
#     -f deploy/compose/web-postgres.yaml up

services:
  elspeth:
    image: ${REGISTRY:-ghcr.io/johnm-dta}/elspeth:${IMAGE_TAG:?set IMAGE_TAG to an immutable sha-* or v* tag}
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/state/landscape.db}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      OTEL_SERVICE_NAME: elspeth
      ELSPETH_LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
    working_dir: /app
    volumes:
      - ./config:/app/config:ro
      - ./input:/app/input:ro
      - ./output:/app/output
      - ./state:/app/state
    command: ["--help"]

  jaeger:
    image: jaegertracing/all-in-one:1.54
    profiles: ["with-tracing"]
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
