scope-blurb: >-
  This register records the implementation risks, assumptions, issues and
  dependencies attached to delivering the programme of outstanding work.  It
  covers the delivery of the product, not the operation of it: operational
  risk from the running service is a separate register, and individual
  defects remain in the issue tracker and are referenced here rather than
  copied.  An entry is included where it would change the next delivery decision,
  and instances of the same underlying problem are merged into the
  response that resolves them.  They are presented in two tiers: those
  requiring a decision or action from the reader, and those recorded for
  visibility.  It is the third of the four project-control
  artefacts required by ADR-024.

