scope-blurb: >-
  This document states the work remaining to take ELSPETH from its current
  pre-release state to a product that can be given to users.  It groups that
  work into six themes — readiness for users, platform and deployment,
  correctness by construction, assurance and release readiness, capability,
  and continuity — and states, for each package, what exists today, what is
  left, and what it depends on.  Figures are measured from the source tree,
  the issue tracker and the deployed service at the revision named above,
  not estimated.  It is a statement of scope, not a schedule; the decisions
  the programme needs from its owner are listed separately at the end.

