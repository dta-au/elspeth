scope-blurb: >-
  This document defines what ELSPETH is, who it is for, and what must be true
  before it can be offered to users — first to a pilot group, then as a 1.0
  release.  It states the problem the product addresses, the users it serves
  and the jobs they need done, the product model and the invariants that model
  depends on, the current state of the build, the bars that gate a pilot and a
  release, and the requirements and acceptance criteria attached to each.  It
  is the companion to the Program of Outstanding Work: this document answers
  what must be true, that one answers what is left to build.  The decisions the
  product needs from its owner are listed separately.

