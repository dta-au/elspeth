# Trivy exceptions for the main ELSPETH image scans in
# .github/workflows/build-push.yaml. The gateway image scans do not use this
# file.
#
# Each entry is scoped to the exact chromadb release ELSPETH pins
# (pyproject.toml: chromadb==1.5.5) and expires, so a chromadb bump or the
# expiry date returns the scan to failing. The same four CVEs are ignored in
# the pip-audit gate (.github/workflows/ci.yaml); keep the two lists in step
# and remove both once upstream ships a fixed chromadb release.
#
# Why they do not apply to this image: all four are defects in the ChromaDB
# Python *server* (its HTTP API, tenant authorization and RBAC provider).
# ELSPETH uses chromadb only as a client (HttpClient / PersistentClient /
# Client in plugins/infrastructure/clients/retrieval/chroma.py,
# plugins/sinks/chroma_sink.py and plugins/infrastructure/probe_factory.py).
# The image's entrypoint is `elspeth`, and the image never starts a Chroma
# server, registers no Chroma authorization provider and serves no /api/v2
# route. An operator who runs their own Chroma server owns that server's
# exposure; these exceptions do not extend to it.
#
# Known limitation, not one of these CVEs: in `mode: client` ELSPETH does not
# pass its own embedding function, so chromadb builds the one named in the
# remote collection's stored configuration. Point client mode only at Chroma
# servers you trust.

vulnerabilities:
  - id: CVE-2026-45829
    purls:
      - "pkg:pypi/chromadb@1.5.5"
    statement: >-
      Pre-authentication code injection in the ChromaDB Python server's HTTP
      API. The image never runs a Chroma server; chromadb is used as a client
      only. Upstream fix merged (chroma-core/chroma PR 7237) but not released.
    expired_at: 2027-03-31
  - id: CVE-2026-45833
    purls:
      - "pkg:pypi/chromadb@1.5.5"
    statement: >-
      trust_remote_code code execution reachable by a caller holding
      UPDATE_COLLECTION on a ChromaDB server. The image never runs a Chroma
      server and does not ship sentence_transformers. No fixed release.
    expired_at: 2027-03-31
  - id: CVE-2026-45830
    purls:
      - "pkg:pypi/chromadb@1.5.5"
    statement: >-
      Cross-tenant read/write through missing authorization validation on the
      ChromaDB server's /api/v2/tenants routes. The image never runs a Chroma
      server. No fixed release.
    expired_at: 2027-03-31
  - id: CVE-2026-45831
    purls:
      - "pkg:pypi/chromadb@1.5.5"
    statement: >-
      ChromaDB server's SimpleRBACAuthorizationProvider checks a permission but
      not the tenant, database or collection it applies to. ELSPETH registers
      no Chroma authorization provider and runs no Chroma server. No fixed
      release.
    expired_at: 2027-03-31
