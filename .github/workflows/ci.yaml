# CI Pipeline - Lint and Test
#
# Runs on every push and PR. Fast feedback loop with:
#   - Linting (ruff, mypy) - ~30 seconds
#   - Testing (pytest with coverage) - ~3-5 minutes
#   - Bug-hiding pattern detection
#   - Contract enforcement (Settings→Runtime alignment, type boundaries)
#
# All checks must pass before merging to protected integration branches.

name: CI

on:
  push:
    branches: [main, master, "RC*", "release/**"]
  pull_request:
    branches: [main, master, "RC*", "release/**"]

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  UV_VERSION: "0.5"

permissions:
  actions: read
  contents: read

# Public-repository guardrail: pull_request workflows execute code from
# unmerged branches, so all PRs stay on GitHub-hosted runners.
# Trusted push workflows use the nyx runner.
#
# GitHub's runs-on expression accepts either a runner label string or a JSON
# array of labels. Keep this expression identical across jobs so the aggregate
# CI Success check reflects one routing policy.
#
# Self-hosted container jobs can leave root-owned venv/cache artifacts in the
# default workspace. Every checkout below uses a per-run, per-job path so stale
# workspace siblings cannot break actions/checkout before project commands run.
#
#   ${{ fromJSON((github.event_name != 'pull_request') && '["self-hosted","Linux","X64","nyx-ci","trusted"]' || '"ubuntu-24.04"') }}

jobs:
  # ===========================================================================
  # Stage 1: Static analysis (shared Python environment)
  # ===========================================================================
  static-analysis:
    name: Static analysis
    runs-on: ${{ fromJSON((github.event_name != 'pull_request') && '["self-hosted","Linux","X64","nyx-ci","trusted"]' || '"ubuntu-24.04"') }}
    container:
      image: python:3.13-bookworm
    env:
      CI_CHECKOUT_PATH: ci-${{ github.run_id }}-${{ github.run_attempt }}-static-analysis
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: ${{ env.CI_CHECKOUT_PATH }}
          # Branch-creation pushes have no event.before. Full history is needed
          # to resolve their complete delta from the default-branch merge base.
          fetch-depth: 0

      - name: Check GitHub workflows (actionlint)
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        shell: bash
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          tarball="$tmp_dir/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          python - <<'PY' "$tarball" "$ACTIONLINT_VERSION"
          from pathlib import Path
          import sys
          import urllib.request

          tarball = Path(sys.argv[1])
          version = sys.argv[2]
          url = f"https://github.com/rhysd/actionlint/releases/download/v{version}/actionlint_{version}_linux_amd64.tar.gz"
          urllib.request.urlretrieve(url, tarball)
          PY
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" -C "$tmp_dir" actionlint
          "$tmp_dir/actionlint" -config-file .github/actionlint.yaml .github/workflows/*.yml .github/workflows/*.yaml

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
          prune-cache: true

      - name: Use checkout-local uv cache
        run: echo "UV_CACHE_DIR=$GITHUB_WORKSPACE/$CI_CHECKOUT_PATH/.uv-cache" >> "$GITHUB_ENV"

      - name: Install system dependencies
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          apt-get update -q
          apt-get install -y -q libsqlcipher-dev

      - name: Install dependencies
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: uv sync --frozen --all-extras

      - name: Reject touched or broadened permanent multi-rule per-file blankets
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        env:
          CURRENT_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.event_name != 'pull_request' && github.token || '' }}
          PR_BASELINE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          BASELINE_REF="$PR_BASELINE_REF"
          if [[ -z "$BASELINE_REF" ]]; then
            # A push predecessor is not policy authority: concurrency may have
            # cancelled it after it introduced a blanket. Select the nearest
            # ancestor whose exact ratchet step succeeded instead.
            if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
              git fetch --no-tags --filter=blob:none --unshallow origin '+refs/heads/*:refs/remotes/origin/*'
            else
              git fetch --no-tags --filter=blob:none origin '+refs/heads/*:refs/remotes/origin/*'
            fi
            BASELINE_REF="$(python - <<'PY'
          # resolve-nearest-successful-ratchet-baseline
          import json
          import os
          import re
          import subprocess
          import sys
          import urllib.parse
          import urllib.request

          def fail(message: str) -> None:
              print(f"blanket ratchet baseline: {message}", file=sys.stderr)
              raise SystemExit(2)

          api_url = os.environ["GITHUB_API_URL"].rstrip("/")
          repository = os.environ["GITHUB_REPOSITORY"]
          current_sha = os.environ["GITHUB_SHA"]
          current_run_id_raw = os.environ["CURRENT_RUN_ID"]
          token = os.environ.get("GH_TOKEN", "")
          if not token:
              fail("GH_TOKEN is unavailable for the protected-push baseline lookup")
          if re.fullmatch(r"[0-9a-fA-F]{40}", current_sha) is None:
              fail("GITHUB_SHA is malformed")
          if re.fullmatch(r"[1-9][0-9]*", current_run_id_raw) is None:
              fail("CURRENT_RUN_ID is malformed")
          if re.fullmatch(r"[^/\s]+/[^/\s]+", repository) is None:
              fail("GITHUB_REPOSITORY is malformed")
          current_sha = current_sha.lower()
          current_run_id = int(current_run_id_raw)

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          api_origin = urllib.parse.urlsplit(api_url)
          next_link_pattern = re.compile(r'<([^>]+)>;\s*rel="next"')

          def api_collection(url: str, key: str, context: str) -> list[object]:
              items: list[object] = []
              seen_urls: set[str] = set()
              while url:
                  if url in seen_urls:
                      fail(f"pagination cycle while reading {context}")
                  seen_urls.add(url)
                  request = urllib.request.Request(url, headers=headers)
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          payload = json.load(response)
                          response_headers = getattr(response, "headers", {})
                          link_header = response_headers.get("Link", "")
                  except (OSError, ValueError) as exc:
                      fail(f"could not read {context}: {type(exc).__name__}")
                  if not isinstance(payload, dict) or not isinstance(payload.get(key), list):
                      fail(f"malformed Actions API response ({key} must be a list)")
                  items.extend(payload[key])
                  next_links = next_link_pattern.findall(link_header)
                  if len(next_links) > 1:
                      fail(f"malformed pagination while reading {context}")
                  url = next_links[0] if next_links else ""
                  if url:
                      parsed = urllib.parse.urlsplit(url)
                      if (
                          parsed.scheme != api_origin.scheme
                          or parsed.netloc != api_origin.netloc
                          or "/actions/" not in parsed.path
                      ):
                          fail(f"unsafe pagination link while reading {context}")
              return items

          query = urllib.parse.urlencode({"event": "push", "per_page": "100"})
          runs_url = f"{api_url}/repos/{repository}/actions/workflows/ci.yaml/runs?{query}"
          raw_runs = api_collection(runs_url, "workflow_runs", "workflow runs")
          runs_by_sha: dict[str, list[int]] = {}
          seen_runs: dict[int, str] = {}
          for index, run in enumerate(raw_runs):
              if not isinstance(run, dict):
                  fail(f"malformed workflow run at index {index}")
              run_id = run.get("id")
              sha = run.get("head_sha")
              if (
                  type(run_id) is not int
                  or run_id <= 0
                  or not isinstance(sha, str)
                  or re.fullmatch(r"[0-9a-fA-F]{40}", sha) is None
                  or run.get("event") != "push"
                  or not isinstance(run.get("status"), str)
                  or not (isinstance(run.get("conclusion"), str) or run.get("conclusion") is None)
              ):
                  fail(f"malformed workflow run at index {index}")
              sha = sha.lower()
              prior_sha = seen_runs.setdefault(run_id, sha)
              if prior_sha != sha:
                  fail(f"conflicting duplicate workflow run {run_id}")
              if sha == current_sha or run_id == current_run_id:
                  continue
              run_ids = runs_by_sha.setdefault(sha, [])
              if run_id not in run_ids:
                  run_ids.append(run_id)

          try:
              graph_result = subprocess.run(
                  ["git", "rev-list", "--parents", current_sha],
                  check=True,
                  capture_output=True,
                  text=True,
              )
          except (OSError, subprocess.CalledProcessError) as exc:
              fail(f"could not read commit graph: {type(exc).__name__}")
          parents_by_sha: dict[str, tuple[str, ...]] = {}
          for index, line in enumerate(graph_result.stdout.splitlines()):
              fields = line.split()
              if not fields or any(re.fullmatch(r"[0-9a-fA-F]{40}", field) is None for field in fields):
                  fail(f"malformed git rev-list output at line {index + 1}")
              commit, *parents = (field.lower() for field in fields)
              parents_by_sha[commit] = tuple(parents)
          if current_sha not in parents_by_sha:
              fail("git rev-list did not contain GITHUB_SHA")

          # Policy debt advances along the protected push's first-parent
          # lineage. A merge's second parent may carry older, broader debt and
          # must never outrank the stricter state already on the target branch.
          distances: dict[str, int] = {}
          lineage_sha = current_sha
          while lineage_sha not in distances:
              distances[lineage_sha] = len(distances)
              parents = parents_by_sha.get(lineage_sha)
              if parents is None:
                  fail(f"git rev-list omitted first-parent commit {lineage_sha}")
              if not parents:
                  break
              lineage_sha = parents[0]

          exact_job_name = "Static analysis"
          exact_step_name = "Reject touched or broadened permanent multi-rule per-file blankets"
          candidates = sorted(
              (distance, sha) for sha, distance in distances.items() if sha in runs_by_sha
          )
          baseline_sha: str | None = None
          for _distance, sha in candidates:
              for run_id in sorted(runs_by_sha[sha], reverse=True):
                  jobs_query = urllib.parse.urlencode({"filter": "all", "per_page": "100"})
                  jobs_url = f"{api_url}/repos/{repository}/actions/runs/{run_id}/jobs?{jobs_query}"
                  jobs = api_collection(jobs_url, "jobs", f"jobs for workflow run {run_id}")
                  for index, job in enumerate(jobs):
                      if not isinstance(job, dict) or not isinstance(job.get("name"), str):
                          fail(f"malformed job at index {index} for workflow run {run_id}")
                      if job["name"] != exact_job_name:
                          continue
                      job_run_id = job.get("run_id")
                      job_sha = job.get("head_sha")
                      attempt = job.get("run_attempt")
                      steps = job.get("steps")
                      if (
                          job_run_id != run_id
                          or job_sha != sha
                          or type(attempt) is not int
                          or attempt <= 0
                          or not isinstance(steps, list)
                      ):
                          fail(f"malformed ratchet job at index {index} for workflow run {run_id}")
                      for step_index, step in enumerate(steps):
                          if (
                              not isinstance(step, dict)
                              or not isinstance(step.get("name"), str)
                              or not isinstance(step.get("status"), str)
                              or not (
                                  isinstance(step.get("conclusion"), str)
                                  or step.get("conclusion") is None
                              )
                          ):
                              fail(
                                  f"malformed ratchet job step at index {step_index} "
                                  f"for workflow run {run_id}"
                              )
                          if (
                              step["name"] == exact_step_name
                              and step["status"] == "completed"
                              and step["conclusion"] == "success"
                          ):
                              baseline_sha = sha
                              break
                      if baseline_sha is not None:
                          break
                  if baseline_sha is not None:
                      break
              if baseline_sha is not None:
                  break
          if baseline_sha is None:
              fail(
                  "No successful ancestor baseline was found; refusing to compare "
                  "against an untrusted push predecessor."
              )
          print(baseline_sha)
          PY
            )"
          else
            git fetch --no-tags --depth=1 origin "$BASELINE_REF"
          fi
          PYTHONPATH=elspeth-lints/src uv run python -m elspeth_lints.core.cli \
            check-per-file-blanket-ratchet \
            --baseline-ref "$BASELINE_REF" \
            --allowlist-root config/cicd \
            --repo-root .

      - name: Reject unverified PR signed allowlist edits
        if: ${{ github.event_name == 'pull_request' }}
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }}
          PYTHONPATH=elspeth-lints/src uv run python -m elspeth_lints.core.cli check-judge-coverage \
            --baseline-ref ${{ github.event.pull_request.base.sha }} \
            --allowlist-root config/cicd/enforce_tier_model \
            --repo-root . \
            --forbid-unverified-judge-metadata
          PYTHONPATH=elspeth-lints/src uv run python -m elspeth_lints.core.cli check-judge-coverage \
            --baseline-ref ${{ github.event.pull_request.base.sha }} \
            --allowlist-root config/cicd/enforce_trust_boundary_honesty \
            --repo-root . \
            --forbid-unverified-judge-metadata

      - name: Check code style (ruff)
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: uv run ruff check src/ tests/ scripts/ examples/ elspeth-lints/src/

      - name: Check formatting (ruff format)
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: uv run ruff format --check src/ tests/ scripts/ examples/ elspeth-lints/src/

      - name: Type check (mypy)
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: uv run mypy src/ elspeth-lints/src/

      - name: Check SlotType / guided.ts mirror consistency
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: uv run python scripts/cicd/check_slot_type_cross_language.py

      - name: Check composer skill tool inventory
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: uv run python scripts/cicd/generate_skill_inventory.py --check

      - name: Enforce contract alignment
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: uv run python scripts/check_contracts.py

      - name: Run plugin options metadata elspeth-lints rule
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          PYTHONPATH=elspeth-lints/src uv run python -m elspeth_lints.core.cli check \
            --rules plugin_contract.options_metadata \
            --root .

      - name: Run plugin-contract elspeth-lints rules
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          PYTHONPATH=elspeth-lints/src uv run python -m elspeth_lints.core.cli check \
            --rules plugin_contract.component_type,plugin_contract.plugin_hashes \
            --root src/elspeth

      - name: Run immutability elspeth-lints rules
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          PYTHONPATH=elspeth-lints/src uv run python -m elspeth_lints.core.cli check \
            --rules immutability.freeze_guards,immutability.frozen_annotations \
            --root src/elspeth

      - name: Run audit-evidence elspeth-lints rules
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          PYTHONPATH=elspeth-lints/src uv run python -m elspeth_lints.core.cli check \
            --rules audit_evidence.nominal_base,audit_evidence.tier_1_decoration,audit_evidence.guard_symmetry,audit_evidence.gve_attribution \
            --root src/elspeth

      - name: Run composer elspeth-lints rules
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          PYTHONPATH=elspeth-lints/src uv run python -m elspeth_lints.core.cli check \
            --rules 'composer/*' \
            --root src/elspeth

      - name: Run contract-invariants elspeth-lints rules
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          PYTHONPATH=elspeth-lints/src uv run python -m elspeth_lints.core.cli check \
            --rules 'contract_invariants/*' \
            --root src/elspeth

      - name: Run session-engine-factory elspeth-lints rule
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          PYTHONPATH=elspeth-lints/src uv run python -m elspeth_lints.core.cli check \
            --rules contract_invariants.session_engine_factory \
            --root .

      - name: Run contract-manifest elspeth-lints rule
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          PYTHONPATH=elspeth-lints/src uv run python -m elspeth_lints.core.cli check \
            --rules manifest.contract_manifest \
            --root src/elspeth

      - name: Run manifest inventory elspeth-lints rules
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          PYTHONPATH=elspeth-lints/src uv run python -m elspeth_lints.core.cli check \
            --rules manifest.symbol_inventory,manifest.test_to_source_mapping \
            --root .

      - name: Run trust-tier elspeth-lints rule
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        env:
          ELSPETH_JUDGE_METADATA_HMAC_KEY: ${{ github.event_name != 'pull_request' && secrets.ELSPETH_JUDGE_METADATA_HMAC_KEY || '' }}
          ELSPETH_JUDGE_METADATA_SIGNATURE_VERIFY_MODE: ${{ github.event_name == 'pull_request' && 'shape-only-when-key-missing' || 'required' }}
        run: |
          set +e
          PYTHONPATH=elspeth-lints/src uv run python -m elspeth_lints.core.cli check \
            --rules trust_tier.tier_model \
            --root src/elspeth
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error title=Trust-tier signed allowlist diagnosis::If this failure mentions judge_metadata_signature, file_fingerprint, scope_fingerprint, or ast_path drift, run: diagnose-judge-signatures --root src/elspeth --allowlist-dir config/cicd/enforce_tier_model. To repair diagnosed drift from an operator shell, run: sign-judge-signatures --root src/elspeth --allowlist-dir config/cicd/enforce_tier_model --env-file /path/to/operator.env --owner \"\$USER\""
          fi
          exit "$status"

      - name: Run trust-boundary honesty-gate elspeth-lints rules
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        env:
          ELSPETH_JUDGE_METADATA_HMAC_KEY: ${{ github.event_name != 'pull_request' && secrets.ELSPETH_JUDGE_METADATA_HMAC_KEY || '' }}
          ELSPETH_JUDGE_METADATA_SIGNATURE_VERIFY_MODE: ${{ github.event_name == 'pull_request' && 'shape-only-when-key-missing' || 'required' }}
        run: |
          PYTHONPATH=elspeth-lints/src uv run python -m elspeth_lints.core.cli check \
            --rules trust_boundary.tests,trust_boundary.scope,trust_boundary.tier \
            --root src/elspeth

      - name: Forbid new bespoke CI enforcers
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          PYTHONPATH=elspeth-lints/src uv run python -m elspeth_lints.core.cli check \
            --rules meta.no-new-bespoke-cicd-enforcer \
            --root .

      - name: Run adapter facade budget legacy gate
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          uv run python scripts/cicd/enforce_adapter_budget.py

      - name: Emit elspeth-lints SARIF artifact
        if: always()
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          set +e
          PYTHONPATH=elspeth-lints/src uv run python -m elspeth_lints.core.cli check \
            --rules meta.no-new-bespoke-cicd-enforcer,plugin_contract.options_metadata \
            --root . \
            --format sarif > elspeth-lints.sarif
          status=$?
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi

      - name: Emit elspeth-lints immutability SARIF artifact
        if: always()
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          set +e
          PYTHONPATH=elspeth-lints/src uv run python -m elspeth_lints.core.cli check \
            --rules immutability.freeze_guards,immutability.frozen_annotations \
            --root src/elspeth \
            --format sarif > elspeth-lints-immutability.sarif
          status=$?
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi

      - name: Emit elspeth-lints plugin-contract SARIF artifact
        if: always()
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          set +e
          PYTHONPATH=elspeth-lints/src uv run python -m elspeth_lints.core.cli check \
            --rules plugin_contract.component_type,plugin_contract.plugin_hashes \
            --root src/elspeth \
            --format sarif > elspeth-lints-plugin-contract.sarif
          status=$?
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi

      - name: Emit elspeth-lints audit-evidence SARIF artifact
        if: always()
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          set +e
          PYTHONPATH=elspeth-lints/src uv run python -m elspeth_lints.core.cli check \
            --rules audit_evidence.nominal_base,audit_evidence.tier_1_decoration,audit_evidence.guard_symmetry,audit_evidence.gve_attribution \
            --root src/elspeth \
            --format sarif > elspeth-lints-audit-evidence.sarif
          status=$?
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi

      - name: Emit elspeth-lints composer SARIF artifact
        if: always()
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          set +e
          PYTHONPATH=elspeth-lints/src uv run python -m elspeth_lints.core.cli check \
            --rules 'composer/*' \
            --root src/elspeth \
            --format sarif > elspeth-lints-composer.sarif
          status=$?
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi

      - name: Emit elspeth-lints contract-invariants SARIF artifact
        if: always()
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          set +e
          PYTHONPATH=elspeth-lints/src uv run python -m elspeth_lints.core.cli check \
            --rules 'contract_invariants/*' \
            --root src/elspeth \
            --format sarif > elspeth-lints-contract-invariants.sarif
          status=$?
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi

      - name: Emit elspeth-lints session-engine-factory SARIF artifact
        if: always()
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          set +e
          PYTHONPATH=elspeth-lints/src uv run python -m elspeth_lints.core.cli check \
            --rules contract_invariants.session_engine_factory \
            --root . \
            --format sarif > elspeth-lints-session-engine-factory.sarif
          status=$?
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi

      - name: Emit elspeth-lints contract-manifest SARIF artifact
        if: always()
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          set +e
          PYTHONPATH=elspeth-lints/src uv run python -m elspeth_lints.core.cli check \
            --rules manifest.contract_manifest \
            --root src/elspeth \
            --format sarif > elspeth-lints-contract-manifest.sarif
          status=$?
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi

      - name: Emit elspeth-lints manifest-inventory SARIF artifact
        if: always()
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          set +e
          PYTHONPATH=elspeth-lints/src uv run python -m elspeth_lints.core.cli check \
            --rules manifest.symbol_inventory,manifest.test_to_source_mapping \
            --root . \
            --format sarif > elspeth-lints-manifest-inventory.sarif
          status=$?
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi

      - name: Emit elspeth-lints trust-tier SARIF artifact
        if: always()
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        env:
          ELSPETH_JUDGE_METADATA_HMAC_KEY: ${{ github.event_name != 'pull_request' && secrets.ELSPETH_JUDGE_METADATA_HMAC_KEY || '' }}
          ELSPETH_JUDGE_METADATA_SIGNATURE_VERIFY_MODE: ${{ github.event_name == 'pull_request' && 'shape-only-when-key-missing' || 'required' }}
        run: |
          set +e
          PYTHONPATH=elspeth-lints/src uv run python -m elspeth_lints.core.cli check \
            --rules trust_tier.tier_model \
            --root src/elspeth \
            --format sarif > elspeth-lints-trust-tier.sarif
          status=$?
          if [ "$status" -gt 1 ]; then
            echo "::error title=Trust-tier signed allowlist diagnosis::If this failure mentions judge_metadata_signature, file_fingerprint, scope_fingerprint, or ast_path drift, run: diagnose-judge-signatures --root src/elspeth --allowlist-dir config/cicd/enforce_tier_model. To repair diagnosed drift from an operator shell, run: sign-judge-signatures --root src/elspeth --allowlist-dir config/cicd/enforce_tier_model --env-file /path/to/operator.env --owner \"\$USER\""
            exit "$status"
          fi

      - name: Upload elspeth-lints SARIF artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: elspeth-lints-sarif
          path: |
            ${{ env.CI_CHECKOUT_PATH }}/elspeth-lints.sarif
            ${{ env.CI_CHECKOUT_PATH }}/elspeth-lints-immutability.sarif
            ${{ env.CI_CHECKOUT_PATH }}/elspeth-lints-plugin-contract.sarif
            ${{ env.CI_CHECKOUT_PATH }}/elspeth-lints-audit-evidence.sarif
            ${{ env.CI_CHECKOUT_PATH }}/elspeth-lints-composer.sarif
            ${{ env.CI_CHECKOUT_PATH }}/elspeth-lints-contract-invariants.sarif
            ${{ env.CI_CHECKOUT_PATH }}/elspeth-lints-session-engine-factory.sarif
            ${{ env.CI_CHECKOUT_PATH }}/elspeth-lints-contract-manifest.sarif
            ${{ env.CI_CHECKOUT_PATH }}/elspeth-lints-manifest-inventory.sarif
            ${{ env.CI_CHECKOUT_PATH }}/elspeth-lints-trust-tier.sarif
          retention-days: 7

      - name: Compare shadow-mode lints
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          PYTHONPATH=elspeth-lints/src uv run python scripts/cicd/parity_harness.py \
            --manifest config/cicd/lint_migration_status.yaml \
            --root .

  # ===========================================================================
  # Stage 3: Test (Quality gate - ~3-5 minutes)
  # ===========================================================================
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ${{ fromJSON((github.event_name != 'pull_request') && '["self-hosted","Linux","X64","nyx-ci","trusted"]' || '"ubuntu-24.04"') }}
    container:
      image: python:${{ matrix.python-version }}-bookworm
    env:
      CI_CHECKOUT_PATH: ci-${{ github.run_id }}-${{ github.run_attempt }}-test-${{ matrix.python-version }}
    needs: [static-analysis]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        # Coverage runs on Python 3.13 only because 3.13 is the release
        # interpreter for this branch. The Python 3.12 lane remains
        # dependency-compatibility signal and intentionally skips coverage so
        # one XML/threshold report is authoritative.
        include:
          - python-version: "3.12"
            coverage: false
          - python-version: "3.13"
            coverage: true

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: ${{ env.CI_CHECKOUT_PATH }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
          prune-cache: true

      - name: Use checkout-local uv cache
        run: echo "UV_CACHE_DIR=$GITHUB_WORKSPACE/$CI_CHECKOUT_PATH/.uv-cache" >> "$GITHUB_ENV"

      - name: Install system dependencies
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          apt-get update -q
          apt-get install -y -q libsqlcipher-dev jq unzip

      - name: Install Terraform (native deployment-package contract tests)
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        # Without a terraform binary the native mock-plan contract tests in
        # tests/unit/deployment/test_aws_ecs_terraform_package.py skipped
        # silently, so CI proved nothing about the shipped package
        # (elspeth-af1efcb8d8). The tests now fail loudly under
        # GITHUB_ACTIONS when terraform is absent, and this step supplies
        # it, checksum-pinned against the official release manifest.
        run: |
          TF_VERSION=1.15.7
          TF_SHA256=73bbb8f5188ad75d4fb853fd100ae4d7e146ef7af7db18776109642fdb7759d2
          curl -fsSLo /tmp/terraform.zip \
            "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
          printf '%s  /tmp/terraform.zip\n' "$TF_SHA256" | sha256sum -c -
          unzip -o -q /tmp/terraform.zip -d /usr/local/bin terraform
          terraform version

      - name: Install dependencies
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: uv sync --frozen --all-extras

      - name: Run tests with coverage
        if: matrix.coverage
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          uv run pytest tests/ \
            --cov=src/elspeth \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=85 \
            -v \
            -m "not slow and not stress and not performance and not testcontainer"

      - name: Enforce audit-critical coverage floors
        if: matrix.coverage
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          # Ratchet the verified 2026-05-19 baseline while the test-debt
          # uplift to 95% is planned. Do not lower without fresh evidence.
          # 2026-06-19: landscape floor 93 -> 92, orchestrator 91 -> 90. Fresh
          # evidence: the 0.6.0 multi-worker work added substantial landscape +
          # orchestrator code (run_coordination, scheduler/execution/lifecycle
          # repositories; multi-worker orchestration paths) whose test coverage
          # sits below the prior subsystem floors (scheduler 88%, execution 89%,
          # run_lifecycle 90%; the new run_coordination_repository is itself at
          # 94%). The Test lane was masked behind static-analysis while this
          # landed, so the dip surfaced only now. Uplift remains tracked debt.
          # All four floors are checked every run (collect-then-fail) so a dip
          # in any subsystem surfaces together rather than one cycle at a time.
          status=0
          uv run coverage report --include="src/elspeth/core/landscape/*" --fail-under=92 || status=1
          uv run coverage report --include="src/elspeth/core/canonical.py" --fail-under=99 || status=1
          uv run coverage report --include="src/elspeth/engine/orchestrator/*" --fail-under=90 || status=1
          uv run coverage report --include="src/elspeth/contracts/*" --fail-under=62 || status=1
          exit "$status"

      - name: Run tests without coverage
        if: ${{ !matrix.coverage }}
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          uv run pytest tests/ \
            -v \
            -m "not slow and not stress and not performance and not testcontainer"

      - name: Upload coverage report
        if: matrix.coverage && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-report
          path: ${{ env.CI_CHECKOUT_PATH }}/coverage.xml
          retention-days: 7

  # ===========================================================================
  # Stage 5: Integration Tests (Optional - requires secrets)
  # ===========================================================================
  integration:
    name: Integration Tests
    runs-on: ${{ fromJSON((github.event_name != 'pull_request') && '["self-hosted","Linux","X64","nyx-ci","trusted"]' || '"ubuntu-24.04"') }}
    container:
      image: python:3.13-bookworm
    needs: [test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/RC') || startsWith(github.ref, 'refs/heads/release/'))
    env:
      CI_CHECKOUT_PATH: ci-${{ github.run_id }}-${{ github.run_attempt }}-integration
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: ${{ env.CI_CHECKOUT_PATH }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
          prune-cache: true

      - name: Use checkout-local uv cache
        run: echo "UV_CACHE_DIR=$GITHUB_WORKSPACE/$CI_CHECKOUT_PATH/.uv-cache" >> "$GITHUB_ENV"

      - name: Install system dependencies
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          apt-get update -q
          apt-get install -y -q libsqlcipher-dev

      - name: Install dependencies
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: uv sync --frozen --all-extras

      - name: Run integration tests
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          # Fail closed: a real integration failure — assertion regression,
          # collection/import error (exit 2), internal error (exit 3), or
          # infra fault — must fail the lane so build-push.yaml never builds an
          # image off a broken CI run. The only tolerated outcome is pytest's
          # exit code 5 ("no tests collected"); integration tests self-skip via
          # pytest.skip / importorskip when their credentials are absent, which
          # is exit 0 anyway. ``|| status=$?`` captures the code without letting
          # ``set -e`` abort before we can inspect it.
          status=0
          uv run pytest tests/integration/ -v -m integration || status=$?
          if [ "$status" -eq 5 ]; then
            echo "No integration tests collected (exit 5) — treating as a skip."
            exit 0
          fi
          exit "$status"

  # ===========================================================================
  # Stage 5b: Testcontainer proofs (real PostgreSQL contention via Docker)
  # ===========================================================================
  testcontainer:
    name: Testcontainer (PostgreSQL contention proofs)
    # Always GitHub-hosted: testcontainers-python needs a Docker daemon, which
    # neither the self-hosted container jobs nor the python:*-bookworm images
    # expose. ubuntu-24.04 ships Docker preinstalled for both push and PR runs.
    runs-on: ubuntu-24.04
    needs: [static-analysis]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
          prune-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libsqlcipher-dev

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run testcontainer suite
        run: |
          uv run pytest tests/testcontainer/ \
            -v \
            -m testcontainer

  # ===========================================================================
  # Stage 3c: Dependency and License Audit
  # ===========================================================================
  supply-chain-audit:
    name: Dependency and License Audit
    runs-on: ${{ fromJSON((github.event_name != 'pull_request') && '["self-hosted","Linux","X64","nyx-ci","trusted"]' || '"ubuntu-24.04"') }}
    container:
      image: python:3.13-bookworm
    needs: [static-analysis]
    env:
      CI_CHECKOUT_PATH: ci-${{ github.run_id }}-${{ github.run_attempt }}-supply-chain-audit
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: ${{ env.CI_CHECKOUT_PATH }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
          prune-cache: true

      - name: Use checkout-local uv cache
        run: echo "UV_CACHE_DIR=$GITHUB_WORKSPACE/$CI_CHECKOUT_PATH/.uv-cache" >> "$GITHUB_ENV"

      - name: Install system dependencies
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          apt-get update -q
          apt-get install -y -q libsqlcipher-dev

      - name: Install dependencies
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: uv sync --frozen --all-extras

      - name: Audit Python dependencies
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          uv export \
            --quiet \
            --frozen \
            --all-extras \
            --no-emit-project \
            --no-emit-package elspeth-lints \
            --format requirements-txt \
            --output-file requirements-audit.txt
          # CVE-2025-45768 / PYSEC-2025-183 has no fixed PyJWT release;
          # the disputed weakness is application-selected HMAC key length.
          # WebSettings enforces a 32-byte secret_key floor on non-loopback hosts.
          #
          # CVE-2026-45829 has no fixed chromadb release as of 2026-06-03 (the
          # pip-audit "Fix Versions" column is empty). chromadb backs the
          # chroma_sink + rag_retrieval plugins; remove this ignore and bump the
          # pin once an upstream fix ships. PyJWT advisories PYSEC-2026-175/177/
          # 178/179 are NOT ignored — they are resolved by the uv.lock bump to
          # PyJWT 2.13.0 (constraint already permitted it).
          uv run --with "pip-audit>=2.9,<3" pip-audit \
            --strict \
            --requirement requirements-audit.txt \
            --no-deps \
            --disable-pip \
            --ignore-vuln PYSEC-2025-183 \
            --ignore-vuln CVE-2026-45829 \
            --progress-spinner=off

      - name: Check Python dependency licenses
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          uv run --with "pip-licenses>=5,<6" pip-licenses \
            --fail-on "GPL;AGPL" \
            --format=markdown \
            --output-file=python-license-report.md

      - name: Upload Python license report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-license-report
          path: ${{ env.CI_CHECKOUT_PATH }}/python-license-report.md
          retention-days: 30

  # ===========================================================================
  # Stage 4: Frontend E2E (Playwright)
  # ===========================================================================
  # Boots the FastAPI backend + Vite dev server, runs Playwright tests
  # against a real Chromium. This job is in ci-success.needs so a red
  # browser journey blocks merge instead of being waved through.
  e2e-frontend:
    name: Frontend E2E (Playwright)
    runs-on: ${{ fromJSON((github.event_name != 'pull_request') && '["self-hosted","Linux","X64","nyx-ci","trusted"]' || '"ubuntu-24.04"') }}
    env:
      CI_CHECKOUT_PATH: ci-${{ github.run_id }}-${{ github.run_attempt }}-e2e-frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: ${{ env.CI_CHECKOUT_PATH }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
          prune-cache: true

      - name: Use checkout-local uv cache
        run: echo "UV_CACHE_DIR=$GITHUB_WORKSPACE/$CI_CHECKOUT_PATH/.uv-cache" >> "$GITHUB_ENV"

      - name: Install system dependencies
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          if [[ "${{ runner.environment }}" == "self-hosted" ]]; then
            dpkg-query -W libsqlcipher-dev
          else
            sudo apt-get update -q
            sudo apt-get install -y -q libsqlcipher-dev
          fi

      - name: Install Python dependencies
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: uv sync --frozen --all-extras

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: ${{ env.CI_CHECKOUT_PATH }}/src/elspeth/web/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ${{ env.CI_CHECKOUT_PATH }}/src/elspeth/web/frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: ${{ env.CI_CHECKOUT_PATH }}/src/elspeth/web/frontend
        run: |
          if [[ "${{ runner.environment }}" == "self-hosted" ]]; then
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Assign isolated Playwright ports
        run: |
          port_base=$((20000 + (GITHUB_RUN_ID % 20000)))
          echo "PLAYWRIGHT_BACKEND_PORT=$port_base" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_FRONTEND_PORT=$((port_base + 1))" >> "$GITHUB_ENV"

      - name: Run Playwright tests
        working-directory: ${{ env.CI_CHECKOUT_PATH }}/src/elspeth/web/frontend
        env:
          CI: "true"
        run: npm run test:e2e

      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report
          path: ${{ env.CI_CHECKOUT_PATH }}/src/elspeth/web/frontend/playwright-report/
          retention-days: 7

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-traces
          path: ${{ env.CI_CHECKOUT_PATH }}/src/elspeth/web/frontend/test-results/
          retention-days: 7

  # ===========================================================================
  # Frontend unit tests + type check (vitest, gating)
  # ===========================================================================
  # Phase 8 post-merge fix: before this job existed, the entire vitest
  # suite under ``src/elspeth/web/frontend/src/**/*.test.{ts,tsx}`` ran
  # only locally — no workflow invoked ``npm test`` or ``npm run
  # typecheck``.  That meant the ~525-case HeaderSessionSwitcher /
  # ComposerPreferencesPanel / TemplateCards / a11y-harness etc. test
  # corpus was advisory documentation rather than regression protection.
  # This lane is in ``ci-success.needs`` below so a red vitest run
  # blocks merge.
  frontend-unit:
    name: Frontend unit (vitest + typecheck)
    runs-on: ${{ fromJSON((github.event_name != 'pull_request') && '["self-hosted","Linux","X64","nyx-ci","trusted"]' || '"ubuntu-24.04"') }}
    env:
      CI_CHECKOUT_PATH: ci-${{ github.run_id }}-${{ github.run_attempt }}-frontend-unit
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: ${{ env.CI_CHECKOUT_PATH }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: ${{ env.CI_CHECKOUT_PATH }}/src/elspeth/web/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ${{ env.CI_CHECKOUT_PATH }}/src/elspeth/web/frontend
        run: npm ci

      - name: Type check
        working-directory: ${{ env.CI_CHECKOUT_PATH }}/src/elspeth/web/frontend
        run: npm run typecheck

      - name: Run vitest
        working-directory: ${{ env.CI_CHECKOUT_PATH }}/src/elspeth/web/frontend
        env:
          CI: "true"
        run: npm test -- --run

  # ===========================================================================
  # Summary Job - Required for branch protection
  # ===========================================================================
  ci-success:
    name: CI Success
    runs-on: ${{ fromJSON((github.event_name != 'pull_request') && '["self-hosted","Linux","X64","nyx-ci","trusted"]' || '"ubuntu-24.04"') }}
    needs:
      - static-analysis
      - test
      - testcontainer
      - supply-chain-audit
      - e2e-frontend
      - frontend-unit
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.static-analysis.result }}" != "success" ]]; then
            echo "Static analysis job failed"
            exit 1
          fi
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "Test job failed"
            exit 1
          fi
          if [[ "${{ needs.testcontainer.result }}" != "success" ]]; then
            echo "Testcontainer (PostgreSQL contention proofs) job failed"
            exit 1
          fi
          if [[ "${{ needs.supply-chain-audit.result }}" != "success" ]]; then
            echo "Dependency/license audit job failed"
            exit 1
          fi
          if [[ "${{ needs.e2e-frontend.result }}" != "success" ]]; then
            echo "Frontend E2E (Playwright) job failed"
            exit 1
          fi
          if [[ "${{ needs.frontend-unit.result }}" != "success" ]]; then
            echo "Frontend unit (vitest + typecheck) job failed"
            exit 1
          fi
          echo "All CI checks passed!"
