# CI Pipeline - Lint and Test
#
# Runs on every push and PR. Fast feedback loop with:
#   - Linting (ruff, mypy) - ~30 seconds
#   - Testing (pytest with coverage) - ~3-5 minutes
#   - Bug-hiding pattern detection
#   - Contract enforcement (Settings→Runtime alignment, type boundaries)
#
# All checks must pass before merging to protected integration branches.

name: CI

on:
  push:
    branches: [main, master, "RC*", "release/**"]
  pull_request:
    branches: [main, master, "RC*", "release/**"]

# Cancel in-progress runs when a new commit is pushed — except on release/**
# refs. A release branch is landed in bursts (~12 pushes in 11 h on
# 2026-09-04/05) and every CI run in that window was cancelled by the next
# push, so the required check never completed on a single sha
# (elspeth-d8749aeaa3). On a release ref the in-progress run finishes and
# only the pending run is replaced, so the tip is always tested eventually
# and every completed run is a verdict on a real sha. The three push
# workflows (ci, codeql, enforce-allowlist-judge-gates) keep this expression
# identical; tests/unit/cicd pins it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/release/') }}

env:
  PYTHON_VERSION: "3.13"
  UV_VERSION: "0.5"

permissions:
  contents: read

# Public-repository guardrail: pull_request workflows execute code from
# unmerged branches, so all PRs stay on GitHub-hosted runners.
# Trusted push workflows use the nyx runner.
#
# GitHub's runs-on expression accepts either a runner label string or a JSON
# array of labels. Keep this expression identical across jobs so the aggregate
# CI Success check reflects one routing policy.
#
# Self-hosted container jobs can leave root-owned venv/cache artifacts in the
# default workspace. Every checkout below uses a per-run, per-job path so stale
# workspace siblings cannot break actions/checkout before project commands run.
#
#   ${{ fromJSON((github.event_name != 'pull_request') && '["self-hosted","Linux","X64","nyx-ci","trusted"]' || '"ubuntu-24.04"') }}

jobs:
  # ===========================================================================
  # Stage 1: Static analysis (shared Python environment)
  # ===========================================================================
  static-analysis:
    name: Static analysis
    runs-on: ${{ fromJSON((github.event_name != 'pull_request') && '["self-hosted","Linux","X64","nyx-ci","trusted"]' || '"ubuntu-24.04"') }}
    container:
      image: python:3.13-bookworm
    env:
      CI_CHECKOUT_PATH: ci-${{ github.run_id }}-${{ github.run_attempt }}-static-analysis
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: ${{ env.CI_CHECKOUT_PATH }}
          # Branch-creation pushes have no event.before. Full history is needed
          # to resolve their complete delta from the default-branch merge base.
          fetch-depth: 0

      - name: Check GitHub workflows (actionlint)
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        shell: bash
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          tarball="$tmp_dir/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          python - <<'PY' "$tarball" "$ACTIONLINT_VERSION"
          from pathlib import Path
          import sys
          import urllib.request

          tarball = Path(sys.argv[1])
          version = sys.argv[2]
          url = f"https://github.com/rhysd/actionlint/releases/download/v{version}/actionlint_{version}_linux_amd64.tar.gz"
          urllib.request.urlretrieve(url, tarball)
          PY
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" -C "$tmp_dir" actionlint
          "$tmp_dir/actionlint" -config-file .github/actionlint.yaml .github/workflows/*.yml .github/workflows/*.yaml

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
          prune-cache: true

      - name: Use checkout-local uv cache
        run: echo "UV_CACHE_DIR=$GITHUB_WORKSPACE/$CI_CHECKOUT_PATH/.uv-cache" >> "$GITHUB_ENV"

      - name: Install system dependencies
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          apt-get update -q
          apt-get install -y -q libsqlcipher-dev

      - name: Install dependencies
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: uv sync --frozen --all-extras

      - name: Check code style (ruff)
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: uv run ruff check src/ tests/ scripts/ examples/ elspeth-lints/src/

      - name: Check formatting (ruff format)
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: uv run ruff format --check src/ tests/ scripts/ examples/ elspeth-lints/src/

      - name: Type check (mypy)
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: uv run mypy src/ elspeth-lints/src/

      - name: Check composer skill tool inventory
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: uv run python scripts/cicd/generate_skill_inventory.py --check

      - name: Enforce contract alignment
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: uv run python scripts/check_contracts.py

      - name: Run plugin options metadata elspeth-lints rule
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          PYTHONPATH=elspeth-lints/src uv run python -m elspeth_lints.core.cli check \
            --rules plugin_contract.options_metadata \
            --root .

      - name: Run plugin-contract elspeth-lints rules
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          PYTHONPATH=elspeth-lints/src uv run python -m elspeth_lints.core.cli check \
            --rules plugin_contract.component_type,plugin_contract.plugin_hashes \
            --root src/elspeth

      - name: Run immutability elspeth-lints rules
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          PYTHONPATH=elspeth-lints/src uv run python -m elspeth_lints.core.cli check \
            --rules immutability.freeze_guards,immutability.frozen_annotations \
            --root src/elspeth

      - name: Run audit-evidence elspeth-lints rules
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          PYTHONPATH=elspeth-lints/src uv run python -m elspeth_lints.core.cli check \
            --rules audit_evidence.nominal_base,audit_evidence.tier_1_decoration,audit_evidence.guard_symmetry,audit_evidence.gve_attribution \
            --root src/elspeth

      - name: Run composer elspeth-lints rules
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          PYTHONPATH=elspeth-lints/src uv run python -m elspeth_lints.core.cli check \
            --rules 'composer/*' \
            --root src/elspeth \
            --fail-on-inert

      - name: Run contract-invariants elspeth-lints rules
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          PYTHONPATH=elspeth-lints/src uv run python -m elspeth_lints.core.cli check \
            --rules 'contract_invariants/*' \
            --root src/elspeth \
            --fail-on-inert

      - name: Run session-engine-factory elspeth-lints rule
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          PYTHONPATH=elspeth-lints/src uv run python -m elspeth_lints.core.cli check \
            --rules contract_invariants.session_engine_factory \
            --root . \
            --fail-on-inert

      - name: Run contract-manifest elspeth-lints rule
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          PYTHONPATH=elspeth-lints/src uv run python -m elspeth_lints.core.cli check \
            --rules manifest.contract_manifest \
            --root src/elspeth

      - name: Run symbol inventory elspeth-lints rule
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          PYTHONPATH=elspeth-lints/src uv run python -m elspeth_lints.core.cli check \
            --rules manifest.symbol_inventory \
            --root .

      - name: Run trust-boundary honesty-gate elspeth-lints rules
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          PYTHONPATH=elspeth-lints/src uv run python -m elspeth_lints.core.cli check \
            --rules trust_boundary.tests,trust_boundary.scope,trust_boundary.tier \
            --root src/elspeth

      - name: Forbid new bespoke CI enforcers
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          PYTHONPATH=elspeth-lints/src uv run python -m elspeth_lints.core.cli check \
            --rules meta.no-new-bespoke-cicd-enforcer \
            --root .

      - name: Emit elspeth-lints SARIF artifact
        if: always()
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          set +e
          PYTHONPATH=elspeth-lints/src uv run python -m elspeth_lints.core.cli check \
            --rules meta.no-new-bespoke-cicd-enforcer,plugin_contract.options_metadata \
            --root . \
            --format sarif > elspeth-lints.sarif
          status=$?
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi

      - name: Emit elspeth-lints immutability SARIF artifact
        if: always()
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          set +e
          PYTHONPATH=elspeth-lints/src uv run python -m elspeth_lints.core.cli check \
            --rules immutability.freeze_guards,immutability.frozen_annotations \
            --root src/elspeth \
            --format sarif > elspeth-lints-immutability.sarif
          status=$?
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi

      - name: Emit elspeth-lints plugin-contract SARIF artifact
        if: always()
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          set +e
          PYTHONPATH=elspeth-lints/src uv run python -m elspeth_lints.core.cli check \
            --rules plugin_contract.component_type,plugin_contract.plugin_hashes \
            --root src/elspeth \
            --format sarif > elspeth-lints-plugin-contract.sarif
          status=$?
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi

      - name: Emit elspeth-lints audit-evidence SARIF artifact
        if: always()
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          set +e
          PYTHONPATH=elspeth-lints/src uv run python -m elspeth_lints.core.cli check \
            --rules audit_evidence.nominal_base,audit_evidence.tier_1_decoration,audit_evidence.guard_symmetry,audit_evidence.gve_attribution \
            --root src/elspeth \
            --format sarif > elspeth-lints-audit-evidence.sarif
          status=$?
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi

      - name: Emit elspeth-lints composer SARIF artifact
        if: always()
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          set +e
          PYTHONPATH=elspeth-lints/src uv run python -m elspeth_lints.core.cli check \
            --rules 'composer/*' \
            --root src/elspeth \
            --fail-on-inert \
            --format sarif > elspeth-lints-composer.sarif
          status=$?
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi

      - name: Emit elspeth-lints contract-invariants SARIF artifact
        if: always()
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          set +e
          PYTHONPATH=elspeth-lints/src uv run python -m elspeth_lints.core.cli check \
            --rules 'contract_invariants/*' \
            --root src/elspeth \
            --fail-on-inert \
            --format sarif > elspeth-lints-contract-invariants.sarif
          status=$?
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi

      - name: Emit elspeth-lints session-engine-factory SARIF artifact
        if: always()
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          set +e
          PYTHONPATH=elspeth-lints/src uv run python -m elspeth_lints.core.cli check \
            --rules contract_invariants.session_engine_factory \
            --root . \
            --fail-on-inert \
            --format sarif > elspeth-lints-session-engine-factory.sarif
          status=$?
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi

      - name: Emit elspeth-lints contract-manifest SARIF artifact
        if: always()
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          set +e
          PYTHONPATH=elspeth-lints/src uv run python -m elspeth_lints.core.cli check \
            --rules manifest.contract_manifest \
            --root src/elspeth \
            --format sarif > elspeth-lints-contract-manifest.sarif
          status=$?
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi

      - name: Emit elspeth-lints symbol-inventory SARIF artifact
        if: always()
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          set +e
          PYTHONPATH=elspeth-lints/src uv run python -m elspeth_lints.core.cli check \
            --rules manifest.symbol_inventory \
            --root . \
            --format sarif > elspeth-lints-symbol-inventory.sarif
          status=$?
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi

      - name: Upload elspeth-lints SARIF artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: elspeth-lints-sarif
          path: |
            ${{ env.CI_CHECKOUT_PATH }}/elspeth-lints.sarif
            ${{ env.CI_CHECKOUT_PATH }}/elspeth-lints-immutability.sarif
            ${{ env.CI_CHECKOUT_PATH }}/elspeth-lints-plugin-contract.sarif
            ${{ env.CI_CHECKOUT_PATH }}/elspeth-lints-audit-evidence.sarif
            ${{ env.CI_CHECKOUT_PATH }}/elspeth-lints-composer.sarif
            ${{ env.CI_CHECKOUT_PATH }}/elspeth-lints-contract-invariants.sarif
            ${{ env.CI_CHECKOUT_PATH }}/elspeth-lints-session-engine-factory.sarif
            ${{ env.CI_CHECKOUT_PATH }}/elspeth-lints-contract-manifest.sarif
            ${{ env.CI_CHECKOUT_PATH }}/elspeth-lints-symbol-inventory.sarif
          retention-days: 7

      - name: Compare shadow-mode lints
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          PYTHONPATH=elspeth-lints/src uv run python scripts/cicd/parity_harness.py \
            --manifest config/cicd/lint_migration_status.yaml \
            --root .

  # ===========================================================================
  # Stage 3: Test (Quality gate - ~3-5 minutes)
  # ===========================================================================
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ${{ fromJSON((github.event_name != 'pull_request') && '["self-hosted","Linux","X64","nyx-ci","trusted"]' || '"ubuntu-24.04"') }}
    container:
      image: python:${{ matrix.python-version }}-bookworm
      # Docker 29 on the self-hosted runners starts containers with a soft
      # open-file limit of 1024 (measured: `ulimit -Sn` in
      # python:3.13-bookworm). With 2 workers each xdist process runs ~30k
      # tests, and on 2026-09-29 worker gw0 hit `OSError: [Errno 24] Too many
      # open files` at 25%: 108 failed + 1661 errors on that one worker, none
      # on any other (run 36526535297).
      options: --ulimit nofile=65536:524288
    env:
      CI_CHECKOUT_PATH: ci-${{ github.run_id }}-${{ github.run_attempt }}-test-${{ matrix.python-version }}
      PYTEST_WORKERS: ${{ matrix.workers }}
    # Run tests even if static analysis fails, so both results are visible.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        # Coverage runs on Python 3.13 only because 3.13 is the release
        # interpreter for this branch. The Python 3.12 lane remains
        # dependency-compatibility signal and intentionally skips coverage so
        # one XML/threshold report is authoritative.
        include:
          - python-version: "3.12"
            coverage: false
            workers: "4"
          - python-version: "3.13"
            coverage: true
            workers: "2"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: ${{ env.CI_CHECKOUT_PATH }}
          # Full history: tests/unit/docs/test_adr_public_integrity.py and
          # tests/unit/deployment/test_aws_ecs_terraform_package.py resolve
          # cited commits and fail loudly under GITHUB_ACTIONS when history
          # is missing (their own rule, elspeth-af1efcb8d8); the default
          # depth-1 checkout made both red on every push (elspeth-bc97e06221 B4).
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
          prune-cache: true

      - name: Use checkout-local uv cache
        run: echo "UV_CACHE_DIR=$GITHUB_WORKSPACE/$CI_CHECKOUT_PATH/.uv-cache" >> "$GITHUB_ENV"

      - name: Install system dependencies
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        # ripgrep: tests/unit/architecture/test_sink_publication_callers.py's alias
        # sweep; sqlite3: examples/multi_worker_showcase/outcome_stats.sh
        # under tests/e2e/examples. These dependencies were absent from the
        # python:*-bookworm image (elspeth-bc97e06221 B1).
        # Docker is NOT available inside a container
        # job; the docker-CLI tests run in the host-runner-unit job below.
        run: |
          apt-get update -q
          apt-get install -y -q libsqlcipher-dev jq unzip nodejs ripgrep sqlite3

      - name: Install Terraform (native deployment-package contract tests)
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        # Without a terraform binary the native mock-plan contract tests in
        # tests/unit/deployment/test_aws_ecs_terraform_package.py skipped
        # silently, so CI proved nothing about the shipped package
        # (elspeth-af1efcb8d8). The tests now fail loudly under
        # GITHUB_ACTIONS when terraform is absent, and this step supplies
        # it, checksum-pinned against the official release manifest.
        run: |
          TF_VERSION=1.15.7
          TF_SHA256=73bbb8f5188ad75d4fb853fd100ae4d7e146ef7af7db18776109642fdb7759d2
          curl -fsSLo /tmp/terraform.zip \
            "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
          printf '%s  /tmp/terraform.zip\n' "$TF_SHA256" | sha256sum -c -
          unzip -o -q /tmp/terraform.zip -d /usr/local/bin terraform
          terraform version

      - name: Install Bicep (Azure Container Apps bundle contract tests)
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        # tests/unit/deployment/test_azure_container_apps_bundle.py compiles
        # the tracked Bicep bundle and asserts on the compiled ARM. Like the
        # Terraform step above, the binary is pinned by version and SHA-256
        # (the pin the platform facts record) and the tests fail loudly under
        # GITHUB_ACTIONS when it is absent rather than skipping silently.
        run: |
          BICEP_VERSION=0.46.1
          BICEP_SHA256=3e011d629ea4311b7a7dd8f0040ab2b1a072ea4ff5d02cb75e0e55a9a6703fb9
          curl -fsSLo /tmp/bicep \
            "https://github.com/Azure/bicep/releases/download/v${BICEP_VERSION}/bicep-linux-x64"
          printf '%s  /tmp/bicep\n' "$BICEP_SHA256" | sha256sum -c -
          install -m 0755 /tmp/bicep /usr/local/bin/bicep
          bicep --version

      - name: Install dependencies
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: uv sync --frozen --all-extras

      - name: Run tests with coverage
        if: matrix.coverage
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          # No `-m` here: the marker selection is pyproject addopts' (the
          # single source of truth, pinned in tests/unit/cicd). A later `-m`
          # on the command line REPLACES the addopts one, and the copy that
          # lived here had drifted to omit `not live_provider`: 56 live nodes
          # were selected, tests/conftest.py refused them with a UsageError
          # inside every xdist worker, and xdist reported that as a crashed
          # first item on every push (elspeth-6128fc7f95 / elspeth-515183ac5a).
          # PR #212's hosted 3.12 and 3.13 jobs were SIGKILLed with the default
          # 12 workers; the 3.13 coverage job was also SIGKILLed at 4 workers.
          # The trusted push 3.13 job also failed with 12 workers, including
          # coverage database errors. Bound concurrency for both event types.
          #
          # `-q -rfE`, not `-v`: `-v` printed ~120k lines, and the retrievable
          # job log stops at ~71k (both lanes of run 36502389326 end at 59%,
          # 20 minutes before the step failed), so the failure summary was
          # never readable. The JUnit report is the complete record.
          uv run pytest tests/ \
            --cov=src/elspeth \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=85 \
            -n "$PYTEST_WORKERS" \
            -q -rfE \
            --junitxml=pytest-junit.xml

      - name: Enforce audit-critical coverage floors
        if: matrix.coverage
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          # Ratchet the verified 2026-05-19 baseline while the test-debt
          # uplift to 95% is planned. Do not lower without fresh evidence.
          # 2026-06-19: landscape floor 93 -> 92, orchestrator 91 -> 90. Fresh
          # evidence: the 0.6.0 multi-worker work added substantial landscape +
          # orchestrator code (run_coordination, scheduler/execution/lifecycle
          # repositories; multi-worker orchestration paths) whose test coverage
          # sits below the prior subsystem floors (scheduler 88%, execution 89%,
          # run_lifecycle 90%; the new run_coordination_repository is itself at
          # 94%). The Test lane was masked behind static-analysis while this
          # landed, so the dip surfaced only now. Uplift remains tracked debt.
          # All four floors are checked every run (collect-then-fail) so a dip
          # in any subsystem surfaces together rather than one cycle at a time.
          status=0
          uv run coverage report --include="src/elspeth/core/landscape/*" --fail-under=92 || status=1
          uv run coverage report --include="src/elspeth/core/canonical.py" --fail-under=99 || status=1
          uv run coverage report --include="src/elspeth/engine/orchestrator/*" --fail-under=90 || status=1
          uv run coverage report --include="src/elspeth/contracts/*" --fail-under=62 || status=1
          exit "$status"

      - name: Run tests without coverage
        if: ${{ !matrix.coverage }}
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          # No `-m`: same reason as the coverage step above. Use the same
          # per-lane worker cap as the coverage lane, and the same output
          # flags and JUnit report.
          uv run pytest tests/ \
            -n "$PYTEST_WORKERS" \
            -q -rfE \
            --junitxml=pytest-junit.xml

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pytest-junit-${{ matrix.python-version }}
          path: ${{ env.CI_CHECKOUT_PATH }}/pytest-junit.xml
          retention-days: 7

      - name: Upload coverage report
        if: matrix.coverage && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-report
          path: ${{ env.CI_CHECKOUT_PATH }}/coverage.xml
          retention-days: 7

  # ===========================================================================
  # Stage 5: Integration Tests (Optional - requires secrets)
  # ===========================================================================
  integration:
    name: Integration Tests
    runs-on: ${{ fromJSON((github.event_name != 'pull_request') && '["self-hosted","Linux","X64","nyx-ci","trusted"]' || '"ubuntu-24.04"') }}
    container:
      image: python:3.13-bookworm
      # Same open-file limit as the Test job (see the note there).
      options: --ulimit nofile=65536:524288
    needs: [test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/RC') || startsWith(github.ref, 'refs/heads/release/'))
    env:
      CI_CHECKOUT_PATH: ci-${{ github.run_id }}-${{ github.run_attempt }}-integration
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: ${{ env.CI_CHECKOUT_PATH }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
          prune-cache: true

      - name: Use checkout-local uv cache
        run: echo "UV_CACHE_DIR=$GITHUB_WORKSPACE/$CI_CHECKOUT_PATH/.uv-cache" >> "$GITHUB_ENV"

      - name: Install system dependencies
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          apt-get update -q
          apt-get install -y -q libsqlcipher-dev

      - name: Install dependencies
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: uv sync --frozen --all-extras

      - name: Run integration tests
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          # Fail closed: a real integration failure — assertion regression,
          # collection/import error (exit 2), internal error (exit 3), or
          # infra fault — must fail the lane so build-push.yaml never builds an
          # image off a broken CI run. The only tolerated outcome is pytest's
          # exit code 5 ("no tests collected"); integration tests self-skip via
          # pytest.skip / importorskip when their credentials are absent, which
          # is exit 0 anyway. ``|| status=$?`` captures the code without letting
          # ``set -e`` abort before we can inspect it.
          #
          # No `-m` here: the marker selection is pyproject addopts' (the single
          # source of truth, pinned in tests/unit/cicd). The `-m integration`
          # that used to sit on this line narrowed NOTHING — tests/integration/
          # conftest.py auto-marks every node under this path `integration`, so
          # it selected 3153 of 3153 — while REPLACING the addopts expression
          # and so dropping every guard in it: 55 live_provider, 27
          # testcontainer and 33 slow/stress/performance ids were selected (83
          # distinct, overlapping). tests/conftest.py refuses a selected
          # live_provider node with a UsageError, which is exit 4, and the only
          # non-zero code this job tolerates is 5 — so the first genuinely green
          # Test job would have failed this one and taken the run conclusion,
          # and build-push.yaml with it (elspeth-7103e36698; the same defect as
          # the closed elspeth-6128fc7f95 in the Test job, one job over).
          # Nothing is retired by the narrower selection: the 27 testcontainer
          # ids are a measured subset of the 298 the testcontainer job runs
          # tree-wide, and the live_provider ids are operator-gated
          # (`--run-live-provider`) and by design run in no CI job at all.
          status=0
          uv run pytest tests/integration/ -v || status=$?
          if [ "$status" -eq 5 ]; then
            echo "No integration tests collected (exit 5) — treating as a skip."
            exit 0
          fi
          exit "$status"

  # ===========================================================================
  # Stage 5b: Testcontainer proofs (real PostgreSQL contention via Docker)
  # ===========================================================================
  testcontainer:
    name: Testcontainer (PostgreSQL contention proofs)
    # Always GitHub-hosted: testcontainers-python needs a Docker daemon, which
    # neither the self-hosted container jobs nor the python:*-bookworm images
    # expose. ubuntu-24.04 ships Docker preinstalled for both push and PR runs.
    runs-on: ubuntu-24.04
    # Run PostgreSQL proofs even if static analysis fails. CI Success requires both.
    # PR #212 selected 651 ids on a hosted runner and reached 53% when the
    # previous 30-minute limit cancelled the job. Allow the full required
    # serial suite to finish and report its result.
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
          prune-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libsqlcipher-dev

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run testcontainer suite
        # The whole tree, not tests/testcontainer/: four files under
        # tests/integration/web/ carry per-test testcontainer marks, and the
        # default selection (pyproject addopts) deselects the marker, so this
        # job is the only place those ids ever run. -n 0 is mandatory:
        # tests/testcontainer/web/conftest.py shares one TLS PostgreSQL
        # container across the deployment-acceptance files and raises
        # UsageError under any xdist worker, while addopts default to -n 12.
        # The junit report is the evidence Phase 7 cites for the P0 pin test
        # tests/testcontainer/web/test_schema_probe_postgres.py::
        # test_fresh_create_reaches_current (elspeth-d8749aeaa3).
        run: |
          uv run pytest tests/ \
            -v \
            -m testcontainer \
            -n 0 \
            --junitxml=testcontainer-junit.xml

      - name: Upload testcontainer junit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: testcontainer-junit
          path: testcontainer-junit.xml
          retention-days: 30

  host-runner-unit:
    name: Host-runner unit (docker CLI, non-root filesystem)
    # Two unit files need what a container job cannot give: a docker CLI
    # (tests/unit/deployment/test_compose_bundle.py renders the compose bundle
    # with `docker compose config`) and a non-root uid (tests/unit/web/
    # aws_ecs_acceptance/test_error_projection.py proves chmod-based
    # unreadable/unwritable projections, which uid 0 ignores). In the `test`
    # container job those ids skip with a reason; here the ELSPETH_CI_*_REQUIRED
    # variables turn the skips into failures, so the ids are proven on every
    # push rather than silently absent (elspeth-bc97e06221 B1, B3).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
          prune-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libsqlcipher-dev

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run host-only unit tests
        env:
          ELSPETH_CI_DOCKER_REQUIRED: "1"
          ELSPETH_CI_NON_ROOT_REQUIRED: "1"
        run: |
          uv run pytest \
            tests/unit/deployment/test_compose_bundle.py \
            tests/unit/web/aws_ecs_acceptance/test_error_projection.py \
            -v \
            -n 0

  # ===========================================================================
  # Stage 3c: Dependency and License Audit
  # ===========================================================================
  state-engine-validation:
    name: State-engine catalog and selector validation
    runs-on: ubuntu-24.04
    needs: [static-analysis]
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
          prune-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libsqlcipher-dev

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Validate frozen v2 catalog
        run: uv run python scripts/state_engine_assessment.py validate-catalog docs/architecture/state_engine/proof-catalog/v2/catalog.json

      - name: Validate current v3 catalog
        run: uv run python scripts/state_engine_assessment.py validate-catalog docs/architecture/state_engine/proof-catalog/v3/catalog.json

      - name: Validate plugin lifecycle matrix inventory
        run: uv run python scripts/state_engine_plugin_matrix.py check tests/golden/state_engine/plugin_lifecycle_matrix.json

      - name: Validate v3 evidence selector manifest
        run: |
          uv run python scripts/state_engine_assessment.py validate-selectors \
            docs/architecture/state_engine/proof-catalog/v3/evidence_selectors.json \
            --catalog docs/architecture/state_engine/proof-catalog/v3/catalog.json

      - name: Validate state-engine documentation links
        run: uv run python scripts/state_engine_assessment.py check-links

  # ===========================================================================
  # Azure Container Apps bundle: compile every template and parameter file
  # with the pinned Bicep CLI, then run the compiled-ARM contract test. The
  # bundle is deploy/azure-container-apps/ (Phase 6b, elspeth-25e9b67d05).
  # ===========================================================================
  azure-container-apps-bicep:
    name: Azure Container Apps Bicep bundle
    runs-on: ubuntu-24.04
    needs: [static-analysis]
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Bicep (pinned)
        run: |
          BICEP_VERSION=0.46.1
          BICEP_SHA256=3e011d629ea4311b7a7dd8f0040ab2b1a072ea4ff5d02cb75e0e55a9a6703fb9
          curl -fsSLo /tmp/bicep \
            "https://github.com/Azure/bicep/releases/download/v${BICEP_VERSION}/bicep-linux-x64"
          printf '%s  /tmp/bicep\n' "$BICEP_SHA256" | sha256sum -c -
          sudo install -m 0755 /tmp/bicep /usr/local/bin/bicep
          bicep --version

      - name: Compile the bundle
        run: |
          set -euo pipefail
          bicep build deploy/azure-container-apps/main.bicep --stdout >/dev/null
          bicep build deploy/azure-container-apps/environment.bicep --stdout >/dev/null
          bicep build deploy/azure-container-apps/workload.bicep --stdout >/dev/null
          bicep build-params deploy/azure-container-apps/main.example.bicepparam --stdout >/dev/null
          bicep build-params deploy/azure-container-apps/main.acceptance.bicepparam --stdout >/dev/null
          bicep build-params deploy/azure-container-apps/environment.example.bicepparam --stdout >/dev/null
          bicep build-params deploy/azure-container-apps/workload.production.bicepparam --stdout >/dev/null
          bicep build-params deploy/azure-container-apps/workload.acceptance.bicepparam --stdout >/dev/null

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
          prune-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libsqlcipher-dev

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run the compiled-ARM bundle contract test
        run: uv run pytest tests/unit/deployment/test_azure_container_apps_bundle.py -v

  supply-chain-audit:
    name: Dependency and License Audit
    runs-on: ${{ fromJSON((github.event_name != 'pull_request') && '["self-hosted","Linux","X64","nyx-ci","trusted"]' || '"ubuntu-24.04"') }}
    container:
      image: python:3.13-bookworm
    needs: [static-analysis]
    env:
      CI_CHECKOUT_PATH: ci-${{ github.run_id }}-${{ github.run_attempt }}-supply-chain-audit
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: ${{ env.CI_CHECKOUT_PATH }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
          prune-cache: true

      - name: Use checkout-local uv cache
        run: echo "UV_CACHE_DIR=$GITHUB_WORKSPACE/$CI_CHECKOUT_PATH/.uv-cache" >> "$GITHUB_ENV"

      - name: Install system dependencies
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          apt-get update -q
          apt-get install -y -q libsqlcipher-dev

      - name: Install dependencies
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: uv sync --frozen --all-extras

      - name: Audit Python dependencies
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          uv export \
            --quiet \
            --frozen \
            --all-extras \
            --no-emit-project \
            --no-emit-package elspeth-lints \
            --format requirements-txt \
            --output-file requirements-audit.txt
          # CVE-2025-45768 / PYSEC-2025-183 has no fixed PyJWT release;
          # the disputed weakness is application-selected HMAC key length.
          # WebSettings enforces a 32-byte secret_key floor on non-loopback hosts.
          #
          # CVE-2026-45829 has no fixed chromadb release as of 2026-06-03 (the
          # pip-audit "Fix Versions" column is empty). chromadb backs the
          # chroma_sink + rag_retrieval plugins; remove this ignore and bump the
          # pin once an upstream fix ships. PyJWT advisories PYSEC-2026-175/177/
          # 178/179 are NOT ignored — they are resolved by the uv.lock bump to
          # PyJWT 2.13.0 (constraint already permitted it).
          #
          # CVE-2026-45830 / CVE-2026-45831 / CVE-2026-45833 (added 2026-09-10)
          # likewise have no fixed chromadb release. All three are defects in the
          # ChromaDB *server*: cross-tenant read/write through missing
          # authorization validation on /api/v2/tenants/... (45830), a
          # SimpleRBACAuthorizationProvider that checks the permission but never
          # the tenant/database/collection it applies to (45831), and
          # trust_remote_code arbitrary code execution reachable by a caller
          # holding UPDATE_COLLECTION (45833). ELSPETH never runs that server: it
          # is a client only — chromadb.Client / PersistentClient / HttpClient in
          # plugins/infrastructure/clients/retrieval/chroma.py, sinks/chroma_sink.py
          # and infrastructure/probe_factory.py — and registers no authorization
          # provider and no /api/v2 route. An operator who points HttpClient at a
          # Chroma server they host owns that server's exposure; this ignore does
          # not extend to it. Remove all four chromadb ignores and bump the pin
          # once upstream ships a fix.
          uv run --with "pip-audit>=2.9,<3" pip-audit \
            --strict \
            --requirement requirements-audit.txt \
            --no-deps \
            --disable-pip \
            --ignore-vuln PYSEC-2025-183 \
            --ignore-vuln CVE-2026-45829 \
            --ignore-vuln CVE-2026-45830 \
            --ignore-vuln CVE-2026-45831 \
            --ignore-vuln CVE-2026-45833 \
            --progress-spinner=off

      - name: Check Python dependency licenses
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          uv run --with "pip-licenses>=5,<6" pip-licenses \
            --fail-on "GPL;AGPL" \
            --format=markdown \
            --output-file=python-license-report.md

      - name: Upload Python license report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-license-report
          path: ${{ env.CI_CHECKOUT_PATH }}/python-license-report.md
          retention-days: 30

  # ===========================================================================
  # Stage 4: Frontend E2E (Playwright)
  # ===========================================================================
  # Boots the FastAPI backend + Vite dev server, runs Playwright tests
  # against a real Chromium. This job is in ci-success.needs so a red
  # browser journey blocks merge instead of being waved through.
  e2e-frontend:
    name: Frontend E2E (Playwright)
    runs-on: ${{ fromJSON((github.event_name != 'pull_request') && '["self-hosted","Linux","X64","nyx-ci","trusted"]' || '"ubuntu-24.04"') }}
    env:
      CI_CHECKOUT_PATH: ci-${{ github.run_id }}-${{ github.run_attempt }}-e2e-frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: ${{ env.CI_CHECKOUT_PATH }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
          prune-cache: true

      - name: Use checkout-local uv cache
        run: echo "UV_CACHE_DIR=$GITHUB_WORKSPACE/$CI_CHECKOUT_PATH/.uv-cache" >> "$GITHUB_ENV"

      - name: Install system dependencies
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          if [[ "${{ runner.environment }}" == "self-hosted" ]]; then
            dpkg-query -W libsqlcipher-dev
          else
            sudo apt-get update -q
            sudo apt-get install -y -q libsqlcipher-dev
          fi

      - name: Install Python dependencies
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: uv sync --frozen --all-extras

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: ${{ env.CI_CHECKOUT_PATH }}/src/elspeth/web/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ${{ env.CI_CHECKOUT_PATH }}/src/elspeth/web/frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: ${{ env.CI_CHECKOUT_PATH }}/src/elspeth/web/frontend
        run: |
          if [[ "${{ runner.environment }}" == "self-hosted" ]]; then
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Assign isolated Playwright ports
        run: |
          port_base=$((20000 + (GITHUB_RUN_ID % 20000)))
          echo "PLAYWRIGHT_BACKEND_PORT=$port_base" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_FRONTEND_PORT=$((port_base + 1))" >> "$GITHUB_ENV"

      - name: Run Playwright tests
        working-directory: ${{ env.CI_CHECKOUT_PATH }}/src/elspeth/web/frontend
        env:
          CI: "true"
        run: npm run test:e2e

      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report
          path: ${{ env.CI_CHECKOUT_PATH }}/src/elspeth/web/frontend/playwright-report/
          retention-days: 7

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-traces
          path: ${{ env.CI_CHECKOUT_PATH }}/src/elspeth/web/frontend/test-results/
          retention-days: 7

  # ===========================================================================
  # Frontend unit tests + type check (vitest, gating)
  # ===========================================================================
  # Phase 8 post-merge fix: before this job existed, the entire vitest
  # suite under ``src/elspeth/web/frontend/src/**/*.test.{ts,tsx}`` ran
  # only locally — no workflow invoked ``npm test`` or ``npm run
  # typecheck``.  That meant the ~525-case HeaderSessionSwitcher /
  # ComposerPreferencesPanel / TemplateCards / a11y-harness etc. test
  # corpus was advisory documentation rather than regression protection.
  # This lane is in ``ci-success.needs`` below so a red vitest run
  # blocks merge.
  frontend-unit:
    name: Frontend unit (vitest + typecheck)
    runs-on: ${{ fromJSON((github.event_name != 'pull_request') && '["self-hosted","Linux","X64","nyx-ci","trusted"]' || '"ubuntu-24.04"') }}
    env:
      CI_CHECKOUT_PATH: ci-${{ github.run_id }}-${{ github.run_attempt }}-frontend-unit
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: ${{ env.CI_CHECKOUT_PATH }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: ${{ env.CI_CHECKOUT_PATH }}/src/elspeth/web/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ${{ env.CI_CHECKOUT_PATH }}/src/elspeth/web/frontend
        run: npm ci

      - name: Type check
        working-directory: ${{ env.CI_CHECKOUT_PATH }}/src/elspeth/web/frontend
        run: npm run typecheck

      - name: Run vitest
        working-directory: ${{ env.CI_CHECKOUT_PATH }}/src/elspeth/web/frontend
        env:
          CI: "true"
        run: npm test -- --run

  # ===========================================================================
  # Summary Job - Required for branch protection
  # ===========================================================================
  ci-success:
    name: CI Success
    runs-on: ${{ fromJSON((github.event_name != 'pull_request') && '["self-hosted","Linux","X64","nyx-ci","trusted"]' || '"ubuntu-24.04"') }}
    needs:
      - static-analysis
      - test
      - testcontainer
      - host-runner-unit
      - state-engine-validation
      - azure-container-apps-bicep
      - supply-chain-audit
      - e2e-frontend
      - frontend-unit
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.static-analysis.result }}" != "success" ]]; then
            echo "Static analysis job failed"
            exit 1
          fi
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "Test job failed"
            exit 1
          fi
          if [[ "${{ needs.testcontainer.result }}" != "success" ]]; then
            echo "Testcontainer (PostgreSQL contention proofs) job failed"
            exit 1
          fi
          if [[ "${{ needs.host-runner-unit.result }}" != "success" ]]; then
            echo "Host-runner unit (docker CLI, non-root filesystem) job failed"
            exit 1
          fi
          if [[ "${{ needs.state-engine-validation.result }}" != "success" ]]; then
            echo "State-engine catalog and selector validation job failed"
            exit 1
          fi
          if [[ "${{ needs.azure-container-apps-bicep.result }}" != "success" ]]; then
            echo "Azure Container Apps Bicep bundle job failed"
            exit 1
          fi
          if [[ "${{ needs.supply-chain-audit.result }}" != "success" ]]; then
            echo "Dependency/license audit job failed"
            exit 1
          fi
          if [[ "${{ needs.e2e-frontend.result }}" != "success" ]]; then
            echo "Frontend E2E (Playwright) job failed"
            exit 1
          fi
          if [[ "${{ needs.frontend-unit.result }}" != "success" ]]; then
            echo "Frontend unit (vitest + typecheck) job failed"
            exit 1
          fi
          echo "All CI checks passed!"
