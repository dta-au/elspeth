      ELSPETH_TEST_CHROMA_PORT: ${{ vars.ELSPETH_TEST_CHROMA_PORT }}
      ELSPETH_TEST_CHROMA_SSL: ${{ vars.ELSPETH_TEST_CHROMA_SSL }}
      ELSPETH_TEST_CHROMA_TENANT: ${{ vars.ELSPETH_TEST_CHROMA_TENANT }}
      ELSPETH_TEST_CHROMA_DATABASE: ${{ vars.ELSPETH_TEST_CHROMA_DATABASE }}
