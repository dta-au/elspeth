# Mutation Testing Workflow
# Runs weekly as advisory quality telemetry - mutation testing is slow so not run on every PR
#
# Mutation testing introduces artificial bugs (mutants) into the code and checks if tests catch them.
# A high mutation score means tests actually verify behavior, not just execute code.
#
# Mutation scores are advisory. Tool failures and missing/empty mutant
# inventories fail the job; score thresholds are not enforced here.

name: Mutation Testing

on:
  schedule:
    # Weekly on Sunday at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    # Allow manual triggering for ad-hoc runs
    inputs:
      paths_to_mutate:
        description: 'Specific path to mutate (default: src/elspeth/core/)'
        required: false
        default: 'src/elspeth/core/canonical.py'

env:
  UV_VERSION: "0.10.2"

jobs:
  mutation-test:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.ref_protected
    runs-on: [self-hosted, Linux, X64, nyx-ci, trusted]
    timeout-minutes: 60  # Mutation testing is slow
    env:
      CI_CHECKOUT_PATH: mutation-${{ github.run_id }}-${{ github.run_attempt }}-canonical
      UV_CACHE_DIR: ${{ github.workspace }}/mutation-${{ github.run_id }}-${{ github.run_attempt }}-canonical/.uv-cache
    defaults:
      run:
        working-directory: ${{ env.CI_CHECKOUT_PATH }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: ${{ env.CI_CHECKOUT_PATH }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
          prune-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run mutation testing on canonical.py (critical)
        run: |
          source .venv/bin/activate
          {
            echo "## Mutation Testing: canonical.py"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # The runner accepts mutmut 2.x's completed mutant statuses while
          # refusing parser failures and missing/empty machine-readable results.
          python scripts/run_mutation_testing.py --module canonical.py --timeout 50

          # Capture results
          {
            echo "### Results"
            echo '```'
            python -m mutmut results
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mutation results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: mutation-results
          path: |
            ${{ env.CI_CHECKOUT_PATH }}/.mutmut-cache
          retention-days: 30

  mutation-test-landscape:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.ref_protected
    runs-on: [self-hosted, Linux, X64, nyx-ci, trusted]
    timeout-minutes: 120  # Landscape has more code
    env:
      CI_CHECKOUT_PATH: mutation-${{ github.run_id }}-${{ github.run_attempt }}-landscape
      UV_CACHE_DIR: ${{ github.workspace }}/mutation-${{ github.run_id }}-${{ github.run_attempt }}-landscape/.uv-cache
    defaults:
      run:
        working-directory: ${{ env.CI_CHECKOUT_PATH }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: ${{ env.CI_CHECKOUT_PATH }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
          prune-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run mutation testing on landscape package
        run: |
          source .venv/bin/activate
          {
            echo "## Mutation Testing: core/landscape/"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          python scripts/run_mutation_testing.py --module landscape/ --timeout 110

          {
            echo "### Results"
            echo '```'
            python -m mutmut results
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mutation results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: mutation-results-landscape
          path: |
            ${{ env.CI_CHECKOUT_PATH }}/.mutmut-cache
          retention-days: 30
