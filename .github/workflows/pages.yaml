name: Deploy website to GitHub Pages

# Publishes the static `website/` tree only on an authorized manual dispatch
# from the protected repository default branch. Automatic push publication is
# held by the deploy job guard. The first deployment selects "GitHub Actions"
# as the Pages source via configure-pages `enablement`, then serves `website/`
# at the site root (so /tutorial-site/project-N.html resolves as before).

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yaml'
  workflow_dispatch:

# Least privilege: read the tree, mint the Pages OIDC token, write the deploy.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deploys at once; let an in-flight deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy website/ to Pages
    # Hold automatic publication while Composer fixes land; source integration
    # and schema-preservation guidance do not authorize a Pages deployment.
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.ref_protected
    runs-on: [self-hosted, Linux, X64, nyx-ci, trusted]
    env:
      CI_CHECKOUT_PATH: ci-${{ github.run_id }}-${{ github.run_attempt }}-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: ${{ env.CI_CHECKOUT_PATH }}
      - name: Configure Pages (enable + select GitHub Actions source)
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
        with:
          enablement: true
      - name: Upload website/ as the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: ${{ env.CI_CHECKOUT_PATH }}/website
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
