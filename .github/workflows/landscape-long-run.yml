# Three-case producer called by the required CI workflow.
# Nyx execution uses trusted-workgroup access and all-external fork approval.
name: Landscape long-run proofs

on:
  workflow_call:

permissions:
  contents: read

# Reusable workflows do not inherit caller env. Do not copy caller concurrency.
env:
  UV_VERSION: "0.10.2"

jobs:
  proof:
    name: Landscape ${{ matrix.proof-case }} (${{ matrix.python-version }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, nyx-ci, trusted]
    timeout-minutes: ${{ matrix.job-timeout-minutes }}
    container:
      image: ${{ matrix.ci-container-image }}
      options: --ulimit nofile=65536:524288
    env:
      CI_CHECKOUT_PATH: ci-${{ github.run_id }}-${{ github.run_attempt }}-landscape-proof-${{ matrix.proof-case }}-${{ matrix.python-version }}
      UV_PYTHON: ${{ matrix.python-version }}
      COVERAGE_FILE: coverage-data
      PROOF_CASE: ${{ matrix.proof-case }}
      PROOF_NODEID: ${{ matrix.proof-nodeid }}
      PROOF_TIMEOUT_SECONDS: ${{ matrix.execution-timeout-seconds }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        # Provisional per-case historical budgets, not isolated optimized timings.
        # Final budgets and runtime qualification remain coordinator-owned.
        include:
          - proof-case: no-escape
            proof-nodeid: tests/unit/architecture/test_web_landscape_mutation_fencing.py::test_no_mutation_alias_wrapper_dynamic_or_raw_write_escape_exists
            python-version: "3.12"
            coverage: false
            execution-timeout-seconds: 7200
            job-timeout-minutes: 150
            ci-container-image: python:3.12-bookworm@sha256:dbbe4ceb97851e2e5fa83798b239811f871cb743b259ba3563737349f6bcfaa0
          - proof-case: no-escape
            proof-nodeid: tests/unit/architecture/test_web_landscape_mutation_fencing.py::test_no_mutation_alias_wrapper_dynamic_or_raw_write_escape_exists
            python-version: "3.13"
            coverage: true
            execution-timeout-seconds: 14400
            job-timeout-minutes: 270
            ci-container-image: python:3.13-bookworm@sha256:227b6570d6ee07061ae6ca2eb04dedfb6d2b34045835f343065b9869e4d427ea
          - proof-case: reserve-actual-sources
            proof-nodeid: tests/unit/architecture/test_web_landscape_mutation_fencing.py::test_required_work_reserve_admission_on_actual_sources
            python-version: "3.12"
            coverage: false
            execution-timeout-seconds: 7200
            job-timeout-minutes: 150
            ci-container-image: python:3.12-bookworm@sha256:dbbe4ceb97851e2e5fa83798b239811f871cb743b259ba3563737349f6bcfaa0
          - proof-case: reserve-actual-sources
            proof-nodeid: tests/unit/architecture/test_web_landscape_mutation_fencing.py::test_required_work_reserve_admission_on_actual_sources
            python-version: "3.13"
            coverage: true
            execution-timeout-seconds: 14400
            job-timeout-minutes: 270
            ci-container-image: python:3.13-bookworm@sha256:227b6570d6ee07061ae6ca2eb04dedfb6d2b34045835f343065b9869e4d427ea
          - proof-case: protected-formal-recovery
            proof-nodeid: tests/unit/architecture/test_web_landscape_mutation_fencing.py::test_required_work_reserve_rejects_protected_instance_formal_recovery
            python-version: "3.12"
            coverage: false
            execution-timeout-seconds: 7200
            job-timeout-minutes: 150
            ci-container-image: python:3.12-bookworm@sha256:dbbe4ceb97851e2e5fa83798b239811f871cb743b259ba3563737349f6bcfaa0
          - proof-case: protected-formal-recovery
            proof-nodeid: tests/unit/architecture/test_web_landscape_mutation_fencing.py::test_required_work_reserve_rejects_protected_instance_formal_recovery
            python-version: "3.13"
            coverage: true
            execution-timeout-seconds: 14400
            job-timeout-minutes: 270
            ci-container-image: python:3.13-bookworm@sha256:227b6570d6ee07061ae6ca2eb04dedfb6d2b34045835f343065b9869e4d427ea

    steps:
      - name: Explain long-run proof and provisional budgets
        shell: bash
        env:
          PROOF_PYTHON_VERSION: ${{ matrix.python-version }}
          PROOF_COVERAGE: ${{ matrix.coverage }}
          PROOF_JOB_TIMEOUT_MINUTES: ${{ matrix.job-timeout-minutes }}
        run: |
          set -euo pipefail
          cat <<EOF | tee -a "$GITHUB_STEP_SUMMARY"
          ## Mandatory Landscape long-run proof
          Tested SHA: $GITHUB_SHA
          Case: $PROOF_CASE; node: $PROOF_NODEID
          Python: $PROOF_PYTHON_VERSION; coverage: $PROOF_COVERAGE
          Provisional historical execution cap: ${PROOF_TIMEOUT_SECONDS}s.
          Provisional job cap: ${PROOF_JOB_TIMEOUT_MINUTES}min, including setup/upload.
          These are not isolated optimized measurements; final qualification is pending.
          Normal marker-selected tests/ collection precedes exact case partitioning.
          All eight protected formal recovery variants remain in their original test.
          Heartbeats report child lifetime including collection, not forward progress.
          CPU usage is recorded at completion; timeout/cancellation cannot succeed.
          EOF

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: ${{ env.CI_CHECKOUT_PATH }}
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
          prune-cache: true

      - name: Use checkout-local uv cache
        run: echo "UV_CACHE_DIR=$GITHUB_WORKSPACE/$CI_CHECKOUT_PATH/.uv-cache" >> "$GITHUB_ENV"

      - name: Install system dependencies
        run: |
          apt-get update -q
          apt-get install -y -q libsqlcipher-dev jq unzip nodejs ripgrep sqlite3

      - name: Install dependencies
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: uv sync --frozen --all-extras

      - name: Run long-run proof with coverage
        if: matrix.coverage
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          uv run python scripts/ci_proof_progress.py \
            --nodeid "$PROOF_NODEID" --timeout-seconds "$PROOF_TIMEOUT_SECONDS" \
            --heartbeat-seconds 30 --grace-seconds 10 --report proof-progress.json -- \
            uv run python -m pytest tests/ -p scripts.ci_test_shards \
            --ci-partition=proof --ci-proof-case="$PROOF_CASE" \
            --ci-shard-count=1 --ci-shard-index=0 \
            --ci-shard-report=shard-manifest.json \
            --cov=src/elspeth --cov-report= --cov-fail-under=0 \
            -n 0 -q -rfE --junitxml=pytest-junit.xml

      - name: Run long-run proof without coverage
        if: ${{ !matrix.coverage }}
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          uv run python scripts/ci_proof_progress.py \
            --nodeid "$PROOF_NODEID" --timeout-seconds "$PROOF_TIMEOUT_SECONDS" \
            --heartbeat-seconds 30 --grace-seconds 10 --report proof-progress.json -- \
            uv run python -m pytest tests/ -p scripts.ci_test_shards \
            --ci-partition=proof --ci-proof-case="$PROOF_CASE" \
            --ci-shard-count=1 --ci-shard-index=0 \
            --ci-shard-report=shard-manifest.json \
            -n 0 -q -rfE --junitxml=pytest-junit.xml

      - name: Upload proof selection, coverage and execution evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: landscape-proof-${{ matrix.proof-case }}-${{ matrix.python-version }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ env.CI_CHECKOUT_PATH }}/shard-manifest.json
            ${{ env.CI_CHECKOUT_PATH }}/coverage-data
            ${{ env.CI_CHECKOUT_PATH }}/pytest-junit.xml
            ${{ env.CI_CHECKOUT_PATH }}/proof-progress.json
          if-no-files-found: error
          retention-days: 7
