<!-- @dsCard group="Components" viewport="700x430" name="Core" subtitle="Buttons · badges · cards · banners · tabs" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 18px; background: var(--color-bg); font-family: var(--font-sans); }
  .grp { margin-bottom: 18px; }
  .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--color-text-muted); font-weight: 600; margin: 0 0 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Button, TypeBadge, StatusBadge, Card, CardHeader, AlertBanner, Tabs } = window.ELSPETHDesignSystem_85edbb;
  function Group({ label, children }) {
    return <div className="grp"><p className="lbl">{label}</p><div className="row">{children}</div></div>;
  }
  function Demo() {
    const [tab, setTab] = React.useState("transforms");
    return (
      <div>
        <Group label="Buttons">
          <Button variant="primary">Run</Button>
          <Button variant="secondary">Copy YAML</Button>
          <Button variant="danger">Delete</Button>
          <Button variant="ghost">Cancel</Button>
          <Button compact>Compact</Button>
          <Button variant="primary" disabled>Disabled</Button>
        </Group>
        <Group label="Type badges">
          <TypeBadge type="source" /><TypeBadge type="transform" /><TypeBadge type="gate" />
          <TypeBadge type="sink" /><TypeBadge type="aggregation" /><TypeBadge type="coalesce" />
        </Group>
        <Group label="Status badges">
          <StatusBadge status="running" /><StatusBadge status="completed" />
          <StatusBadge status="completed_with_failures" /><StatusBadge status="failed" />
          <StatusBadge status="empty" />
        </Group>
        <Group label="Tabs">
          <Tabs value={tab} onChange={setTab} tabs={[
            { id: "sources", label: "Sources", count: 6 },
            { id: "transforms", label: "Transforms", count: 14 },
            { id: "sinks", label: "Sinks", count: 7 },
          ]} />
        </Group>
        <div style={{ display: "flex", gap: 10 }}>
          <Card style={{ flex: 1 }}>
            <CardHeader title="Pipeline saved" eyebrow="Composer" actions={<Button compact>View</Button>} />
            <div style={{ fontSize: 13, color: "var(--color-text-secondary)" }}>Version 3 validated · 5 nodes</div>
          </Card>
          <div style={{ flex: 1, display: "flex", flexDirection: "column", gap: 8 }}>
            <AlertBanner tone="error" action={<Button compact>Retry</Button>}><strong>Backend unavailable</strong></AlertBanner>
            <AlertBanner tone="success">Graph validated — 0 errors</AlertBanner>
          </div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
