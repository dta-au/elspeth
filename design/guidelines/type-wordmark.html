<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px 20px; background: var(--color-surface-nav); font-family: var(--font-sans); display: flex; flex-direction: column; gap: 14px; }
  .mark { font-family: var(--font-mono); font-weight: 700; text-transform: uppercase; letter-spacing: var(--tracking-wordmark); color: var(--color-text); }
  .val { font-family: var(--font-mono); font-size: 11px; color: var(--color-text-muted); }
</style>
</head>
<body>
  <div class="mark" style="font-size:13px">ELSPETH</div>
  <div class="mark" style="font-size:28px">ELSPETH</div>
  <div class="val">font-mono · 700 · uppercase · letter-spacing 0.18em — reproduce as text, never an image</div>
</body>
</html>
