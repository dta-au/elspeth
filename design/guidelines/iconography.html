<!-- @dsCard group="Brand" viewport="700x200" name="Iconography" subtitle="Lucide-style stroke SVG · functional unicode glyphs · no emoji" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
  body { margin: 0; padding: 18px 16px; background: var(--color-bg); font-family: var(--font-sans); }
  .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--color-text-muted); font-weight: 600; margin: 0 0 10px; }
  .row { display: flex; gap: 18px; align-items: center; color: var(--color-text-secondary); }
  .row svg { width: 22px; height: 22px; }
  .glyphs { display: flex; gap: 20px; margin-top: 18px; align-items: center; }
  .g { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .g .sym { font-size: 22px; color: var(--color-text); }
  .g .nm { font-family: var(--font-mono); font-size: 10px; color: var(--color-text-muted); }
  .note { font-size: 12px; color: var(--color-text-muted); margin-top: 16px; line-height: 1.5; }
</style>
</head>
<body>
  <p class="lbl">Stroke SVG — Lucide (stroke 1.8, round caps), inherits currentColor</p>
  <div class="row">
    <i data-lucide="git-branch"></i>
    <i data-lucide="database"></i>
    <i data-lucide="filter"></i>
    <i data-lucide="shield-check"></i>
    <i data-lucide="file-output"></i>
    <i data-lucide="play"></i>
    <i data-lucide="settings"></i>
    <i data-lucide="search"></i>
    <i data-lucide="paperclip"></i>
    <i data-lucide="send"></i>
  </div>
  <p class="lbl" style="margin-top:18px">Functional unicode glyphs</p>
  <div class="glyphs">
    <div class="g"><span class="sym">⚙</span><span class="nm">settings</span></div>
    <div class="g"><span class="sym" style="color:var(--color-warning)">⚠</span><span class="nm">warning</span></div>
    <div class="g"><span class="sym" style="color:var(--color-text-muted)">∅</span><span class="nm">empty</span></div>
    <div class="g"><span class="sym">×</span><span class="nm">close</span></div>
  </div>
  <p class="note">No emoji, no duotone, no per-icon brand colour. Icons take the colour of their context.</p>
  <script>lucide.createIcons();</script>
</body>
</html>
