sources:
  primary:
    plugin: csv
    on_success: routing
    options:
      path: ${input_csv}
      on_validation_failure: discard
      schema: {mode: fixed, fields: ["id: int", "value: int"]}
gates:
  - name: route_by_value
    input: routing
    condition: "row['value'] >= 20"
    routes: {"true": accepted, "false": rejected}
sinks:
  accepted:
    plugin: json
    on_write_failure: discard
    options:
      path: ${output_jsonl}
      format: jsonl
      schema: {mode: observed}
  rejected:
    plugin: json
    on_write_failure: discard
    options:
      path: ${fault_marker}
      format: jsonl
      schema: {mode: observed}
