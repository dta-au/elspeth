sources:
  primary:
    plugin: csv
    on_success: fork_input
    options:
      path: ${input_primary}
      on_validation_failure: discard
      schema: {mode: fixed, fields: ["id: int", "value: int"]}
gates:
  - name: fork_gate
    input: fork_input
    condition: "True"
    routes: {"true": fork, "false": discard}
    fork_to: [path_a, path_c, path_b]
transforms:
  - name: mark_a
    plugin: value_transform
    input: path_a
    on_success: merge_a
    on_error: discard
    options:
      schema: {mode: observed}
      operations: [{target: branch_marker, expression: "'a'"}]
  - name: mark_c
    plugin: value_transform
    input: path_c
    on_success: merge_c
    on_error: discard
    options:
      schema: {mode: observed}
      operations: [{target: branch_marker, expression: "'c'"}]
  - name: mark_b
    plugin: value_transform
    input: path_b
    on_success: merge_b
    on_error: discard
    options:
      schema: {mode: observed}
      operations: [{target: branch_marker, expression: "'b'"}]
coalesce:
  - name: merge_paths
    branches: {path_a: merge_a, path_b: merge_b, path_c: merge_c}
    policy: first
    merge: nested
    on_success: output
sinks:
  output:
    plugin: json
    on_write_failure: discard
    options:
      path: ${output_output}
      format: jsonl
      schema: {mode: observed}
