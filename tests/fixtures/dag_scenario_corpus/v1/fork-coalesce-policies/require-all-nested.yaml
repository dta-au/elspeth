sources:
  primary:
    plugin: csv
    on_success: fork_input
    options:
      path: ${input_primary}
      on_validation_failure: discard
      schema: {mode: fixed, fields: ["id: int", "value: int"]}
gates:
  - name: fork_gate
    input: fork_input
    condition: "True"
    routes: {"true": fork, "false": discard}
    fork_to: [path_a, path_b]
coalesce:
  - name: merge_paths
    branches: [path_a, path_b]
    policy: require_all
    merge: nested
    on_success: output
sinks:
  output:
    plugin: json
    on_write_failure: discard
    options:
      path: ${output_output}
      format: jsonl
      schema: {mode: observed}
