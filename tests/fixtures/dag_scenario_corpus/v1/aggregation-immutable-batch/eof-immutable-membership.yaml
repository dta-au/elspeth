sources:
  primary:
    plugin: csv
    on_success: batch_in
    options:
      path: ${input_primary}
      on_validation_failure: discard
      schema: {mode: fixed, fields: ["id: int", "value: int"]}
aggregations:
  - name: eof_sum
    plugin: dag_corpus_eof_batch_sum
    input: batch_in
    on_success: output
    on_error: discard
    trigger: {count: 100}
    output_mode: transform
    options:
      schema: {mode: observed}
sinks:
  output:
    plugin: json
    on_write_failure: discard
    options:
      path: ${output_output}
      format: jsonl
      schema: {mode: observed}
